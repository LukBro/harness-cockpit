[[rownowazny]]
plik = "web/src/OdbiorDowody.tsx"
linia_tekst = '      if (!zywy.current) return;'
uzasadnienie = "Strazniki zywy.current w pobierz i w gałęziach bledu zdecyduj (po fetch, po detailLubKod, w catch i finally) chronia wylacznie wywolania setState, a setState na odmontowanym komponencie React 18 ignoruje bez skutku; strazniki po fetch i po r.json() w zdecyduj sa nawzajem zbedne dla wejsc, ktore test potrafi wywolac (odmontowanie w trakcie zadania POST zatrzymuje pierwszy z nich). Jedyny straznik z widocznym skutkiem (przed odswiez) ma wiersz [[mutant]] i test odmontowania."

[[rownowazny]]
plik = "web/src/OdbiorDowody.tsx"
linia_tekst = '    setLadowanie(true);'
uzasadnienie = "Wywolanie w efekcie przy montowaniu: stan poczatkowy ladowanie to true, a efekt uruchamia sie ponownie tylko przy zmianie adresu, czyli runId; komponent ma key=runId, wiec zmiana runId tworzy nowa instancje ze stanem poczatkowym. Wersja bez wywolania nie jest odroznialna. Wywolanie w przycisku ponowienia ma osobny wiersz [[mutant]]."

[[rownowazny]]
plik = "web/src/OdbiorDowody.tsx"
linia_tekst = '  if (ladowanie && dowody === null) return <p data-testid="dowody-ladowanie">Wczytuję dowody odbioru…</p>;'
uzasadnienie = "Czlon `&& dowody === null`: ladowanie jest true tylko przy dowody === null (stan poczatkowy i ponowienie po bledzie); dowody sa ustawiane dopiero po zakonczeniu pobrania, ktore zeruje ladowanie, wiec zadne wejscie nie daje ladowanie=true z dowody!==null. Sam czlon `ladowanie` ma wiersz [[mutant]]."

[[rownowazny]]
plik = "web/src/OdbiorDowody.tsx"
linia_tekst = '  return detail ?? `błąd ${r.status}`;'
uzasadnienie = "Zamiana ?? na || : detail jest albo null, albo niepustym napisem (pusty napis i nie-napis daja null w wyrazeniu wyzej), wiec obie formy wybieraja ten sam skladnik dla kazdego wejscia."

[[rownowazny]]
plik = "web/src/OdbiorDowody.tsx"
linia_tekst = '    zywy.current = true;'
uzasadnienie = "Przypisanie w efekcie: useRef(true) daje ten sam stan poczatkowy, a jedyny przypadek, w ktorym przypisanie ma skutek (cleanup, po nim ponowny efekt), zachodzi tylko w StrictMode dewelopera; wersja produkcyjna (static, testowana w e2e) montuje efekt raz."

[[rownowazny]]
plik = "web/src/WidokRunu.tsx"
linia_tekst = '        <OdbiorDowody key={`dowody-${runId}`} runId={runId} odswiez={odswiezRun} />'
uzasadnienie = "Usuniecie key: zmiana runId ustawia w efekcie WidokRunu status=null, co odmontowuje OdbiorDowody (warunek status === to_accept), a nastepny to_accept montuje swieza instancje. Stan komponentu nie przezywa zmiany runId, wiec key nie zmienia zadnego stanu koncowego. Usuniecie `&& runId` z warunku nie kompiluje sie (runId: string | null przekazane jako string, TS2322)."


