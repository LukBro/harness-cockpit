# Tabela recznych mutantow HAR-170: ekran dowodow odbioru (trasy i modele wejscia/wyjscia w app.py i
# schematy.py, kolumna Event.dane i migracja 0014, stale modulow, front OdbiorDowody.tsx i wstawka w
# WidokRunu.tsx) - elementy, ktorych mutmut nie mutuje (kod 3 z tools/mutanty_zmian.py, web/).
# Warunki `=== null` i `!== null` w OdbiorDowody.tsx (decyzja, ryzyka.kotwice, ryzyka.mutanty, dowody)
# chroni typ: odwrocenie nie kompiluje sie (TS18047/TS2339), wiec nie ma wierszy; ich teksty i galezie
# maja wiersze przez tresc widoczna w przegladarce.
#
# Pominiete jako niezaimportowalne albo nieosiagalne: import OdbiorDowody w WidokRunu.tsx i typy
# w web/src/api.ts (usuniecie psuje build), parametr `get_session` tras (FastAPI odrzuca typ sesji
# bez Depends przy imporcie aplikacji).


