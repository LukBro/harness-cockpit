# Tabela recznych mutantow HAR-169: manifest kroku (warstwy instrukcji z sha256, lekcje filtrowane
# po zakresie) - elementy poza zasiegiem mutmuta (kod 3 z tools/mutanty_zmian.py): limity `Field(...)`
# i konfiguracja WpisManifestuIn oraz pole EventIn.manifest w app.py, stala KIND_MANIFESTU w runs.py,
# stala ZDANIE_KONTEKSTU i pole SpecKroku.kontekst w agent.py, stale, limity i dataclassy w
# runner/kontekst.py oraz dataclass WpisLekcji w lekcje.py.
#
# Pominiete jako niezaimportowalne: usuniecie domyslnej wartosci pola `kontekst` w SpecKroku (pole bez
# wartosci domyslnej po polach z domyslnymi to TypeError przy imporcie), usuniecie bazy `BaseModel`
# z WpisManifestuIn (FastAPI odrzuca typ spoza pydantic przy imporcie aplikacji).

