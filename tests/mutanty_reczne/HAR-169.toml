# wartosc poczatkowa zakresu nie jest czytana (linia z `# pragma: no mutate`)
[[rownowazny]]
plik = "src/cockpit/services/lekcje.py"
linia_tekst = "zakres: str | None = None  # pragma: no mutate"
uzasadnienie = "Wariant `zakres = \"\"` jest rownowazny: wartosc poczatkowa nie jest czytana, bo `zamknij()` przy `biezacy is None` wychodzi od razu, a kazdy naglowek `## ` ustawia `zakres = None` zanim ustawi `biezacy`; zadne wejscie nie odroznia wersji. Zerowanie przy naglowku i pierwszenstwo pierwszego zakresu maja wiersze [[mutant]] wyzej."

# mutant `lstrip("\r\n")` zamiast `rstrip("\r\n")` (linia z `# pragma: no mutate`; `rstrip()` i `rstrip("XX\r\nXX")` maja wiersze [[mutant]])
[[rownowazny]]
plik = "src/cockpit/services/lekcje.py"
linia_tekst = 'gola = linia.rstrip("\r\n")  # pragma: no mutate'
uzasadnienie = "Wariant `lstrip(\"\\r\\n\")` jest rownowazny, choc `gola` rozni sie od oryginalu na kazdej linii zakonczonej terminatorem (`lstrip` zostawia go na koncu). Kazdy odbiorca `gola` pomija koncowy terminator: `_dlugosc_plotka` liczy plotek od poczatku linii, `_zamyka_blok` robi `rstrip()`, `_NAGLOWEK` konczy sie na `\\b` (cyfra przed `\\n` i przed koncem napisu to ta sama granica slowa), `startswith(\"## \")` i `startswith(\"zakres:\")` czytaja tylko poczatek, a wartosc `zakres` przechodzi przez `strip()` w `_pola` (takze `zakres:` bez tresci daje w obu wersjach pole `{\"\": \"\"}`). Terminator na poczatku linii nie wystepuje (`splitlines` tnie na nim), wiec `lstrip` nie ma co obcinac. Zadne wejscie nie odroznia wersji. Warianty `rstrip()` i `rstrip(\"XX\\r\\nXX\")` maja wiersze [[mutant]] wyzej."

