# Tabela recznych mutantow HAR-172: elementy, ktorych mutmut nie mutuje (stale modulu, argumenty
# dekoratora dataclass, wartosci enuma, ograniczenia pol Pydantica, wartosci w SQL migracji).
# Kazde `szukaj` wystepuje w pliku dokladnie raz; kazdy wiersz zostal zweryfikowany skryptem
# (liczba wystapien, zamien != szukaj, istnienie testu, skladnia pliku po mutacji).
#
# Wiersze z testami z tests/test_migracje.py wymagaja PostgreSQL (COCKPIT_TEST_DATABASE_URL);
# bez bazy test jest pominiety i mutant "przezywa" - uruchamiaj z baza (tools/testy_pelne.sh).

