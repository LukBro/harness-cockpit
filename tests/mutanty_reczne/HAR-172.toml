# `autocommit_block` w upgrade: BEZ MUTANTA. Wiersza nie ma celowo - zmiana `with ...autocommit_block():`
# na zwykly blok jest rownowazna na PostgreSQL >= 12: `ALTER TYPE ... ADD VALUE` dziala w transakcji,
# dopoki nowa wartosc nie jest uzyta w tej samej transakcji, a migracja jej nie uzywa. Zadne wejscie
# (stan bazy, kolejnosc migracji) nie odroznia obu wersji w obsługiwanych wersjach PostgreSQL.

