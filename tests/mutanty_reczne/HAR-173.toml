# Tabela recznych mutantow HAR-173: front (web/), stale modulu runnera i warunki klienta, ktorych
# mutmut nie mutuje albo mutuje niepelnie. Kazde `szukaj` wystepuje w pliku dokladnie raz.
#
# Testy e2e (tests/e2e/test_bramka_w_przegladarce.py) wymagaja PostgreSQL, zbudowanego frontu
# i przegladarki; wiersze z `runner_online` startuja prawdziwego runnera.
#
# Elementy bez wiersza (rownowazne - zadne wejscie nie odroznia wersji):
#   - `!id ||` w wyslijDecyzje: przyciski bramki renderuja sie tylko przy `runId`, wiec `id` jest zawsze niepusty;
#   - `if (nieaktualny()) return;` PO `await r.json()` (dwa miejsca): pierwsza kontrola po `fetchZSesja`
#     konczy funkcje wczesniej, a rozbieznosc `runId` w oknie samego parsowania JSON nie da sie wywolac;
#   - `.encode("utf-8")` -> `.encode("UTF-8")` w `_zapisz_decyzje`: nazwy kodekow Pythona sa
#     niewrazliwe na wielkosc liter (codecs.lookup normalizuje nazwe), oba wywolania zwracaja te same bajty.

# =====================================================================================
# web/src/WidokRunu.tsx: widok bramki
# =====================================================================================

