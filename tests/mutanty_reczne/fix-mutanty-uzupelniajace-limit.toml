# fix-mutanty-uzupelniajace-limit: mutant sprawdzany do pierwszego oblanego testu (-x), limit 1200 s.
# Pomiar 2026-11-23: 42 pliki testow app.py (HAR-181) to 494 s na wolnym serwerze, wiec 300 s padalo zawsze.
# tools/ jest poza zasiegiem mutmuta.

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = '*(["-x"] if do_pierwszego_bledu else [])'
zamien = '*([] if do_pierwszego_bledu else [])'
test = "tests/test_mutanty_uzupelniajace.py::test_pytest_mutanta_konczy_na_pierwszym_oblanym_tescie_a_bez_mutacji_idzie_do_konca"

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = '*(["-x"] if do_pierwszego_bledu else [])'
zamien = '*(["-x"])'
test = "tests/test_mutanty_uzupelniajace.py::test_pytest_w_kopii_dostaje_polecenie_katalog_limit_i_srodowisko_z_kopia_na_poczatku_sciezki"

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = "_uruchom_pytest(kopia, testy, limit, do_pierwszego_bledu=True))"
zamien = "_uruchom_pytest(kopia, testy, limit, do_pierwszego_bledu=False))"
test = "tests/test_mutanty_uzupelniajace.py::test_mutant_jest_sprawdzany_do_pierwszego_bledu_a_testy_bez_mutacji_w_calosci"

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = "kod = _uruchom_pytest(kopia, testy, limit)"
zamien = "kod = _uruchom_pytest(kopia, testy, limit, do_pierwszego_bledu=True)"
test = "tests/test_mutanty_uzupelniajace.py::test_mutant_jest_sprawdzany_do_pierwszego_bledu_a_testy_bez_mutacji_w_calosci"

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = "LIMIT_DOMYSLNY = 1200.0"
zamien = "LIMIT_DOMYSLNY = 300.0"
test = "tests/test_mutanty_uzupelniajace.py::test_bez_flag_baza_to_origin_main_a_limit_to_1200_sekund"
