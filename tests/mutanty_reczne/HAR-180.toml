# Tabela recznych mutantow HAR-180: elementy, ktorych mutmut nie mutuje albo mutuje niepelnie --
# trasy z dekoratorami (app.py), stale i pola modeli (schematy.py), kolumny modelu (models.py),
# migracja 0015, krotka `except` i konfiguracja parsera (projekt.py), wpis mapy kodow bledow
# (bledy.py), tylda w zakresie runnera (zakres.py), warunki zapytania skilli oraz plik
# `web/openapi.json`. Kazde `szukaj` wystepuje w pliku dokladnie raz.
#
# Testy migracji (tests/test_migracje.py) wymagaja PostgreSQL (COCKPIT_TEST_DATABASE_URL);
# bez niego sa pomijane, a pominiecie nie jest zabiciem mutanta.
#
# Elementy bez wiersza (rownowazne -- zadne wejscie nie odroznia wersji):
#   - `@classmethod` pod `@field_validator("capabilities")` w ZmianaProjektu: pydantic v2 owija
#     funkcje w classmethod sam, wiec usuniecie dekoratora daje ten sam walidator;
#   - `sa.JSON(none_as_null=True)` -> `sa.JSON()` w migracji 0015: flaga dziala po stronie Pythona
#     przy zapisie, DDL kolumny jest identyczny; flaga modelu ma wiersze nizej (models.py);
#   - `revision: str = "0015"` w migracji: nazwa pliku i `down_revision` wyznaczaja graf, a testy
#     migracji adresuja rewizje przez `head` i `0014`;
#   - `dostep.wymagaj(k, Uprawnienie.podglad)` w trasach GET skilli: kazda rola zespolu ma
#     `podglad`, wiec zadne wejscie z sesja nie odroznia wersji bez wywolania (wiersze dla zmiany
#     uprawnienia na inne sa nizej).

