# Tabela recznych mutantow HAR-84: typy frontu z kontraktu (web/), miejsca, ktorych mutmut nie mutuje.
# Mutanty nie psuja buildu bazowego kopii: kopia nie ma web/src/api-types.ts (plik ignorowany),
# wiec build po mutacji zawsze generuje go sam (`npm run types`).

# --- web/package.json: generowanie typow w samym `build` (nie w `prebuild`) ---

[[mutant]]
plik = "web/package.json"
szukaj = '''"build": "npm run types && tsc -b && vite build",'''
# generowanie wraca do `prebuild` (stan sprzed HAR-84): build kopii nadal przechodzi
zamien = '''"prebuild": "npm run types",
    "build": "tsc -b && vite build",'''
test = "tests/test_typy_frontu.py::test_budowanie_frontu_samo_generuje_typy_z_pliku_kontraktu_przed_kompilacja"

# --- web/src/api.ts: alias zalezny od kontraktu zastapiony typem niezaleznym od niego ---

