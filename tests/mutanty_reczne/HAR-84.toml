plik = "web/src/api.ts"
szukaj = '''export type RunSzczegoly = Schemat["RunSzczegoly"];'''
zamien = '''export type RunSzczegoly = any;'''
test = "tests/e2e/test_typy_frontu_z_kontraktu.py::test_pole_usuniete_z_kontraktu_api_oblewa_kompilacje_frontu[RunSzczegoly-status]"

