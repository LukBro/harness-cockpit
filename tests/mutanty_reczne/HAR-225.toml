test = "tests/test_workflow_mutacje.py::test_nieoczekiwany_kod_sprawdzenia_tabel_tez_oblewa_krok"

# Krok nie ma warunku zmienionych tabel.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "- name: sprawdzenie tabel mutantów ręcznych"
zamien = "- name: sprawdzenie tabel mutantów ręcznych\n        if: steps.front.outputs.tabele == '1'"
test = "tests/test_workflow_mutacje.py::test_krok_sprawdzenia_tabel_nie_ma_warunku_if_wiec_wykonuje_sie_na_kazdym_pr"

# --- runda poprawkowa: gałęzie błędu pliku, kolekcja, środowisko kolekcji, artefakt ------

# Gałąź błędu pliku w `_blad_pliku_i_licznika`: bez niej `.count` leci na wyjątku zamiast błędu wiersza.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if isinstance(tresc, BladNarzedzia):"
zamien = "if False:"
test = "tests/test_mutanty_reczne.py::test_wiersz_z_plikiem_ktorego_nie_ma_w_repozytorium_to_blad_tego_wiersza_z_nazwa_pliku_a_reszta_jest_sprawdzana"

# Zapis błędu pliku do `tresci`: bez niego odczyt następnego wiersza kończy się KeyError.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "tresci[mutant.plik] = blad"
zamien = "pass"
test = "tests/test_mutanty_reczne.py::test_ten_sam_nieczytelny_plik_wskazany_przez_dwa_wiersze_daje_blad_przy_obu"

# Plik w innym kodowaniu niż UTF-8: błąd z nazwą pliku, nie wyjątek.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "return str(tresc)"
zamien = "return None"
test = "tests/test_mutanty_reczne.py::test_wiersz_z_plikiem_w_kodowaniu_innym_niz_utf8_to_blad_z_nazwa_pliku_a_nie_wyjatek"

# Kod kolekcji != 0 to błąd, także gdy wszystkie node id zostały zebrane.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if kod:"
zamien = "if False:"
test = "tests/test_mutanty_reczne.py::test_kolekcja_zakonczona_kodem_innym_niz_zero_to_kod_2_nawet_gdy_wszystkie_node_id_zostaly_zebrane"

# `-o addopts=` w kolekcji (w uruchom_test jest inny kontekst): bez niego marker z addopts odznacza test.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''"-o", "addopts=",
        *pliki,'''
zamien = "*pliki,"
test = "tests/test_mutanty_reczne.py::test_test_oznaczony_markerem_wykluczonym_w_addopts_projektu_jest_zebrany_wiec_wiersz_istnieje"

# `-p no:cacheprovider` w kolekcji: bez niego powstaje `.pytest_cache` w repozytorium użytkownika.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''"-p", "no:cacheprovider", "-o", "addopts=",
        *pliki,'''
zamien = '''"-o", "addopts=",
        *pliki,'''
test = "tests/test_mutanty_reczne.py::test_sprawdzenie_z_blednym_plikiem_testu_nie_zostawia_cache_pytesta_w_repozytorium_uzytkownika"

# `PYTHONDONTWRITEBYTECODE` w kolekcji: bez niego powstaje `__pycache__` w repozytorium użytkownika.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'srodowisko["PYTHONDONTWRITEBYTECODE"] = "1"'
zamien = 'srodowisko.pop("PYTHONDONTWRITEBYTECODE", None)'
test = "tests/test_mutanty_reczne.py::test_sprawdzenie_nie_zostawia_bajtkodu_w_repozytorium_uzytkownika"

# `str(korzen / "src")` w PYTHONPATH kolekcji: moduł tylko z `src/` przestaje być importowalny.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'str(korzen / "src")'
zamien = "str(korzen)"
test = "tests/test_mutanty_reczne.py::test_kolekcja_widzi_modul_z_katalogu_src_repozytorium_bez_instalacji_i_bez_pythonpath_z_zewnatrz"

# `[stare] if stare` w PYTHONPATH kolekcji: PYTHONPATH wołającego przepada.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '[str(korzen / "src"), *([stare] if stare else [])]'
zamien = '[str(korzen / "src"), *([] if stare else [])]'
test = "tests/test_mutanty_reczne.py::test_kolekcja_zachowuje_pythonpath_wolajacego_obok_katalogu_src_repozytorium"

# `args.czy_front` w warunku `parser.error`: opcja nie jest po cichu ignorowana.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if args.sprawdz_wszystkie and (args.tabele or args.czy_front):"
zamien = "if args.sprawdz_wszystkie and (args.tabele):"
test = "tests/test_mutanty_reczne.py::test_sprawdz_wszystkie_razem_z_czy_front_to_blad_wiersza_polecen_a_nie_ciche_pominiecie_opcji"

# Artefakt zadania PR: ścieżka stdout sprawdzenia tabel.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''mutants/mutanty-reczne.err
            mutants/tabele-reczne.txt'''
zamien = "mutants/mutanty-reczne.err"
test = "tests/test_workflow_mutacje.py::test_zadanie_pull_requestu_publikuje_wynik_sprawdzenia_tabel_nawet_po_czerwonym_kroku"

# Artefakt zadania PR: ścieżka stderr sprawdzenia tabel.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''mutants/tabele-reczne.txt
            mutants/tabele-reczne.err'''
zamien = "mutants/tabele-reczne.txt"
test = "tests/test_workflow_mutacje.py::test_zadanie_pull_requestu_publikuje_wynik_sprawdzenia_tabel_nawet_po_czerwonym_kroku"

# Gałąź `0)` pokazuje w podsumowaniu wynik sprawdzenia (liczbę wierszy).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''0)
                cat mutants/tabele-reczne.txt'''
zamien = '''0)
                echo ok'''
test = "tests/test_workflow_mutacje.py::test_sprawdzenie_tabel_z_kodem_0_pokazuje_w_podsumowaniu_liczbe_sprawdzonych_wierszy_pod_naglowkiem"

# --- runda poprawkowa 2: brak tabel, blad dysku przy pliku testu, koncowka kolekcji ---------

# Katalog bez zadnej tabeli to blad (brak dowodu), nie zielone.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if not tabele:"
zamien = "if False:"
test = "tests/test_mutanty_reczne.py::test_katalog_tabel_bez_zadnej_tabeli_to_kod_2_a_nie_zielone"

# `OSError` przy sprawdzaniu pliku testu to blad tego wiersza (reszta jest dalej sprawdzana).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''except OSError as blad:
        return f"{plik_testu}: nie da sie sprawdzic'''
zamien = '''except ZeroDivisionError as blad:
        return f"{plik_testu}: nie da sie sprawdzic'''
test = "tests/test_mutanty_reczne.py::test_plik_testu_ktorego_dysk_nie_pozwala_sprawdzic_to_blad_tego_wiersza_a_reszta_jest_sprawdzana"

# Komunikat bledu kolekcji niesie koncowke jej wyjscia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "{wyjscie[-KONCOWKA_KOLEKCJI:]}"
zamien = "x"
test = "tests/test_mutanty_reczne.py::test_kolekcja_zakonczona_kodem_innym_niz_zero_to_kod_2_nawet_gdy_wszystkie_node_id_zostaly_zebrane"
