# Tabela recznych mutantow HAR-225: tryb `--sprawdz-wszystkie` w tools/mutanty_reczne.py i krok
# `sprawdzenie tabel mutantów ręcznych` w .github/workflows/mutation.yml (miejsca, ktorych mutmut
# nie mutuje: tools/ i .github/). Wiersz: element | mutacja | test, ktory po mutacji oblewa.

# --- wspolna definicja "dokladnie raz" --------------------------------------------

# Zero wystapien przechodzi (zostaje tylko ">1" jako blad).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if ile != 1:"
zamien = "if ile > 1:"
test = "tests/test_mutanty_reczne.py::test_szukaj_wystepujace_inaczej_niz_raz_to_blad_wiersza_z_numerem_i_liczba_wystapien"

# Dwa wystapienia przechodza (zostaje tylko "0" jako blad).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if ile != 1:"
zamien = "if ile < 1:"
test = "tests/test_mutanty_reczne.py::test_szukaj_wystepujace_inaczej_niz_raz_to_blad_wiersza_z_numerem_i_liczba_wystapien"

# Liczba wystapien w komunikacie to faktyczna liczba.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "wystepuje {ile} razy, a ma dokladnie raz"
zamien = "wystepuje {ile + 1} razy, a ma dokladnie raz"
test = "tests/test_mutanty_reczne.py::test_szukaj_wystepujace_inaczej_niz_raz_to_blad_wiersza_z_numerem_i_liczba_wystapien"

# Plik z `szukaj` jest sprawdzany: wystapienia nie raz to blad wiersza.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''try:
        _wymagaj_dokladnie_raz(tresc, mutant)'''
zamien = '''try:
        pass'''
test = "tests/test_mutanty_reczne.py::test_szukaj_wystepujace_inaczej_niz_raz_to_blad_wiersza_z_numerem_i_liczba_wystapien"

[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if powod_pliku is not None:"
zamien = "if False:"
test = "tests/test_mutanty_reczne.py::test_szukaj_wystepujace_inaczej_niz_raz_to_blad_wiersza_z_numerem_i_liczba_wystapien"

# --- katalog tabel ---------------------------------------------------------------

# Katalog tabel to tests/mutanty_reczne.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'KATALOG_TABEL = ("tests", "mutanty_reczne")'
zamien = 'KATALOG_TABEL = ("tests", "inne")'
test = "tests/test_mutanty_reczne.py::test_poprawne_tabele_daja_kod_0_z_liczba_wierszy_i_tabel_a_repozytorium_zostaje_bez_zmian"

# Tylko `*.toml` jest tabela (README.md w katalogu nie jest czytany).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'if k.name.endswith(".toml")'
zamien = "if k.name"
test = "tests/test_mutanty_reczne.py::test_katalog_tabel_bez_zadnej_tabeli_to_kod_2_a_nie_zielone"

# Tabele w kolejnosci nazw.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "key=lambda k: k.name"
zamien = "key=lambda k: k.name, reverse=True"
test = "tests/test_mutanty_reczne.py::test_bledy_z_kilku_tabel_i_kilku_wierszy_sa_zebrane_naraz_w_kolejnosci_nazw_tabel"

# Brak katalogu tabel to blad dziedziny, nie wyjatek.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''except OSError as blad:
        raise BladNarzedzia(f"nie da sie odczytac katalogu tabel {katalog}'''
zamien = '''except PermissionError as blad:
        raise BladNarzedzia(f"nie da sie odczytac katalogu tabel {katalog}'''
test = "tests/test_mutanty_reczne.py::test_brak_katalogu_tabel_to_kod_2_a_nie_zielone"

# Nazwa tabeli w komunikacie: sciezka wzgledna od korzenia, nie bezwzgledna.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "nazwa = tabela.relative_to(korzen).as_posix()"
zamien = "nazwa = str(tabela)"
test = "tests/test_mutanty_reczne.py::test_bledy_z_kilku_tabel_i_kilku_wierszy_sa_zebrane_naraz_w_kolejnosci_nazw_tabel"

# --- zbieranie bledow tabel i wierszy ----------------------------------------------

# Numeracja wierszy od 1 (tabela poprawna strukturalnie).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "list(enumerate(wczytaj_tabele(sciezka), start=1)), []"
zamien = "list(enumerate(wczytaj_tabele(sciezka), start=0)), []"
test = "tests/test_mutanty_reczne.py::test_szukaj_wystepujace_inaczej_niz_raz_to_blad_wiersza_z_numerem_i_liczba_wystapien"

# Numeracja wierszy od 1 (tabela z blednym wpisem).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "for numer, wpis in enumerate(wpisy, start=1):"
zamien = "for numer, wpis in enumerate(wpisy, start=0):"
test = "tests/test_mutanty_reczne.py::test_niepoprawny_wpis_ma_linie_z_numerem_i_powodem_a_nastepne_wiersze_sa_dalej_sprawdzane"

# Blad calej tabeli ma wlasna linie.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'return [], [f"{nazwa}: {blad}"]'
zamien = "return [], []"
test = "tests/test_mutanty_reczne.py::test_blad_calej_tabeli_ma_linie_bez_numeru_a_pozostale_tabele_sa_dalej_sprawdzane"

# Linia bledu wiersza niesie numer wpisu.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'bledy.append(f"{nazwa} #{numer}: {blad}")'
zamien = 'bledy.append(f"{nazwa}: {blad}")'
test = "tests/test_mutanty_reczne.py::test_niepoprawny_wpis_ma_linie_z_numerem_i_powodem_a_nastepne_wiersze_sa_dalej_sprawdzane"

# Poprawne wiersze zepsutej tabeli sa dalej sprawdzane (zebranie wielu bledow).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "wiersze.append((numer, _wpis_na_mutanta(wpis)))"
zamien = "_wpis_na_mutanta(wpis)"
test = "tests/test_mutanty_reczne.py::test_niepoprawny_wpis_ma_linie_z_numerem_i_powodem_a_nastepne_wiersze_sa_dalej_sprawdzane"

# Pierwszy blad nie przerywa zbierania (zamiast przerwania).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'bledy.append(f"{nazwa} #{numer}: {blad}")'
zamien = '''bledy.append(f"{nazwa} #{numer}: {blad}")
            break'''
test = "tests/test_mutanty_reczne.py::test_niepoprawny_wpis_ma_linie_z_numerem_i_powodem_a_nastepne_wiersze_sa_dalej_sprawdzane"

# Bledy jednej tabeli nie gubia sie przy sprawdzaniu nastepnych.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "bledy.extend(bledy_tabeli)"
zamien = "pass"
test = "tests/test_mutanty_reczne.py::test_blad_calej_tabeli_ma_linie_bez_numeru_a_pozostale_tabele_sa_dalej_sprawdzane"

# Poprawne wiersze wszystkich tabel trafiaja do sprawdzenia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "wiersze.extend((nazwa, numer, mutant) for numer, mutant in poprawne)"
zamien = "wiersze.extend([])"
test = "tests/test_mutanty_reczne.py::test_poprawne_tabele_daja_kod_0_z_liczba_wierszy_i_tabel_a_repozytorium_zostaje_bez_zmian"

# --- istnienie testu ---------------------------------------------------------------

# Brak pliku testu to blad wiersza z nazwa pliku (bez wolania pytesta dla niego).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'return None if istnieje else f"test {test} nie istnieje: brak pliku {plik_testu}"'
zamien = "return None"
test = "tests/test_mutanty_reczne.py::test_wiersz_z_plikiem_testu_ktorego_nie_ma_na_dysku_to_blad_tego_wiersza_a_reszta_jest_sprawdzana"

# Wiersz z istniejacym plikiem testu idzie do kolekcji.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "do_kolekcji.append((nazwa, numer, mutant))"
zamien = "pass"
test = "tests/test_mutanty_reczne.py::test_wiersz_z_nieistniejacym_testem_to_kod_2_bez_nakladania_mutacji_i_bez_zmian_w_repozytorium"

[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if do_kolekcji:"
zamien = "if False:"
test = "tests/test_mutanty_reczne.py::test_wiersz_z_nieistniejacym_testem_to_kod_2_bez_nakladania_mutacji_i_bez_zmian_w_repozytorium"

# Node id spoza zebranych to blad wiersza.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if not _istnieje_node_id(mutant.test, zebrane):"
zamien = "if False:"
test = "tests/test_mutanty_reczne.py::test_wiersz_z_nieistniejacym_testem_to_kod_2_bez_nakladania_mutacji_i_bez_zmian_w_repozytorium"

# Komunikat: "nie istnieje" i node id.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "nie istnieje wsrod zebranych testow"
zamien = "jest nieobecny wsrod zebranych testow"
test = "tests/test_mutanty_reczne.py::test_wiersz_z_nieistniejacym_testem_to_kod_2_bez_nakladania_mutacji_i_bez_zmian_w_repozytorium"

# Node id dokladnie na liscie zebranych.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "return test in zebrane or any("
zamien = "return False or any("
test = "tests/test_mutanty_reczne.py::test_node_id_funkcji_parametryzowanej_bez_nawiasu_istnieje_ale_prefiks_innej_funkcji_nie"

# Funkcja parametryzowana bez nawiasu istnieje.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'or any(z.startswith(f"{test}[") for z in zebrane)'
zamien = "or False"
test = "tests/test_mutanty_reczne.py::test_node_id_funkcji_parametryzowanej_bez_nawiasu_istnieje_ale_prefiks_innej_funkcji_nie"

# Prefiks nazwy innej funkcji nie jest istniejacym testem (zawezenie do `[`).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'z.startswith(f"{test}[")'
zamien = "z.startswith(test)"
test = "tests/test_mutanty_reczne.py::test_node_id_funkcji_parametryzowanej_bez_nawiasu_istnieje_ale_prefiks_innej_funkcji_nie"

# Kolekcja, nie wykonanie testow.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '"--collect-only", '
zamien = ""
test = "tests/test_mutanty_reczne.py::test_poprawne_tabele_daja_kod_0_z_liczba_wierszy_i_tabel_a_repozytorium_zostaje_bez_zmian"

# Kolekcja widzi `src/` repozytorium (PYTHONPATH).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '[str(korzen / "src"), *([stare] if stare else [])]'
zamien = "[*([stare] if stare else [])]"
test = "tests/test_mutanty_reczne.py::test_poprawne_tabele_daja_kod_0_z_liczba_wierszy_i_tabel_a_repozytorium_zostaje_bez_zmian"

# Kolekcja startuje w korzeniu repozytorium (sciezki testow sa wzgledne).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'polecenie, korzen, srodowisko, limit, "kolekcji testow"'
zamien = 'polecenie, korzen / "src", srodowisko, limit, "kolekcji testow"'
test = "tests/test_mutanty_reczne.py::test_poprawne_tabele_daja_kod_0_z_liczba_wierszy_i_tabel_a_repozytorium_zostaje_bez_zmian"

# Limit czasu z wiersza polecen dociera do kolekcji (dwa miejsca przekazania).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "sprawdz_wszystkie_tabele(korzen, args.limit, bledy)"
zamien = "sprawdz_wszystkie_tabele(korzen, LIMIT_DOMYSLNY, bledy)"
test = "tests/test_mutanty_reczne.py::test_przekroczony_limit_czasu_kolekcji_to_kod_2_a_nie_wyjatek_ani_zielone"

[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "zebrane = _zbierz_node_id(korzen, pliki, limit)"
zamien = "zebrane = _zbierz_node_id(korzen, pliki, LIMIT_DOMYSLNY)"
test = "tests/test_mutanty_reczne.py::test_przekroczony_limit_czasu_kolekcji_to_kod_2_a_nie_wyjatek_ani_zielone"

