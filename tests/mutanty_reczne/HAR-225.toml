# --- krok CI `sprawdzenie tabel mutantów ręcznych` ------------------------------------

# Krok wola narzedzie z `--sprawdz-wszystkie`.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "mutanty_reczne.py --sprawdz-wszystkie > mutants/tabele-reczne.txt"
zamien = "mutanty_reczne.py > mutants/tabele-reczne.txt"
test = "tests/test_workflow_mutacje.py::test_sprawdzenie_tabel_wola_narzedzie_z_opcja_sprawdz_wszystkie_takze_gdy_pr_nie_zmienia_zadnej_tabeli"

# Krok sam tworzy katalog `mutants/`.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''mkdir -p mutants
          kod=0
          python3 tools/mutanty_reczne.py --sprawdz-wszystkie'''
zamien = '''kod=0
          python3 tools/mutanty_reczne.py --sprawdz-wszystkie'''
test = "tests/test_workflow_mutacje.py::test_sprawdzenie_tabel_z_kodem_0_tworzy_katalog_mutants_na_wyniki_gdy_go_nie_ma"

# Podsumowanie pod wlasnym naglowkiem.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'echo "## Tabele mutantów ręcznych"'
zamien = 'echo "## Inne"'
test = "tests/test_workflow_mutacje.py::test_krok_sprawdzenia_tabel_pisze_podsumowanie_pod_wlasnym_naglowkiem"

# Blad narzedzia nie jest ukryty kodem 0.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "tabele-reczne.err || kod=$?"
zamien = "tabele-reczne.err || kod=0"
test = "tests/test_workflow_mutacje.py::test_zepsute_wiersze_tabel_oblewaja_krok_a_bledy_sa_w_podsumowaniu_i_w_linii_bledu_ci"

# Stderr narzedzia trafia do pliku, z ktorego czyta podsumowanie.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "2> mutants/tabele-reczne.err"
zamien = "2> /dev/null"
test = "tests/test_workflow_mutacje.py::test_zepsute_wiersze_tabel_oblewaja_krok_a_bledy_sa_w_podsumowaniu_i_w_linii_bledu_ci"

# Tresc bledow w podsumowaniu.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "cat mutants/tabele-reczne.err"
zamien = "echo bledy-ukryte"
test = "tests/test_workflow_mutacje.py::test_zepsute_wiersze_tabel_oblewaja_krok_a_bledy_sa_w_podsumowaniu_i_w_linii_bledu_ci"

# Linia `::error::` przy kodzie != 0.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'echo "::error::sprawdzenie tabel mutantów ręcznych'
zamien = 'echo "sprawdzenie tabel mutantów ręcznych'
test = "tests/test_workflow_mutacje.py::test_zepsute_wiersze_tabel_oblewaja_krok_a_bledy_sa_w_podsumowaniu_i_w_linii_bledu_ci"

# Kod != 0 oblewa krok (`exit 1`).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''tr '\n' ' ' < mutants/tabele-reczne.err)"
            exit 1'''
zamien = '''tr '\n' ' ' < mutants/tabele-reczne.err)"
