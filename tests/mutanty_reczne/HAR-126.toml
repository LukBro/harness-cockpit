# Tabela recznych mutantow HAR-126: anulowanie runu przez czlowieka (`POST /api/runs/{run_id}/cancel`,
# `cancel_run` u runnera). Kazde `szukaj` wystepuje w pliku dokladnie raz.
#
# Wiersze z blokada wiersza (`with_for_update`) ida na PostgreSQL: test ma marker `baza`
# i wymaga COCKPIT_TEST_DATABASE_URL=postgresql+asyncpg://.../cockpit_test.
#
# `Uprawnienie.uruchamianie` zamiast `Uprawnienie.zatwierdzanie` w trasie anulowania: role maja
# oba uprawnienia razem, ale odmowa dla obserwatora niesie nazwe czynnosci z uprawnienia
# ("zatwierdzac bramek"), wiec pelna tresc 403 odroznia mutanta.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = '''    dostep.wymagaj(k, Uprawnienie.zatwierdzanie)
    run, ev, polecenie = await uslugi.anuluj_run('''
zamien = '''    dostep.wymagaj(k, Uprawnienie.uruchamianie)
    run, ev, polecenie = await uslugi.anuluj_run('''
test = "tests/test_dostep_http.py::test_obserwator_nie_anuluje_runu_swojego_zespolu_i_run_trwa_dalej"

