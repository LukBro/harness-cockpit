# Tabela recznych mutantow HAR-241: tools/mutanty_uzupelniajace.py (miejsce, ktorego mutmut nie
# mutuje: tools/). Wiersz: element | mutacja | test, ktory po mutacji oblewa.
#
# Krok `mutanty uzupelniajace` w .github/workflows/mutation.yml (usuniecie `exit 1`, baza z BASE_REF)
# ma wiersze na koncu tabeli; chronia go testy tests/test_workflow_mutacje.py (HAR-241).
#
# Wiersze pokrywaja: zamknieta liste ksztaltow, zasieg (funkcje, klasy, funkcje w instrukcjach zlozonych),
# opisy mutantow, przekazywanie `limit`, flagi i bajty w `re.compile`, flagi globalne wzorca, cyfry osemkowe,
# ucieczke z literka u i `\N{...}`, prefiks grupy `(?L:...)`, `a.b.compile`, OverflowError, straznik
# `git ls-files` dla nowych plikow, przeniesienie pliku do src/, liczbe kopii repozytorium, bledy odczytu
# zrodla, sprzatanie kopii i polecenie pytesta.
#
# NIEPOKRYTE (znane luki, brak wiersza i brak testu; nie sa zielone, tylko niesprawdzone):
# - flagi wzorca po komentarzu `(?#...)` oraz po `(?x)` (rozbior wzorca nie rozroznia ich od flag globalnych);
# - flaga TEMPLATE (`re.T`) i uznanie jej za rownowazna: nie sprawdzono jej uruchomionym mutantem;
# - dokladne komunikaty bledow narzedzia (wiersze sprawdzaja kod 2 i fragmenty, nie caly tekst);
# - zawieszenia mutantow (mutant z petla nieskonczona konczy sie dopiero limitem czasu pytesta).
#
# Rownowazne (zadne wejscie nie odroznia wersji). KAZDY z ponizszych mutantow uruchomiono osobna tabela
# (`python tools/mutanty_reczne.py <tabela>`, kod 1: przezyl test wskazany w jej wierszu), a
# rownowaznosc uzasadnia wejscie, ktorego nie ma:
# - `_skompiluj(nowy, bajtowy, flagi)` -> `_skompiluj(nowy, bajtowy, 0)` w petli mutantow oraz
#   `if przekazane else 0` -> `else 2`: flagi I, M, S, A i DEBUG nie zmieniaja, czy wzorzec sie kompiluje;
#   U, L i zgodnosc z typem wzorca sprawdza kompilacja ORYGINALU z tymi samymi flagami (zle -> blad
#   narzedzia), X odrzuca `_flagi_wywolania`, a usuniecie kotwicy, elementu klasy albo alternatywy nie
#   zmienia typu wzorca ani nie dodaje flagi globalnej (stoja tylko na poczatku, poza usuwanymi przedzialami).
#   Przeszukanie: 2067081 par (wzorzec do 5 znakow z alfabetu `^$|()[]?:ai-=La`, flagi I/A/M|S/U oraz
#   dla bajtow I/A/L/M|S) z oryginalem kompilujacym sie z ta flaga - zero roznic miedzy mutantami z flagami
#   i bez nich;
# - `_wartosc_flag(przekazane[0])` -> `przekazane[-1]`: przy jednym elemencie listy indeksy 0 i -1 to to
#   samo (dwa i wiecej elementow konczy sie bledem wczesniej);
# - `nastepna is not None and` w `_zamiary_instrukcji`: `_samodzielne_wywolanie(None)` jest False;
# - `A-Z` w drugim i trzecim `[a-zA-Z]+` z `PREFIKS_GRUPY` (po `-`): uruchomione mutanty `(?:-[a-z]+)?:`
#   i `|-[a-z]+:)` przezyly test, bo flagi po `-` musza byc male (`(?-L:a)`, `(?i-L:a)` i `(?-S:a)` nie
#   kompiluja sie), a wzorzec odrzucony przez `re.compile` nie ma mutantow;
# - `w_funkcji or` w `_analiza`: `_stala_do_zbadania(FunctionDef)` jest zawsze True;
# - `ast.copy_location(ast.Pass(), instrukcja)`: `ast.unparse` nie czyta numerow linii;
# - `--src-prefix=a/` w `_zmiany`: parser czyta tylko linie `+++ b/...`;
# - `or not isinstance(lista[0], ast.stmt)`: kazde pole `body`/`orelse`/`finalbody` bedace lista zawiera
#   instrukcje;
# - `if reczne or dotkniete:` -> `if dotkniete:` (przebieg bez mutantow): `reczne` jest niepuste tylko dla
#   zakresu z wywolaniem `re.compile`, a taki zakres nie jest importem ani docstringiem, wiec jego start jest
#   w `dotkniete`; nie ma wejscia z `reczne` bez `dotkniete`;
# - `sorted(set(reczne))` -> `sorted(reczne)` / `list(reczne)` / `reczne` w kodzie 3 po zabitych mutantach:
#   `reczne` powstaje z wynikow `_analiza`, ktore sa juz posortowane i bez powtorzen w pliku, a pliki ida
#   w kolejnosci `sorted(zmiany)`; nie ma wejscia z powtorzona albo nieposortowana pozycja;
# - `sorted(set(dotkniete))` -> `dotkniete` w `_analiza`: kazda instrukcja `drzewo.body` (i kazda stala w
#   ciele klasy) dodaje swoj start dokladnie raz, w kolejnosci rosnacych linii; funkcje zdefiniowane w instrukcji
#   zlozonej (`_funkcje_w_instrukcji`) ida zaraz po niej w kolejnosci zrodla, kazda raz (nie rozbiera
#   funkcji w funkcjach), wiec start instrukcji < starty jej funkcji < start nastepnej instrukcji;
# - `any(isinstance(p, ast.Starred) for p in przekazane)` w `_flagi_wywolania`: gwiazdke w argumentach
#   pozycyjnych odrzuca juz `_wzorzec_re_compile`, a wartosc `flags=` nie moze byc gwiazdka (`**kw` to nieznany
#   argument nazwany); nie ma wejscia, ktore dociera do tego warunku z gwiazdka.
# Nieosiagalne (nie ma wiersza, bo nie ma kodu): wzorzec konczacy sie pojedynczym `\` nie przechodzi
# `re.compile` ("bad escape (end of pattern)"), wiec `_koniec_ucieczki` nigdy nie czyta znaku za koncem.

