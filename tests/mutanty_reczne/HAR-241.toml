# Tabela recznych mutantow HAR-241: tools/mutanty_uzupelniajace.py (miejsce, ktorego mutmut nie
# mutuje: tools/). Wiersz: element | mutacja | test, ktory po mutacji oblewa.
#
# Krok `mutanty uzupelniajace` w .github/workflows/mutation.yml (usuniecie `exit 1`, baza z BASE_REF)
# ma wiersze na koncu tabeli; chronia go testy tests/test_workflow_mutacje.py (HAR-241).
#
# LUKI TESTOW (nie rownowaznosc): elementy bez wiersza, bo zaden test ich nie odroznia. Oznaczenie
# [mutacja] = mutant uruchomiony na tych testach i PRZEZYL; [bez proby] = brak testu na ten element,
# mutacji nie uruchamiano.
# - [mutacja] test `ucieczka_u` w tests/test_mutanty_uzupelniajace.py ma w pliku litere `A` zamiast
#   `A` (sprawdzone na bajtach: sekwencji backslash-u0041 w pliku nie ma; przyczyny nie badano),
#   wiec galaz `\u` w `_koniec_ucieczki` (`return poczatek + 6`) nie jest chroniona;
# - [mutacja] `_zmiany`: `if nowe.returncode != 0:` - test `_zepsuj_git[ls_files]` psuje kazde
#   `git ls-files`, takze to z `skopiuj_repo`, wiec komunikat `git ls-files nie powiodl sie` pojawia sie
#   i bez straznika; potrzebny test psujacy tylko wywolanie z `--others`;
# - [mutacja] `_przebieg`: `except (OSError, UnicodeDecodeError)` przy czytaniu zrodla zmienionego pliku
#   (element `UnicodeDecodeError`; nowy nieczytelny plik zatrzymuje wczesniej `mutanty_zmian`),
#   `except FileNotFoundError: continue` i `dotkniete = dotkniete or dotyka` (brak testu z dwoma plikami);
# - [mutacja] `_zamiary_instrukcji`: `and _samodzielne_wywolanie(nastepna)` (brak testu z wywolaniem
#   przed instrukcja niebedaca wywolaniem); `_stala_do_zbadania`: `isinstance(wezel, ast.Expr)`
#   (brak testu ze stala tekstowa `X = "a"`); `_usuniecia_elementow`: etykiety `krotki` i `zbioru`
#   (opis sprawdzany tylko dla mapy i `except`); `_tekst`: ucinanie opisu dluzszego niz 60 znakow;
# - [mutacja] regex: `if nowy in widziane` (dwa usuniecia dajace ten sam wzorzec), `except re.error`
#   przy kompilacji wzorca zrodlowego, `isinstance(pierwszy, ast.Constant)` i `not wezel.args`
#   (`re.compile(WZORZEC)` / `re.compile()`), cyfra `7` w `tuple("01234567")`;
# - [mutacja] `_rownowazne`: filtr `.toml` w katalogu tabel i `except OSError` przy jego czytaniu;
# - [mutacja] `_warianty_wzorca`: `and kreski` w `if poczatek is not None and kreski:` - wzorzec
#   `(?i:ab)` bez `|` daje po usunieciu zawartosci wzorzec `(?i)`, ktory sie kompiluje, wiec mutant
#   istnieje; zaden test nie ma grupy z flaga i bez `|`;
# - [mutacja] `_warianty_wzorca`: `stos[-1][0] is not None` w `elif znak == "|":` - zamiana na `stos`
#   przezyla (kod jest redundantny wzgledem `poczatek is not None` przy zamknieciu grupy, ale to nie
#   uzasadnia rownowaznosci; test sprawdza tylko wynik koncowy dla `(?>ab|cd)`);
# - [bez proby] `_tresci_testow`: `sorted(podkatalogi)` i `sorted(pliki)` - przy dwoch nieczytelnych
#   plikach `.py` pod `tests/` kolejnosc przegladania decyduje, ktora sciezka trafi do komunikatu;
# - [bez proby] `_zapisz_w_kopii`: `except (OSError, UnicodeEncodeError)` (zaden test nie zmusza
#   zapisu do bledu); `_analiza`: `except (RecursionError, MemoryError)` wokol opisu mutanta - element
#   `MemoryError` oraz caly `except` w petli mutantow (`nie da sie odtworzyc mutanta`); `_kopia_repo`:
#   sprzatanie przy bledzie (`finally` z wyjatkiem; test sprawdza tylko przebieg bez wyjatku);
#   `(kod pytesta N)` w komunikacie kontroli bez mutacji; `encoding="utf-8"` w `_zapisz_w_kopii`;
#   zachowanie `PYTHONPATH` w `_uruchom_pytest`; `-o addopts=`; `except _NiepoprawnyWzorzec` dla
#   `\` na koncu wzorca; `znak == "N"` bez `{`.
# Rownowazne (zadne wejscie nie odroznia wersji; uzasadnienie rozumowaniem, mutacji nie uruchamiano
# poza oznaczonymi): `nastepna is not None` w `_zamiary_instrukcji` (`_samodzielne_wywolanie(None)` jest
# False); `w_funkcji or` w `_analiza` (`_stala_do_zbadania(FunctionDef)` jest zawsze True); `ast.copy_location`
# przy `pass`; `--src-prefix=a/` i `"--", "src/"` w `_zmiany` (parser czyta tylko `+++ b/...`, a filtr
# `startswith("src/")` zostaje); `if mutant.plik not in sprawdzone` / `sprawdzone.add` (kontrola
# powtarzana dla kazdego mutanta daje ten sam wynik, kosztuje tylko czas); `not isinstance(lista[0],
# ast.stmt)` (kazde pole `body`/`orelse`/`finalbody` bedace lista zawiera instrukcje);
# `poczatek is not None` w `if poczatek is not None and kreski:` (przy `None` lista `kreski` jest zawsze
# pusta, bo `|` jest dopisywane tylko dla grupy obslugiwanej); `except (SyntaxError, ValueError)`
# na Pythonie >= 3.12 dla bajtu zerowego.

