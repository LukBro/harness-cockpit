zamien = "true"
test = "tests/test_workflow_mutacje.py::test_blad_narzedzia_mutantow_uzupelniajacych_oblewa_krok_a_stderr_trafia_do_podsumowania_i_bledu_ci[2]"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "echo \"błąd narzędzia (kod $kod):\"\n                echo\n                echo '```'\n                cat mutants/mutanty-uzupelniajace.err"
zamien = "echo \"błąd narzędzia:\"\n                echo\n                echo '```'\n                cat mutants/mutanty-uzupelniajace.err"
test = "tests/test_workflow_mutacje.py::test_blad_narzedzia_mutantow_uzupelniajacych_oblewa_krok_a_stderr_trafia_do_podsumowania_i_bledu_ci[3]"

# Czerwony krok: kazdy kod poza 0 oblewa krok, a stderr i stdout trafiaja do linii bledu CI.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''if [ "$kod" != "0" ]; then
            echo "::error::mutanty_uzupelniajace.py'''
zamien = '''if [ "$kod" = "1" ]; then
            echo "::error::mutanty_uzupelniajace.py'''
test = "tests/test_workflow_mutacje.py::test_blad_narzedzia_mutantow_uzupelniajacych_oblewa_krok_a_stderr_trafia_do_podsumowania_i_bledu_ci[2]"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "$(tr '\\n' ' ' < mutants/mutanty-uzupelniajace.err) "
zamien = ""
test = "tests/test_workflow_mutacje.py::test_blad_narzedzia_mutantow_uzupelniajacych_oblewa_krok_a_stderr_trafia_do_podsumowania_i_bledu_ci[2]"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = " $(tr '\\n' ' ' < mutants/mutanty-uzupelniajace.txt)"
zamien = ""
test = "tests/test_workflow_mutacje.py::test_przezywajace_mutanty_uzupelniajace_oblewaja_krok_i_sa_wypisane_w_podsumowaniu_i_bledzie_ci"

# Galaz docelowa PR trafia do kroku ze zmiennej srodowiska, a artefakt niesie oba pliki wyniku.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''- name: mutanty uzupełniające
        env:
          BASE_REF: ${{ github.base_ref }}'''
zamien = '''- name: mutanty uzupełniające
        env:
          BASE_REF: ${{ github.head_ref }}'''
test = "tests/test_workflow_mutacje.py::test_krok_mutanty_uzupelniajace_stoi_zaraz_po_kroku_pokrycia_linii_i_dostaje_galaz_docelowa"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''            mutants/pokrycie-kod3.err
            mutants/mutanty-uzupelniajace.txt
            mutants/mutanty-uzupelniajace.err'''
zamien = '''            mutants/pokrycie-kod3.err
            mutants/mutanty-uzupelniajace.err'''
test = "tests/test_workflow_mutacje.py::test_zadanie_pull_requestu_publikuje_wynik_mutantow_uzupelniajacych_nawet_po_czerwonym_kroku"

