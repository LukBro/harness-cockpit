# Tabela recznych mutantow HAR-179: elementy, ktorych mutmut nie mutuje (stale modulu, klasy,
# wpisy rejestru operacji, pola modeli odpowiedzi, trasy z dekoratorem w api/app.py).
# Kazde `szukaj` wystepuje w pliku dokladnie raz; `zamien` rozni sie od `szukaj`;
# test oblewa po mutacji (`python tools/mutanty_reczne.py tests/mutanty_reczne/HAR-179.toml`).
#
# Linie bez wiersza (uzasadnienie rownowaznosci lub niemierzalnosci):
# - src/cockpit/api/schematy.py linie `class Zintegrowano(BaseModel):` i
#   `class Zacommitowano(BaseModel):` - zmiana nazwy klasy albo bazy psuje import app.py w
#   czasie zbierania testow (kod pytesta 2, nie wynik testu); nazwy modeli chroni wiersz
#   `response_model` z testem test_modele_odpowiedzi_tras_maja_uzgodnione_nazwy, a pola
#   maja wlasne wiersze.
# - src/cockpit/api/app.py linie `) -> Zintegrowano:` i `) -> Zacommitowano:` - adnotacja
#   zwracanego typu jest ignorowana przez FastAPI, bo `response_model` jest podany jawnie
#   w dekoratorze (wiersze `response_model`), wiec zadne wejscie nie odroznia wersji.

