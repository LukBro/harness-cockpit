plik = "src/cockpit/api/app.py"
szukaj = "await bus.publish_event(run_id, {\"seq\": ev.seq, \"kind\": ev.kind, \"text\": ev.text,\n                                     \"step_id\": ev.step_id,\n                                     \"text_truncated\": ev.text_truncated,\n                                     \"text_full_len\": ev.text_full_len})\n    return Zacommitowano(run_id=run_id, at=ev.at, sha=wynik.sha)"
zamien = "await bus.publish_event(run_id, {\"seq\": ev.seq, \"kind\": ev.kind, \"text\": ev.text,\n                                     \"step_id\": ev.step_id,\n                                     \"text_truncated\": ev.text_truncated,\n                                     \"text_full_len\": 0})\n    return Zacommitowano(run_id=run_id, at=ev.at, sha=wynik.sha)"
test = "tests/test_commit_po_odbiorze.py::test_commit_publikuje_zdarzenie_committed_na_szynie_po_sukcesie"

# commit: odpowiedz, run_id=run_id zmienione.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = "return Zacommitowano(run_id=run_id, at=ev.at, sha=wynik.sha)"
zamien = "return Zacommitowano(run_id=\"\", at=ev.at, sha=wynik.sha)"
test = "tests/test_commit_po_odbiorze.py::test_commit_po_integrate_daje_200_i_jeden_nowy_commit_o_sha_zapisanym_w_historii_runu"

