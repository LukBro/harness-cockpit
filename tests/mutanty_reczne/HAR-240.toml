# Tabela recznych mutantow HAR-240: tools/testy.py, tools/po_merge_main.sh, tools/liczby_raportu.py,
# tools/oddaj_pr.sh. Skrypty z tools/ leza poza zasiegiem mutmuta (kod 3 z tools/mutanty_zmian.py nie
# obejmuje tools/), a skrypty powloki nie sa mutowane wcale, wiec kazda galaz ma tu wiersz:
# element | mutacja | test, ktory po mutacji oblewa.
#
# Bez wierszy (mutacja rownowazna, zadne wejscie nie odroznia wersji):
# - `KROK_SPRAWDZANIA`, `CZEKANIE_PO_TERM`, `LIMIT_DOMYSLNY` jako takie: zmiana wartosci zmienia tylko czas,
#   nie wynik (LIMIT_DOMYSLNY ma wiersze ponizej, bo pomoc i przebieg go pokazuja);
# - `break` po dopasowaniu wzorca w `oddaj_pr.sh`: zaden wzorzec z listy nie jest prefiksem innego, wiec jedna
#   sciezka nie trafia w dwa wzorce;
# - `if koniec < 0:` -> `if False:` w `_wczytaj_zdarzenia`: przy braku znaku nowej linii `rfind` daje -1, wycinek
#   `dane[:0]` jest pusty, a zwrocone przesuniecie `przesuniecie + (-1) + 1` rowna sie wejsciowemu;
# - `dane[: koniec + 1]` -> `dane[:koniec]` w `_wczytaj_zdarzenia`: `splitlines()` zwraca te same linie z koncowym
#   znakiem nowej linii i bez niego.

