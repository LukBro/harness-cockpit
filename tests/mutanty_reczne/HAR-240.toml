# Element ValueError w krotce wyjatkow `ast.parse`: sprawdzone na Pythonie 3.14.6 z venv projektu - bajt zerowy
# i znaki spoza zakresu daja tam SyntaxError, a zaden ze znanych wejsc nie daje ValueError. Na Pythonie 3.11
# (najnizsza wspierana wersja) bajt zerowy w zrodle rzuca ValueError, wiec element zostaje; tej wersji tu nie ma.
[[rownowazny]]
plik = "tools/liczby_raportu.py"
linia_tekst = "except (SyntaxError, ValueError, RecursionError, MemoryError) as blad:"
uzasadnienie = "ValueError z ast.parse wystepuje tylko na Pythonie 3.11 (bajt zerowy); na 3.14.6 testow zaden plik go nie wyzwala"
