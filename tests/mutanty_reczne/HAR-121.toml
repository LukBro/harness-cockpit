[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = "await bus.publish_event(run_id, uslugi.zdarzenie_na_szyne(ev))\n    return Zacommitowano("
zamien = "await bus.publish_event(run_id, {})\n    return Zacommitowano("
test = "tests/test_commit_po_odbiorze.py::test_commit_publikuje_zdarzenie_committed_na_szynie_po_sukcesie"

