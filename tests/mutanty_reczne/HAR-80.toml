szukaj = '[A-Za-z0-9_.-]{1,64}'
zamien = '[A-Za-z0-9_.-]{1,65}'
test = "tests/test_silnik_runu.py::test_niedozwolona_nazwa_workflow_konczy_run_bledem_bez_tworzenia_worktree"

