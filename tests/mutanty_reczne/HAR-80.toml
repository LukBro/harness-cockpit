# Tabela recznych mutantow HAR-80: silnik runu u runnera (`runner.silnik`) i polecenie
# `run_workflow` w kokpicie. Elementy, ktorych mutmut nie mutuje: stale modulu silnika (wzorzec
# nazwy workflow, katalog workflow, krok walidacji), aliasy typow, klasy wyjatkow
# i dataclass, typy w `except`, linia `W_TOKU` z `# pragma: no mutate`, pole `project_id` modelu
# wejscia, lista odpowiedzi trasy, polecenie runu w `create_run`, zbior `_POLECENIA_RUNU`,
# schemat `web/openapi.json`.
#
# Pola `szukaj` uzgodnione z faktycznym kodem: kazdy wystepuje w pliku dokladnie raz.
# Testy wskazane bez nawiasow kwadratowych uruchamiaja wszystkie warianty parametryzacji.

# =========================== src/runner/silnik.py ===========================

# --- NAZWA_WORKFLOW: dlugosc i klasa znakow ---

