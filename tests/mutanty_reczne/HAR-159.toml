# Runnerowi trafia operacja wskazana w zadaniu, nie stala.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = '"operacja": body.operacja'
zamien = '"operacja": "szkielet"'
test = "tests/test_protokol_bez_argv.py::test_uruchomienie_runu_wysyla_runnerowi_operacje_wskazana_przez_uzytkownika"

# --- src/runner/client.py: lokalna lista operacji -----------------------------------

# Argv operacji "szkielet" to echo z napisem "szkielet dziala".
[[mutant]]
plik = "src/runner/client.py"
szukaj = '"szkielet": ("echo", "szkielet dziala"),'
zamien = '"szkielet": ("echo", "szkielet nie dziala"),'
test = "tests/test_protokol_bez_argv.py::test_lista_operacji_runnera_jest_tylko_do_odczytu_i_zna_tylko_szkielet"

# Nazwa operacji na liscie to "szkielet".
[[mutant]]
plik = "src/runner/client.py"
szukaj = '"szkielet": ("echo", "szkielet dziala"),'
zamien = '"szkielet2": ("echo", "szkielet dziala"),'
test = "tests/test_protokol_bez_argv.py::test_runner_wykonuje_znana_operacje_z_lokalnej_listy_i_zglasza_jej_wynik"

# Lista operacji jest tylko do odczytu.
[[mutant]]
plik = "src/runner/client.py"
szukaj = "MappingProxyType({"
zamien = "dict({"
test = "tests/test_protokol_bez_argv.py::test_lista_operacji_runnera_jest_tylko_do_odczytu_i_zna_tylko_szkielet"

# Powod odmowy dla operacji spoza listy.
[[mutant]]
plik = "src/runner/client.py"
szukaj = 'POWOD_SPOZA_LISTY = "operacja spoza listy dozwolonych"'
zamien = 'POWOD_SPOZA_LISTY = "operacja nieznana"'
test = "tests/test_protokol_bez_argv.py::test_powod_odmowy_to_operacja_spoza_listy_dozwolonych"

