zamien = "\"maxLength\": 65,\n            \"pattern\": \"^[A-Za-z0-9_.-]+$\","
test = "tests/test_protokol_bez_argv.py::test_zatwierdzony_schemat_kontraktu_ma_run_create_zgodny_z_kodem_kokpitu"

[[mutant]]
