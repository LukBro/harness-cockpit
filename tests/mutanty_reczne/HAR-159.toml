# Tabela recznych mutantow HAR-159: model RunCreate (Field, ConfigDict, wzorzec), tablica
# operacji runnera i zatwierdzony schemat kontraktu - poza zasiegiem mutmuta (kod 3).
# tools/demo_szkielet.py: bez wiersza, bo jedyny test warunku "szkielet dziala" wymaga
# PostgreSQL (COCKPIT_TEST_DATABASE_URL) i bez bazy jest pomijany, wiec mutant by przezyl.

# --- src/cockpit/api/app.py: RunCreate ---------------------------------------------

# Pole spoza modelu (stare `command`) to 422, nie ciche zignorowanie.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = 'ConfigDict(extra="forbid")'
zamien = 'ConfigDict(extra="ignore")'
test = "tests/test_protokol_bez_argv.py::test_kokpit_nie_moze_kazac_runnerowi_wykonac_dowolnej_komendy"

# Bez podanej operacji kokpit wysyla runnerowi operacje "szkielet".
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = 'Field(default="szkielet", max_length=64'
zamien = 'Field(default="inna", max_length=64'
test = "tests/test_protokol_bez_argv.py::test_uruchomienie_runu_bez_podanej_operacji_wysyla_runnerowi_operacje_szkielet"

# Nazwa operacji ma najwyzej 64 znaki: 65 jest odrzucone (wzorzec ja przepuszcza).
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = 'max_length=64, pattern=r"^[A-Za-z0-9_.-]+$"'
zamien = 'max_length=65, pattern=r"^[A-Za-z0-9_.-]+$"'
test = "tests/test_protokol_bez_argv.py::test_kokpit_odrzuca_nazwe_operacji_ze_znakami_spoza_dozwolonych_albo_za_dluga"

# Wzorzec nazwy operacji: kotwica poczatku.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = 'pattern=r"^[A-Za-z0-9_.-]+$"'
zamien = 'pattern=r"[A-Za-z0-9_.-]+$"'
test = "tests/test_protokol_bez_argv.py::test_kokpit_odrzuca_nazwe_operacji_ze_znakami_spoza_dozwolonych_albo_za_dluga"

