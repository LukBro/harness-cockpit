# (`kontrakt.consumes/.produces/.needs`), nikt nie przypisuje ich pol ani ich nie haszuje
# (`rg _Kontrakt src tests tools` - tylko graf.py:62, 70, 73, 75). Dotyczy `_Kontrakt`.
[[rownowazny]]
