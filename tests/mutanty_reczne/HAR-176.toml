# Tabela recznych mutantow HAR-176 (krok systemowy `diff`, kotwice `plik:linia` w notatce zmiany).
# Mutmut nie mutuje stalych modulu (regexy, tolerancja, nazwy artefaktow, rejestr krokow
# systemowych, wartosci domyslne pol), budowa.yaml ani SKILL.md. Kazde `szukaj` wystepuje w
# pliku dokladnie raz.
#
# Wpisy z listy `bez mutantow` (tools/mutanty_zmian.py): kroki_systemowe.py:20-31 i graf.py:62-67
# maja wiersze `[[mutant]]` na koncu pliku; bez wiersza, jako `[[rownowazny]]` (uzasadnienia na koncu
# pliku), zostaja graf.py:61, krok_diff.py:23 i silnik.py:72. Pozostale rownowazne:
#   - kotwice.py:21 i :26 (komentarze).
#   - `UnicodeDecodeError` w krotce `except` w `wczytaj_zmienione_linie`: usuniety, bo jest
#     podklasa `ValueError` i nie da sie go wyzwolic w pojedynke (lapie go `ValueError`).
# (zob. wiersze KODOWANIE i OPCJE_JSON nizej: literaly kodowania i opcji JSON sa stalymi modulu)
# Warunek `biezacy is not None` w `zmienione_linie` i galaz `PorazkaKroku("nieznany krok
# systemowy…")` w `_krok_systemowy` lezą w funkcjach, wiec mutmut je mutuje; maja testy
# (`test_hunk_przed_naglowkiem_jakiegokolwiek_pliku_jest_pomijany_bez_bledu`,
# `test_krok_systemowy_bez_wykonawcy_konczy_sie_porazka_z_nazwa_a_recenzent_jest_pominiety`).
# Pierwszy z nich ma tez wiersz nizej (warunek jest jedynym strazem przed TypeError).

