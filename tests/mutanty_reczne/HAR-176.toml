linia_tekst = "@dataclass(frozen=True)"
uzasadnienie = "frozen=False jest nieodroznialne dla _Kontrakt: instancje tylko tworzone w _kontrakt i czytane w nastepne, nikt nie przypisuje pol ani nie haszuje (grep _Kontrakt: graf.py, 4 trafienia); dotyczy _Kontrakt, nie Plan ani Podsumowanie"

