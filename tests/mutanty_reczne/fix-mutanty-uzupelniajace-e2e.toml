# fix-mutanty-uzupelniajace-e2e: tests/e2e/ nie trafia do wyboru testow (pytest leci z `-o addopts=`,
# wiec `-m "not e2e"` znika, a e2e bez przegladarki pada bez mutacji: PR #210, run 45345037040, kod 2).
# tools/ jest poza zasiegiem mutmuta.

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = 'pominiete = {Path(*KATALOG_TABEL), Path(*KATALOG_E2E)}'
zamien = 'pominiete = {Path(*KATALOG_TABEL)}'
test = "tests/test_mutanty_uzupelniajace.py::test_plik_w_katalogu_e2e_nie_jest_wybierany_do_testow"

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = 'KATALOG_E2E = ("tests", "e2e")'
zamien = 'KATALOG_E2E = ("e2e",)'
test = "tests/test_mutanty_uzupelniajace.py::test_plik_w_katalogu_e2e_nie_jest_wybierany_do_testow"

[[mutant]]
plik = "tools/mutanty_uzupelniajace.py"
szukaj = 'if wzgledny / p not in pominiete)'
zamien = 'if p not in {q.name for q in pominiete})'
test = "tests/test_mutanty_uzupelniajace.py::test_katalog_o_nazwie_e2e_glebiej_w_tests_jest_przegladany"
