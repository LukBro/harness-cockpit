# Tabela recznych mutantow HAR-236: bramki lokalne szybciej (pomiar faz, --max-children, tryb
# przyrostowy --od-przebiegu, bramki_lokalne.sh, -j w mutanty_reczne.py, e2e na workerach xdist).
#
# Pliki tools/ sa poza zasiegiem mutmuta, wiec KAZDY zmieniony element tools/mutanty_zmian.py,
# tools/mutanty_reczne.py, tools/bramki_lokalne.sh i tools/testy_pelne.sh ma tu wiersz z testem,
# ktory oblewa po mutacji. Fixture `baza_workera` w tests/e2e/conftest.py (CREATE/DROP DATABASE
# na PostgreSQL) nie ma wiersza: jego test wymaga bazy, a kopie repozytorium tabeli jej nie maja;
# sprawdza go przebieg `-m e2e -n 4` na PostgreSQL (nazwa i adres bazy workera: osobna funkcja
# `url_bazy_workera` ma wiersze ponizej).
#
# Mutanty rownowazne sa na koncu tabeli jako [[rownowazny]] z uzasadnieniem.

