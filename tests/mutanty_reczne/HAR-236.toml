[[rownowazny]]
plik = "tools/mutanty_zmian.py"
linia_tekst = "ROZDZIELACZ_LINII = re.compile(r\"[\\r\\n]\")"
uzasadnienie = "Okno niedokonczonej linii (`okno`) sluzy wylacznie do ograniczenia jego dlugosci; fragmenty znacznikow (`Running stats` itd.) nie zawieraja ani `\\r`, ani `\\n`, wiec zaden fragment nie moze sie dopasowac ponad separatorem. Wersje z `[\\n]`, `[\\r]` i bez podzialu daja dla kazdego strumienia ten sam wynik dopasowania (rozni je tylko dlugosc okna), wiec zadne wejscie nie odroznia wersji."

[[rownowazny]]
plik = "tools/bramki_lokalne.sh"
linia_tekst = "    [ -z \"$pid\" ] || kill -TERM -- \"-$pid\" 2>/dev/null || true"
uzasadnienie = "Przy pustym `$pid` wersja bez strazika wola `kill -TERM -- \"-\"`, co konczy sie bledem tlumionym przez `2>/dev/null || true`: ten sam kod wyjscia, ten sam stdout i stderr, zadne wejscie nie odroznia wersji."

[[rownowazny]]
plik = "tests/e2e/conftest.py"
linia_tekst = "    assert url_workera != url"
uzasadnienie = "Fixture `baza_workera` woluje `url_bazy_workera` tylko dla adresu `postgresql...` i niepustego identyfikatora workera, a wtedy funkcja zawsze dopisuje do nazwy bazy `_<workerid>` (wiersze tabeli), wiec asercja jest zawsze prawdziwa; zadne wejscie nie odroznia wersji bez niej."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "      ''|*[!a-z0-9_]*) continue ;;"
uzasadnienie = "Alternatywa `''|` jest nieosiagalna w petli sprzatania martwych baz: pusta linia listy (pusta lista) trafia do `case \"$pid_bazy\"`, ktory ma wlasna alternatywe `''|` (wiersz tabeli) i robi `continue`; wersja bez `''|` w pierwszym `case` daje dla pustej `$stara` ten sam skutek (pusty `$reszta`, pusty `$pid_bazy`, `continue`). Czlon `*[!a-z0-9_]*` ma wiersz w tabeli."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "  fi\n  return 0\n}\n\npsql_db()"
uzasadnienie = "Koncowe `return 0` w `zwolnij_wlasny` jest zbedne: funkcja konczy sie `if` bez `else`, ktory zwraca 0, gdy warunek jest falszywy, a gdy prawdziwy zwraca status listy `rm ... || echo ...`, czyli status `echo` (0). Zadne wejscie nie odroznia wersji bez `return 0`."

[[rownowazny]]
plik = "tools/bramki_lokalne.sh"
linia_tekst = "  wait \"$straznik\" 2>/dev/null"
uzasadnienie = "Po `kill -KILL -- \"-$straznik\"` cala grupa strazika (subshell i jego `sleep 10`) dostala SIGKILL, a `wait` tylko zbiera status zabitego dziecka tuz przed `exit`: kod wyjscia, stdout i stderr sa te same, a zadne wejscie nie odroznia wersji poza mikrosekundami umierania procesu (nie obserwowalnymi: test sprawdza stan po wyjsciu z zapasem 3 s). Zabicie strazika ma wiersz tabeli."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "    zwolnij_wlasny \"$kat\"\n  done\n  return 0"
uzasadnienie = "Koncowe `return 0` w `sprzatnij` jest zbedne: ostatnia komenda to petla `for` wolajaca `zwolnij_wlasny` (zawsze 0, lista slotow ma co najmniej jeden element), a status funkcji trapu EXIT nie zmienia kodu wyjscia skryptu; zadne wejscie nie odroznia wersji."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "    WLASCICIEL=\"$(tr -d '[:space:]' < \"$1/pid\" 2>/dev/null || true)\""
uzasadnienie = "`katalog_martwy` jest wolana wylacznie w warunku `if` (`sprobuj_katalog`), gdzie `set -e` jest wylaczone, wiec `|| true` nie zmienia przebiegu (nieudane `tr` i tak daje pusty `WLASCICIEL` i `return 1`). `2>/dev/null` tez nie ma skutku: komunikat o nieudanym przekierowaniu `< plik` (nieczytelny pid) wypisuje powloka przed zastosowaniem `2>/dev/null`, a `tr` z poprawnymi argumentami nic nie pisze na stderr; zadne wejscie nie odroznia wersji."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "      rmdir \"$kat\" 2>/dev/null || true"
uzasadnienie = "Brak `|| true` przy `rmdir` po nieudanym zapisie PID nie zmienia przebiegu: `sprobuj_katalog` jest wolana jako `sprobuj_katalog \"$kat\" || rc=$?`, wiec `set -e` jest w niej wylaczone, a nastepna instrukcja (`blad`) wykonuje sie w obu wersjach. Wersja bez `2>/dev/null` ma wiersz tabeli (blad rmdir)."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "      rmdir \"$kat.przejecie\" 2>/dev/null || true"
uzasadnienie = "Brak `|| true` w `sprobuj_katalog` nie zmienia przebiegu: funkcja jest wolana jako `sprobuj_katalog \"$kat\" || rc=$?`, wiec `set -e` jest w niej wylaczone, a nastepne instrukcje (`PRZEJECIE_KAT=\"\"`, `return 3`) wykonuja sie w obu wersjach. Wersja bez `2>/dev/null` ma wiersz tabeli (komunikat rmdir)."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "s.close()\n' | tr"
uzasadnienie = "Zamkniecie gniazda w jednolinijkowcu wyboru portu jest zbedne: proces `$PY` konczy sie tuz po `print`, a system zwalnia gniazdo przy zakonczeniu procesu, wiec port jest wolny dla pytesta w obu wersjach; zadne wejscie nie odroznia wersji."

[[rownowazny]]
plik = "tools/testy_pelne.sh"
linia_tekst = "usun_baze_z_workerami \"$BAZA_PRZEBIEGU\" >/dev/null"
uzasadnienie = "Przekierowanie `>/dev/null` na wywolaniu funkcji jest zbedne: funkcja nic nie pisze na stdout (listy baz zbiera przez `$(...)`, a kazde `DROP` ma wlasne `>/dev/null`; komunikaty bledow ida na stderr), wiec zadne wejscie nie odroznia wersji bez przekierowania."

