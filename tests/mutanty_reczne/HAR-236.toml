# === HAR-236 poprawka po review: blokada (bledy), strazik przerwania, fixture bazy workera ===

# Usuniecie martwej blokady konczy sie dopiero po fakcie: `usunieta` ustawione na 0 zamiast 1,
# wiec po faktycznym usunieciu skrypt czeka sekunde zamiast ponowic od razu.
[[mutant]]
plik = "tools/testy_pelne.sh"
szukaj = "        usunieta=1\n      fi"
zamien = "        usunieta=0\n      fi"
test = "tests/test_testy_pelne.py::test_slot_martwego_procesu_jest_przejety_gdy_slot_1_trzyma_zywy_przebieg"

# `usunieta` startuje od 1: kod 3 (ponow od razu) takze bez usuniecia.
[[mutant]]
plik = "tools/testy_pelne.sh"
szukaj = "local kat=\"$1\" usunieta=0"
zamien = "local kat=\"$1\" usunieta=1"
test = "tests/test_testy_pelne.py::test_blokada_przejeta_przez_inny_przebieg_miedzy_sprawdzeniami_nie_jest_usuwana"

# Kod 3 bez warunku `usunieta`: ponowienie takze, gdy wlasciciel zmienil sie pod przejeciem.
[[mutant]]
plik = "tools/testy_pelne.sh"
szukaj = "      [ \"$usunieta\" -eq 1 ] && return 3\n"
zamien = "      return 3\n"
test = "tests/test_testy_pelne.py::test_blokada_przejeta_przez_inny_przebieg_miedzy_sprawdzeniami_nie_jest_usuwana"

# Warunek kodu 3 odwrocony.
[[mutant]]
plik = "tools/testy_pelne.sh"
szukaj = "[ \"$usunieta\" -eq 1 ] && return 3"
zamien = "[ \"$usunieta\" -eq 0 ] && return 3"
test = "tests/test_testy_pelne.py::test_blokada_przejeta_przez_inny_przebieg_miedzy_sprawdzeniami_nie_jest_usuwana"

