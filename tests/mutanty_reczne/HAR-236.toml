# Tabela recznych mutantow HAR-236: tools/mutanty_zmian.py (tryb przyrostowy, --max-children, czasy faz)
# i tools/bramki_lokalne.sh. Skrypty z tools/ leza poza zasiegiem mutmuta, a skrypty powloki nie sa
# mutowane wcale, wiec kazda galaz ma tu wiersz: element | mutacja | test, ktory po mutacji oblewa.
#
# Wiersze dla fazy `statystyki` (znaczniki `mutmut run` przez `na_linie`) i dla `uruchom` z `na_linie`
# sa w sekcjach nizej.

# ---------------------------------------------------------------- komunikaty, kolejnosc survivorow, TMPDIR

[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = 'survivory = sorted({*nowe_przezywajace, *(m for ms in z_zapisu.values() for m in ms)})'
zamien = 'survivory = list({*nowe_przezywajace, *(m for ms in z_zapisu.values() for m in ms)})'
test = "tests/test_mutanty_zmian.py::test_survivory_z_zapisu_i_z_nowego_przebiegu_sa_wypisane_w_kolejnosci_alfabetycznej"

[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = 'print("mutmut nie wygenerowal mutantow dla zmienionych funkcji", file=sys.stderr)'
zamien = 'print("XXmutmut nie wygenerowal mutantow dla zmienionych funkcjiXX", file=sys.stderr)'
test = "tests/test_mutanty_zmian.py::test_komunikat_o_braku_mutantow_dla_zmienionych_funkcji_jest_na_stderr_tylko_gdy_ich_brak"

[[mutant]]
plik = "tools/bramki_lokalne.sh"
szukaj = '${TMPDIR:-/tmp}/bramki_lokalne.XXXXXX'
zamien = '${TMPDIR:-/tmq}/bramki_lokalne.XXXXXX'
test = "tests/test_bramki_lokalne.py::test_bez_tmpdir_katalog_logow_jest_tworzony_przez_mktemp_pod_tmp"

[[mutant]]
plik = "tools/bramki_lokalne.sh"
szukaj = "w '${TMPDIR:-/tmp}'"
zamien = "w '${TMPDIR:-/tmq}'"
test = "tests/test_bramki_lokalne.py::test_nieudany_mktemp_bez_tmpdir_ma_w_komunikacie_katalog_tmp_i_nic_nie_startuje"

