# Tabela recznych mutantow HAR-152: tools/mutanty_zmian.py jest poza source_paths mutmuta,
# wiec kazdy zmieniony element (filtr nazw i dekoratorow w _mutowana, filtry w
# wzorce_dla_pliku, _reguly_mutmuta, _linie_pragmy i warunek zgloszenia w linie_bez_mutantow)
# ma wiersz z testem, ktory oblewa po mutacji.
# Zasieg pragmy i zbior nazw niemutowanych funkcji czyta skrypt wprost z zainstalowanego
# mutmuta (PragmaVisitor, NEVER_MUTATE_FUNCTION_NAMES), wiec nie ma wlasnej kopii regul.
#
# Bez wiersza (mutanty rownowazne - zadne wejscie nie odroznia wersji):
# - zamiana kolejnosci w `_mutowana`: sprawdzenie nazwy przed dekoratorem albo po nim. Wynik
#   to koniunkcja obu warunkow (kazdy z nich osobno zwraca False), a funkcja nie ma efektow
#   ubocznych, wiec kolejnosc nie zmienia wartosci dla zadnego wejscia.
# - zamiana kolejnosci operandow `and` w warunku zgloszenia w `linie_bez_mutantow`
#   (`w_mutowanej`, `numer not in bez_pragmy`, `not w_nie_mutowanej`): koniunkcja trzech
#   wyrazen bez efektow ubocznych, wiec kolejnosc nie zmienia wyniku dla zadnego wejscia.
# - `nie_mutowane` dla funkcji najwyzszego poziomu i metod klas: ich zakres i tak nie nalezy do
#   `mutowane` (`_mutowana` jest False), wiec `w_mutowanej` jest False i linia jest zgloszona
#   niezaleznie od `nie_mutowane`; zbior ma znaczenie tylko dla def zagniezdzonych w mutowanej
#   funkcji i te pokrywaja wiersze o glebokosci powyzej najwyzszego poziomu.

# --- _mutowana: nazwy z NEVER_MUTATE_FUNCTION_NAMES mutmuta ----------------------------

# Odwrocony warunek nazwy: funkcja `__new__` bylaby mutowana, wiec jej linie zniknelyby z listy.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "if wezel.name in _reguly_mutmuta()[0]:"
zamien = "if wezel.name not in _reguly_mutmuta()[0]:"
test = "tests/test_mutanty_zmian.py::test_zmieniona_funkcja_modulu_o_nazwie_pomijanej_przez_mutmuta_jest_zgloszona[__new__]"

# Funkcja o nazwie z listy mutmuta uznana za mutowana: jej zmieniona linia nie bylaby zgloszona.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = '''if wezel.name in _reguly_mutmuta()[0]:
        return False'''
zamien = '''if wezel.name in _reguly_mutmuta()[0]:
        return True'''
test = "tests/test_mutanty_zmian.py::test_zmieniona_funkcja_modulu_o_nazwie_pomijanej_przez_mutmuta_jest_zgloszona[__new__]"

# Zbior nazw ma pochodzic z mutmuta (element 0 krotki), nie z innego elementu krotki.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "if wezel.name in _reguly_mutmuta()[0]:"
zamien = "if wezel.name in _reguly_mutmuta()[1]:"
test = "tests/test_mutanty_zmian.py::test_nazwy_niemutowanych_funkcji_pochodza_z_zainstalowanego_mutmuta"

