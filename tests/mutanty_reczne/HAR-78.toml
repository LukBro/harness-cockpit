# Tabela recznych mutantow HAR-78: stan krokow ze zdarzen i status runu z krokow.
# UWAGA: tabela powstala PRZED implementacja (TDD). Pola `szukaj` oparte sa na specyfikacji
# (dokladne fragmenty zakladane), wiec Team Manager uzgadnia je z faktycznym kodem po
# implementacji: kazdy `szukaj` ma wystapic w pliku dokladnie raz. Testy wskazane jako
# `test` bez nawiasow kwadratowych uruchamiaja wszystkie warianty parametryzacji.
# Kazdy wiersz dotyczy miejsca, ktorego mutmut nie mutuje (stale tabeli, argumenty Field,
