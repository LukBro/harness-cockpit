# Tabela recznych mutantow HAR-178: pokrycie bramkami w rekordzie runu.
# Elementy, ktorych mutmut nie mutuje: ograniczenia pol Pydantica, wywolanie serwisu w trasie,
# pola modeli, stale zbiory i front (web/).
#
# Wiersze z tests/test_migracje.py wymagaja PostgreSQL (COCKPIT_TEST_DATABASE_URL), testy
# z tests/e2e/ wymagaja przegladarki i bazy (tools/testy_pelne.sh).
#
# Uzasadnienia rownowaznosci (bez wiersza):
# - web/src/WidokRunu.tsx `runId &&` w warunku sekcji pokrycia: stan `pokrycie` jest null,
#   gdy nie ma runId (efekt zeruje go przed `if (!runId) return`), wiec usuniecie `runId &&`
#   nie zmienia niczego, co da sie zobaczyc.
# - web/src/WidokRunu.tsx `key={krok}` na <li>: klucze nie zmieniaja wyniku renderowania
#   listy, ktorej elementy nie zmieniaja sie miedzy renderami.
# - web/src/WidokRunu.tsx `import type { PokrycieRunu }` oraz web/src/api.ts
#   `export type PokrycieRunu`: same typy, znikaja po kompilacji; usuniecie psuje `tsc`
#   (npm run build), a nie zachowanie.
# - web/src/WidokRunu.tsx `pokrycie !== null` w warunku sekcji: usuniecie albo odwrocenie
#   warunku nie kompiluje sie (TS18047 'pokrycie' is possibly 'null' w kazdym odwolaniu w
#   sekcji), wiec mutanta zabija `tsc` w `npm run build`; wiersz z `=== null` daje kod 2
#   narzedzia (blad budowy), nie przezywajacego mutanta (HAR-178, Team Manager).
# - src/cockpit/api/app.py `default=None` w EventIn.kroki_weryfikujace: wariant `default=[]`
#   jest rownowazny (pusta lista jest traktowana jak brak: `if not kroki_weryfikujace`),
#   wiec zamiast niego mutujemy default na niepusta liste.

