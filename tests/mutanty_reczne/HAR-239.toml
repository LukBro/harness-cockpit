test = "tests/test_sekrety_w_logach.py::test_wartosc_opcji_z_sekretem_zlozona_z_fragmentow_jest_zamaskowana_do_konca_tokenu"

[[rownowazny]]
plik = "src/runner/maskowanie.py"
linia_tekst = "[^\\\"\\\\])*(?:\\\"|\\Z)"
uzasadnienie = "Wariant `[^\\\"]` zamiast `[^\\\"\\\\]` w segmencie cudzyslowu: ukosnik trafia do tej klasy tylko wtedy, gdy nie pasuje alternatywa `\\\\[\\s\\S]?` stojaca przed nia, a ta pasuje do kazdego ukosnika (znak po nim jest opcjonalny). Alternatywa konczaca segment `(?:\\\"|\\Z)` pasuje zawsze na koncu petli, wiec nie ma nawrotu, ktory wymusilby druga droge. Wejscia, ktorego ukosnik dociera do klasy, nie ma."

[[rownowazny]]
plik = "src/runner/maskowanie.py"
linia_tekst = "r\"|[^\\s\\\"'\\\\])+\""
uzasadnienie = "Wariant bez `\\\"` w klasie zwyklych znakow `[^\\s\\\"'\\\\]`: kazdy `\\\"` zaczyna alternatywe cudzyslowu stojaca w wyrazeniu przed klasa, a ta zawsze sie dopasowuje (domkniecie `\\\"` albo `\\Z`), wiec `\\\"` nigdy nie dociera do klasy i nie ma nawrotu, ktory by go tam skierowal. Wejscia, ktore odroznia wersje, nie ma."

[[rownowazny]]
plik = "src/runner/maskowanie.py"
linia_tekst = "r\"|[^\\s\\\"'\\\\])+\""
uzasadnienie = "Wariant bez apostrofu w klasie zwyklych znakow `[^\\s\\\"'\\\\]`: kazdy `'` zaczyna alternatywe apostrofu `'[^']*(?:'|\\Z)` stojaca w wyrazeniu przed klasa, a ta zawsze sie dopasowuje (domkniecie `'` albo `\\Z`), wiec `'` nigdy nie dociera do klasy; po `_WARTOSC` nic w wyrazeniu nie stoi, wiec nie ma nawrotu, ktory skierowalby `'` do klasy. Wejscia, ktore odroznia wersje, nie ma."

[[rownowazny]]
plik = "src/runner/maskowanie.py"
linia_tekst = "r\"|[^\\s\\\"'\\\\])+\""
uzasadnienie = "Wariant bez ukosnika w klasie zwyklych znakow `[^\\s\\\"'\\\\]`: kazdy `\\\\` zaczyna alternatywe ucieczki `\\\\[\\s\\S]?` stojaca w wyrazeniu przed klasa, a ta zawsze sie dopasowuje (znak po ukosniku jest opcjonalny, wiec pasuje takze ukosnik na koncu napisu), wiec ukosnik nigdy nie dociera do klasy; po `_WARTOSC` nic w wyrazeniu nie stoi, wiec nie ma nawrotu, ktory skierowalby go do klasy. Wejscia, ktore odroznia wersje, nie ma."

