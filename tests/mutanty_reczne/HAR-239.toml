# Tabela recznych mutantow HAR-239 (straz roli: pull, commit-tree, update-ref, wymuszone git branch;
# maskowanie: wartosc przypisania i opcji zlozona z fragmentow): elementy zbiorow, warunki i
# segmenty wyrazenia `_WARTOSC` w src/runner/straz_roli.py i src/runner/maskowanie.py.
# Kazdy wiersz zmienia jeden element; wskazany test musi na nim oblac.
# Cale literaly (`_GIT_TWORZY_COMMIT`, `_PRZYPISANIE_SEKRETU`, `_OPCJA_SEKRETU`) i alternatywy
# `_WARTOSC` (dq, apostrof, zwykle znaki) maja wiersze w HAR-219.toml.

# _GIT_TWORZY_COMMIT: pull znika ze zbioru; `git --config-env k=v pull` omija `waliduj_definicje`.
[[mutant]]
plik = "src/runner/straz_roli.py"
szukaj = "    \"pull\",  # HAR-239: fetch + merge"
zamien = "    \"pull_\",  # HAR-239: fetch + merge"
test = "tests/test_straz_roli.py::test_podpolecenie_tworzace_commit_po_opcji_config_env_jest_odmowione_w_kazdej_roli"

# _GIT_TWORZY_COMMIT: pull znika ze zbioru; `git pull` przechodzi.
