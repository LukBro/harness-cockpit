# main: grupa zrodel nieobowiazkowa.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "add_mutually_exclusive_group(required=True)"
zamien = "add_mutually_exclusive_group(required=False)"
test = "tests/test_zapadka_mutacji.py::test_brak_zrodla_porownania_jest_bledem_uzycia"

# main: zrodla nie wykluczaja sie.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "source = parser.add_mutually_exclusive_group(required=True)"
zamien = "source = parser.add_argument_group()"
test = "tests/test_zapadka_mutacji.py::test_baseline_i_poprzedni_wynik_naraz_to_blad_uzycia_i_baseline_zostaje_nietkniety"

# main: zmieniona nazwa opcji.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "\"--previous-summary\", help"
zamien = "\"--poprzedni\", help"
test = "tests/test_zapadka_mutacji.py::test_wynik_nizszy_od_poprzedniego_przebiegu_jest_spadkiem_nawet_gdy_przewyzsza_stary_baseline"

# main: tryb previous zawsze wylaczony.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "previous_mode = args.previous_summary is not None"
zamien = "previous_mode = False"
test = "tests/test_zapadka_mutacji.py::test_wynik_nizszy_od_poprzedniego_przebiegu_jest_spadkiem_nawet_gdy_przewyzsza_stary_baseline"

# main: tryb previous odwrocony.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "previous_mode = args.previous_summary is not None"
zamien = "previous_mode = args.previous_summary is None"
test = "tests/test_zapadka_mutacji.py::test_wynik_nizszy_od_poprzedniego_przebiegu_jest_spadkiem_nawet_gdy_przewyzsza_stary_baseline"

# main: odwrocony wybor zrodla baseline.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "        if previous_mode:\n            baseline = load_previous_summary"
zamien = "        if not previous_mode:\n            baseline = load_previous_summary"
test = "tests/test_zapadka_mutacji.py::test_wynik_nizszy_od_poprzedniego_przebiegu_jest_spadkiem_nawet_gdy_przewyzsza_stary_baseline"

# main: zakres staly przy wczytaniu poprzedniego.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "load_previous_summary(args.previous_summary, args.scope)"
zamien = "load_previous_summary(args.previous_summary, \"full\")"
test = "tests/test_zapadka_mutacji.py::test_zakres_przebiegu_z_argumentu_trafia_do_linii_statusu_przy_porownaniu_z_poprzednim"

# main: previous_mode nie trafia do wyniku.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "result[\"previous_mode\"] = previous_mode"
zamien = "result[\"previous_mode\"] = False"
test = "tests/test_zapadka_mutacji.py::test_porownanie_z_poprzednim_przebiegiem_nigdy_nie_zapisuje_pliku_takze_przy_wzroscie_wyniku"

# main: zapis w trybie previous (bez --commit wymusza odmowe).
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "not args.dry_run and not previous_mode:"
zamien = "not args.dry_run:"
test = "tests/test_zapadka_mutacji.py::test_porownanie_z_poprzednim_przebiegiem_nie_wymaga_commita_nawet_przy_wzroscie"

# main: zapis w trybie previous z --commit.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "not args.dry_run and not previous_mode:"
zamien = "not args.dry_run and previous_mode:"
test = "tests/test_zapadka_mutacji.py::test_porownanie_z_poprzednim_przebiegiem_nie_zapisuje_pliku_takze_gdy_podano_commit"

# format_report: odwrocony warunek trybu previous.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "if result.get(\"previous_mode\"):"
zamien = "if not result.get(\"previous_mode\"):"
test = "tests/test_zapadka_mutacji.py::test_porownanie_z_poprzednim_przebiegiem_nigdy_nie_zapisuje_pliku_takze_przy_wzroscie_wyniku"

# format_report: zly klucz trybu previous.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "result.get(\"previous_mode\")"
zamien = "result.get(\"previous_mod\")"
test = "tests/test_zapadka_mutacji.py::test_porownanie_z_poprzednim_przebiegiem_nigdy_nie_zapisuje_pliku_takze_przy_wzroscie_wyniku"

# format_report: tresc linii o braku zapisu.
[[mutant]]
plik = "cicd/mutation_baseline.py"
szukaj = "baseline: nie zapisywany - porownanie z poprzednim przebiegiem"
zamien = "baseline: zapisany"
test = "tests/test_zapadka_mutacji.py::test_porownanie_z_poprzednim_przebiegiem_nigdy_nie_zapisuje_pliku_takze_przy_wzroscie_wyniku"
