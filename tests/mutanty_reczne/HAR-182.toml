) -> Any:
    dostep.wymagaj(k, Uprawnienie.uruchamianie)'''
test = "tests/test_dostep_http.py::test_bez_sesji_start_workflow_daje_401_takze_na_localhoscie_a_run_nie_powstaje"

# Sesja bazy startu pochodzi z zaleznosci get_session, nie z kontekstu zespolu.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = '''    k: Kontekst = Depends(kontekst_sesji),
    s: AsyncSession = Depends(get_session),
) -> Any:
    dostep.wymagaj(k, Uprawnienie.uruchamianie)'''
