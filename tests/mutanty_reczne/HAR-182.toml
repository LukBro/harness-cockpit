linia_tekst = ") -> Any:"
uzasadnienie = "Adnotacja zwracanego typu trasy jest tylko podpowiedzia dla czlowieka i mypy: obie nowe trasy maja jawny `response_model`, a FastAPI przy jawnym `response_model` nie czyta adnotacji zwrotu, wiec zadne wejscie nie odroznia innej adnotacji (tresc odpowiedzi ma wiersze [[mutant]])."
