# HAR-182: start runu workflow z API (POST /api/workflows/{name}/run) i podglad artefaktu runu
# (GET /api/runs/{run_id}/artifacts/{p:path}). Wiersze dla zmian, ktorych mutmut nie widzi:
# dekoratory tras, limity pol, klasy, stale i web/openapi.json.

# --- src/cockpit/api/app.py: start runu ---------------------------------------------------------

# Sciezka trasy startu: inny adres to brak trasy, a start nie dochodzi do runnera.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = '''@app.post("/api/workflows/{name}/run", response_model=RunUtworzony,'''
zamien = '''@app.post("/api/workflows/{name}/start", response_model=RunUtworzony,'''
test = "tests/test_start_workflow.py::test_start_poprawnego_workflow_tworzy_run_projektu_z_nazwa_workflow_i_zwraca_jego_id"

# Model odpowiedzi startu: bez RunUtworzony schemat przestaje opisywac odpowiedz trasy.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = '''@app.post("/api/workflows/{name}/run", response_model=RunUtworzony,
          responses=odpowiedzi_bledow(401, 403, 404, 409, 422))'''
zamien = '''@app.post("/api/workflows/{name}/run", response_model=RunUtworzony,
          responses=odpowiedzi_bledow(401, 403, 404, 422))'''
test = "tests/test_kontrakt_api.py::test_plik_schematu_w_repozytorium_jest_zgodny_z_aplikacja"

# Limit 36 znakow parametru `project` odpowiada kolumnie String(36).
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = '''async def uruchom_workflow(
    name: str,
    project: str = Query(max_length=36),'''
zamien = '''async def uruchom_workflow(
    name: str,
    project: str = Query(max_length=37),'''
test = "tests/test_start_workflow.py::test_parametr_projektu_startu_jest_wymagany_i_ma_limit_36_znakow"

# Sesja zalogowanego (kontekst zespolu) jest wymagana takze przy starcie: bez niej brak 401.
[[mutant]]
plik = "src/cockpit/api/app.py"
szukaj = '''    project: str = Query(max_length=36),
    k: Kontekst = Depends(kontekst_sesji),
    s: AsyncSession = Depends(get_session),
) -> Any:
    dostep.wymagaj(k, Uprawnienie.uruchamianie)'''
zamien = '''    project: str = Query(max_length=36),
    k: Kontekst = Depends(get_session),
