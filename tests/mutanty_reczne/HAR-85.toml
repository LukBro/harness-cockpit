# Tabela recznych mutantow HAR-85: stale modulu i blok __main__ w src/runner/krok.py
# i src/runner/straznik.py - poza zasiegiem mutmuta (kod 3 z tools/mutanty_zmian.py).

# Runner czeka na straznika dluzej niz jego karencja 5 s; przy 1 s zabilby straznika,
# zanim ten wysle SIGKILL, i agent ignorujacy SIGTERM zostalby sierota.
[[mutant]]
plik = "src/runner/krok.py"
szukaj = "LIMIT_NA_STRAZNIKA_S = 8"
zamien = "LIMIT_NA_STRAZNIKA_S = 1"
test = "tests/test_brak_sierot.py::test_anulowanie_kroku_z_agentem_ignorujacym_sigterm_zabija_jego_grupe_sigkillem_straznika"

# Pakiet `runner` biezacego drzewa lezy w src/, nie w src/runner/.
[[mutant]]
plik = "src/runner/krok.py"
szukaj = "KATALOG_PAKIETU = Path(__file__).parent.parent"
zamien = "KATALOG_PAKIETU = Path(__file__).parent"
test = "tests/test_brak_sierot.py::test_katalog_pakietu_to_drzewo_z_pakietem_runner_a_korzen_to_jego_rodzic"

# Straznik startuje z korzenia z pyproject.toml (konfiguracja mutmuta, HAR-50).
[[mutant]]
plik = "src/runner/krok.py"
szukaj = "KATALOG_KORZENIA = KATALOG_PAKIETU.parent"
zamien = "KATALOG_KORZENIA = KATALOG_PAKIETU.parent.parent"
test = "tests/test_brak_sierot.py::test_katalog_pakietu_to_drzewo_z_pakietem_runner_a_korzen_to_jego_rodzic"

# Agent ma 5 s na SIGTERM; przy 1 s agent ignorujacy SIGTERM ginie przed 3 s.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = "CZAS_NA_ZAKONCZENIE_S = 5"
zamien = "CZAS_NA_ZAKONCZENIE_S = 1"
test = "tests/test_brak_sierot.py::test_agent_ignorujacy_sigterm_zyje_po_3_s_karencji_a_potem_dostaje_sigkill_kod_137"

# Blad startu agenta konczy straznika kodem 127.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = "KOD_BLEDU_STARTU = 127"
zamien = "KOD_BLEDU_STARTU = 126"
test = "tests/test_brak_sierot.py::test_blad_startu_bez_deskryptora_statusu_idzie_na_stderr_z_kodem_127"

# Krotki krok petli: koniec agenta widac od razu, nie po kilku sekundach.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = "KROK_PETLI_S = 0.05"
zamien = "KROK_PETLI_S = 5"
test = "tests/test_brak_sierot.py::test_uruchomiony_agent_konczacy_sie_sam_daje_swoj_kod_i_bez_zwlekania[3]"

# Liczba prob karencji daje razem 5 s; piec razy mniej skraca karencje do 1 s.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = "PROBY_KARENCJI = round(CZAS_NA_ZAKONCZENIE_S / KROK_PETLI_S)"
zamien = "PROBY_KARENCJI = round(CZAS_NA_ZAKONCZENIE_S / KROK_PETLI_S) // 5"
test = "tests/test_brak_sierot.py::test_agent_ignorujacy_sigterm_zyje_po_3_s_karencji_a_potem_dostaje_sigkill_kod_137"

# Odczyt zerowej dlugosci zwraca od razu b"" - straznik uznalby otwarty potok za EOF.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = "ROZMIAR_ODCZYTU = 4096"
zamien = "ROZMIAR_ODCZYTU = 0"
test = "tests/test_brak_sierot.py::test_zamkniecie_wejscia_po_uzbrojeniu_ustawia_zdarzenie"

# Straznik jako modul czyta potok od runnera na stdin (fd 0).
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = "FD_WEJSCIA = 0 "
zamien = "FD_WEJSCIA = 1 "
test = "tests/test_brak_sierot.py::test_straznik_uruchomiony_jako_modul_czyta_potok_od_runnera_ze_standardowego_wejscia"

# Nazwa zmiennej z pierwotnym PYTHONPATH jest kontraktem miedzy krokiem a straznikiem.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = 'ZMIENNA_PYTHONPATH_AGENTA = "RUNNER_PYTHONPATH_AGENTA"'
zamien = 'ZMIENNA_PYTHONPATH_AGENTA = "RUNNER_PYTHONPATH"'
test = "tests/test_brak_sierot.py::test_nazwa_zmiennej_z_pythonpath_dla_agenta_jest_stala_i_jawna"

# Bez wejscia w __main__ `python -m runner.straznik` nie uruchamia agenta.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = 'if __name__ == "__main__":'
zamien = 'if __name__ == "__glowny__":'
test = "tests/test_brak_sierot.py::test_straznik_konczy_sie_kodem_wyjscia_agenta[3]"

# Kod wyjscia main musi byc kodem procesu straznika.
[[mutant]]
plik = "src/runner/straznik.py"
szukaj = "    sys.exit(main(sys.argv[1:], FD_WEJSCIA))"
zamien = "    main(sys.argv[1:], FD_WEJSCIA)"
test = "tests/test_brak_sierot.py::test_straznik_uruchomiony_jako_modul_przekazuje_kod_bledu_startu_127"
