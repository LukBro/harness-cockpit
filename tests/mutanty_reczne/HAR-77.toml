[[mutant]]
plik = "web/src/App.tsx"
szukaj = """
    } catch {
      setBladOdswiezenia(true);
    } finally {"""
zamien = """
    } catch {
    } finally {"""
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_zerwane_polaczenie_przy_odswiezaniu_katalogu_pokazuje_komunikat_i_zostawia_liste"

# Nowe odswiezenie zdejmuje komunikat poprzedniego bledu.
[[mutant]]
plik = "web/src/App.tsx"
szukaj = """
    setOdswiezam(true);
    setBladOdswiezenia(false);
"""
zamien = """
    setOdswiezam(true);
"""
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_udane_odswiezenie_po_bledzie_zdejmuje_komunikat_bledu_i_podmienia_liste"

# Przed pierwsza odpowiedzia o runnerach stan jest "nieznany": bez paska i blokady.
[[mutant]]
plik = "web/src/App.tsx"
szukaj = 'useState<StanRunnera>("nieznany")'
zamien = 'useState<StanRunnera>("offline")'
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_przed_pierwsza_odpowiedzia_o_stanie_runnera_widok_nie_jest_w_trybie_tylko_do_odczytu"

# Przed odpowiedzia o katalogu nie ma komunikatu bledu pobrania.
[[mutant]]
plik = "web/src/App.tsx"
szukaj = "const [blad, setBlad] = useState(false);"
zamien = "const [blad, setBlad] = useState(true);"
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_przed_pierwsza_odpowiedzia_o_katalogu_widok_mowi_ladowanie_bez_bledow_i_tabeli"

# Przed pierwszym odswiezeniem nie ma komunikatu bledu odswiezenia.
[[mutant]]
plik = "web/src/App.tsx"
szukaj = "const [bladOdswiezenia, setBladOdswiezenia] = useState(false);"
zamien = "const [bladOdswiezenia, setBladOdswiezenia] = useState(true);"
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_przed_pierwsza_odpowiedzia_o_katalogu_widok_mowi_ladowanie_bez_bledow_i_tabeli"

# Przed pierwszym odswiezeniem przycisk "Odswiez" nie jest w stanie "Odswiezam...".
[[mutant]]
plik = "web/src/App.tsx"
szukaj = "const [odswiezam, setOdswiezam] = useState(false);"
zamien = "const [odswiezam, setOdswiezam] = useState(true);"
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_przed_pierwsza_odpowiedzia_o_katalogu_widok_mowi_ladowanie_bez_bledow_i_tabeli"

# Blad pobrania katalogu konczy "Ladowanie...": nie wisi obok komunikatu bledu.
[[mutant]]
plik = "web/src/App.tsx"
szukaj = "{!blad && katalog === null &&"
zamien = "{katalog === null &&"
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_blad_pobrania_katalogu_pokazuje_komunikat_zamiast_listy"

# Podpowiedz offline tylko przy runnerze offline: online bez tooltipu i opisu.
[[mutant]]
plik = "web/src/App.tsx"
szukaj = 'return offline ? { "aria-describedby": PODPOWIEDZ_OFFLINE_ID, title: PODPOWIEDZ_OFFLINE } : {};'
zamien = 'return { "aria-describedby": PODPOWIEDZ_OFFLINE_ID, title: PODPOWIEDZ_OFFLINE };'
test = "tests/e2e/test_tryb_tylko_do_odczytu.py::test_runner_online_ma_aktywne_przyciski_i_nie_pokazuje_paska_trybu_tylko_do_odczytu"

