# Tabela recznych mutantow HAR-177 (krok systemowy `check`, werdykt jako kontrakt skilla).
# Mutmut nie mutuje stalych modulu, pol dataclass i modeli, zbiorow, wartosci domyslnych pol,
# krotki sprawdzen niezmiennika, wariantow oznaczonych `# pragma: no mutate` (kodowanie
# `utf-8`, `errors="replace"`), budowa.yaml ani SKILL.md. Kazde `szukaj` wystepuje w pliku
# dokladnie raz (przy wpisach HAR-176.toml o tej samej tresci - w osobnych tabelach).
#
# Lista kodu 3 z tools/mutanty_zmian.py: kazda linia ma wiersz [[mutant]] (szukaj obejmuje
# linie) albo [[rownowazny]] (na koncu pliku): kroki_systemowe.py (`if TYPE_CHECKING:` -
# rownowazny; stale i wpis `check` - wiersze), skills.py (stale i pole `verdict`), workflow.py
# (pole `capability`), workflow_walidacja.py (kody problemow i wzorzec nazwy), walidacja.py
# (prefiks, KontraktWerdyktu, Werdykt, krotka SPRAWDZENIA), dowody.py (stale, opcje JSON,
# dataclass _Wyjscie), krok.py (pola werdykt i dowod WynikKroku), silnik.py (alias
# WykonawcaSystemowy - rownowazny; rejestr WYKONAWCY_SYSTEMOWI - wiersze).
# Poza kodem 3: ręczne mutanty dla wariantow pod pragma (XXutf-8XX w obu liniach dowody.py,
# errors="strict"), walidacja.py `read_text` bez kodowania (test w srodowisku locale ascii),
# `stdin=None` (test w osobnym procesie z otwartym stdin), czekanie na drenaz bez limitu,
# elementy budowa.yaml i trzech SKILL.md (kazda wartosc verdict, consumes, needs osobno).

