[[rownowazny]]
plik = "src/cockpit/services/kroki_systemowe.py"
linia_tekst = "if TYPE_CHECKING:"
uzasadnienie = "Blok chroni wylacznie import typu Krok uzywany w adnotacji; modul ma `from __future__ import annotations`, wiec adnotacja nie jest wartosciowana. Zamiana warunku na zawsze prawdziwy robi tylko dodatkowy import cockpit.services.workflow w czasie ladowania (workflow.py nie importuje kroki_systemowe, wiec bez cyklu); zadne wejscie nie odroznia wersji."

[[rownowazny]]
plik = "src/cockpit/services/kroki_systemowe.py"
linia_tekst = "SYSTEM_CHECK: OpisKrokuSystemowego(produces=()),"
uzasadnienie = "Wariant z innym `produces` jest nieodroznialny: opis kroku check liczy `opis_kroku` (produces z nazwy capability), a wpis w KROKI_SYSTEMOWE czyta tylko walidator przez czlonkostwo (`krok.system not in KROKI_SYSTEMOWE`), nikt nie czyta jego `produces` (grep opis_kroku_systemowego: tylko opis_kroku dla systemow innych niz check). Usuniecie wpisu ma wiersz [[mutant]] wyzej."

[[rownowazny]]
plik = "src/runner/silnik.py"
linia_tekst = "WykonawcaSystemowy = Callable[[Krok, Przygotowany], Awaitable[WynikKroku]]"
uzasadnienie = "Alias uzywany tylko w adnotacji WYKONAWCY_SYSTEMOWI; modul ma `from __future__ import annotations`, wiec adnotacja nie jest wartosciowana i zadna sciezka wykonania nie czyta aliasu (grep WykonawcaSystemowy: silnik.py, definicja i adnotacja)."

[[rownowazny]]
plik = "src/runner/dowody.py"
linia_tekst = "argv = []  # pragma: no mutate"
uzasadnienie = "Wariant `argv = None` jest rownowazny: nastepna linia `if not argv:` traktuje None i [] tak samo (wynik ten sam: porazka `komenda nieczytelna`); inny kod wejscia nie odroznia wersji."
