# Tabela recznych mutantow HAR-228: tryb `--pokrycie-kod3` i wpisy `[[rownowazny]]` w
# tools/mutanty_reczne.py oraz krok `pokrycie linii bez mutantów` w .github/workflows/mutation.yml
# (miejsca, ktorych mutmut nie mutuje: tools/ i .github/). Wiersz: element | mutacja | test, ktory
# po mutacji oblewa.
#
# Mutacje rownowazne (zadne wejscie nie odroznia wersji), bez wiersza:
# - `poczatek = tresc.index(szukaj)` -> `tresc.rindex(szukaj)` w `_zakres_linii_szukaj`: funkcja
#   dostaje `szukaj` wylacznie po `_wymagaj_dokladnie_raz`, ktore rzuca `BladNarzedzia` dla liczby
#   wystapien != 1, a przy jednym wystapieniu `index` i `rindex` zwracaja to samo przesuniecie.
# - `if not isinstance(wpis, dict)` w `_wpis_na_mutanta` oraz wszystko, czego HAR-228 nie zmienil
#   (wiersze `[[mutant]]`, `_zabity`, kopiowanie repo): ich wiersze leza w tabelach HAR-150/HAR-225.

# --- stale i typ wpisu [[rownowazny]] ---------------------------------------------------

# Pole `uzasadnienie` jest znanym polem wpisu.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'POLA_ROWNOWAZNEGO = ("plik", "linia_tekst", "uzasadnienie")'
zamien = 'POLA_ROWNOWAZNEGO = ("plik", "linia_tekst")'
test = "tests/test_mutanty_reczne.py::test_linia_rownowazna_jest_pokryta_gdy_tekst_linii_pliku_ma_wciecie_a_wpis_go_nie_ma"

