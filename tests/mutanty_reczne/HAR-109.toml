# Tabela recznych mutantow HAR-109: stala i kodeki silnika petli naprawczej, ktorych mutmut
# nie mutuje albo mutuje niepelnie. Kazde `szukaj` wystepuje w pliku dokladnie raz.

[[mutant]]
plik = "src/runner/silnik.py"
szukaj = "LINIE_OGONA = 20"
zamien = "LINIE_OGONA = 19"
