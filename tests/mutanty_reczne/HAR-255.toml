# Tabela recznych mutantow HAR-255: statystyki mutmuta w shardach i dowod zamiast "clean tests".
# Mutmut nie mutuje workflow ani tools/, wiec ta tabela jest jedyna egzekucja ich regul. Wiersz:
# element | mutacja | test, ktory po mutacji oblewa. `szukaj` jest KONTRAKTEM tekstu dla implementacji:
# wystepuje w pliku dokladnie raz (HAR-255: szkielet linii w raporcie test-writera).
#
# Pliki:
# - .github/workflows/mutation.yml: job `mutation-statystyki` (macierz shardow) i zmiany jobu `mutation`,
# - tools/mutanty_zmian.py: flaga `--katalog-dowodow` i opakowanie `mutmut-run`,
# - tools/statystyki_mutmuta.py: podzial testow, odcisk zrodel, wczytanie i sprawdzenie dowodow,
#   zlozenie statystyk, podmiana clean tests, sha commita i bramki podkomendy `shard`.
#
# Bez wierszy (mutacja rownowazna): komentarze i docstringi; tresc komunikatow chronia testy porownujace
# caly napis (mutant XX...XX zachowuje slowa, wiec nie ma osobnych wierszy na kazdy komunikat).

# ===========================================================================
# .github/workflows/mutation.yml: job zbiorczy `mutation`
# ===========================================================================

# Bez `always()` job zbiorczy pomijalby sie po czerwonym shardzie, a wymagany check swiecilby jako pominiety.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "if: github.event_name == 'pull_request' && always()"
zamien = "if: github.event_name == 'pull_request'"
test = "tests/test_workflow_mutacje.py::test_zadanie_mutation_odpala_sie_na_pull_request_a_nie_na_push"

# `always()` zamiast warunku zdarzenia uruchomiloby job takze na push.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "if: github.event_name == 'pull_request' && always()"
zamien = "if: always()"
test = "tests/test_workflow_mutacje.py::test_zadanie_mutation_odpala_sie_na_pull_request_a_nie_na_push"

# Alternatywa zamiast koniunkcji.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "if: github.event_name == 'pull_request' && always()"
zamien = "if: github.event_name == 'pull_request' || always()"
test = "tests/test_workflow_mutacje.py::test_zadanie_mutation_odpala_sie_na_pull_request_a_nie_na_push"

# Job zbiorczy bez zaleznosci od shardow.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "needs: [mutation-statystyki]"
zamien = "needs: []"
test = "tests/test_workflow_mutacje.py::test_zadanie_mutation_czeka_na_shardy_statystyk_i_zostaje_kluczem_bez_nazwy_wlasnej"

# Job zbiorczy z wlasna nazwa zmienilby nazwe wymaganego checku.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "needs: [mutation-statystyki]"
zamien = "needs: [mutation-statystyki]\n    name: mutation-zbiorczy"
test = "tests/test_workflow_mutacje.py::test_zadanie_mutation_czeka_na_shardy_statystyk_i_zostaje_kluczem_bez_nazwy_wlasnej"

# Wyniki jobow z wyrazenia innego niz lista wszystkich `needs`.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "WYNIKI_SHARDOW: ${{ join(needs.*.result, ' ') }}"
zamien = "WYNIKI_SHARDOW: ${{ needs.mutation-statystyki.result }}"
test = "tests/test_workflow_mutacje.py::test_krok_wyniku_shardow_czyta_wyniki_jobow_ze_zmiennej_srodowiska_a_nie_z_wyrazenia_w_skrypcie"

# Krok wyniku shardow nie jest pierwszym krokiem joba (checkout przed nim).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''    steps:
      - name: wynik shardów statystyk mutmuta'''
zamien = '''    steps:
      - uses: actions/checkout@v7
      - name: wynik shardów statystyk mutmuta'''
test = "tests/test_workflow_mutacje.py::test_krok_wyniku_shardow_jest_pierwszym_krokiem_zadania_mutation_i_nie_ma_warunku"

# Krok wyniku shardow pod inna nazwa.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "- name: wynik shardów statystyk mutmuta"
zamien = "- name: wynik shardow"
test = "tests/test_workflow_mutacje.py::test_krok_wyniku_shardow_jest_pierwszym_krokiem_zadania_mutation_i_nie_ma_warunku"

# Pusty wynik traktowany jak sukces (-z zamienione na -n).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '[ -z "${WYNIKI_SHARDOW//[[:space:]]/}" ]'
zamien = '[ -n "${WYNIKI_SHARDOW//[[:space:]]/}" ]'
test = "tests/test_workflow_mutacje.py::test_brak_wyniku_shardow_oblewa_krok_wyniku_z_osobnym_komunikatem[pusty]"

# Wynik z samych spacji przechodzi jako niepusty.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '${WYNIKI_SHARDOW//[[:space:]]/}'
zamien = '${WYNIKI_SHARDOW}'
test = "tests/test_workflow_mutacje.py::test_brak_wyniku_shardow_oblewa_krok_wyniku_z_osobnym_komunikatem[same_spacje]"

# Komunikat bez wyjscia z kodem 1 to zielony krok (ksztalty-mutantow.md: kazda galaz exit 1).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''brak wyniku shardow statystyk mutmuta"
            exit 1'''
zamien = 'brak wyniku shardow statystyk mutmuta"'
test = "tests/test_workflow_mutacje.py::test_brak_wyniku_shardow_oblewa_krok_wyniku_z_osobnym_komunikatem[pusty]"

# Drugi exit 1 (wynik inny niz success): bez niego petla konczy sie kodem 0.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''(wyniki: $WYNIKI_SHARDOW)"
              exit 1'''
zamien = '(wyniki: $WYNIKI_SHARDOW)"'
test = "tests/test_workflow_mutacje.py::test_kazdy_wynik_shardow_inny_niz_success_oblewa_krok_wyniku_z_brakiem_dowodu[failure]"

# Odwrocone porownanie: czerwony przy success.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'if [ "$wynik" != "success" ]; then'
zamien = 'if [ "$wynik" = "success" ]; then'
test = "tests/test_workflow_mutacje.py::test_wszystkie_shardy_z_wynikiem_success_daja_zielony_krok_wyniku[jeden_job_zielony]"

# Slowo oczekiwane literowka: success nie jest sukcesem.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '!= "success"'
zamien = '!= "succes"'
test = "tests/test_workflow_mutacje.py::test_wszystkie_shardy_z_wynikiem_success_daja_zielony_krok_wyniku[jeden_job_zielony]"

# Sprawdzany tylko pierwszy wynik: drugi job nie jest sukcesem, a krok zielony.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'for wynik in $WYNIKI_SHARDOW; do'
zamien = 'for wynik in ${WYNIKI_SHARDOW%% *}; do'
test = "tests/test_workflow_mutacje.py::test_kazdy_wynik_shardow_inny_niz_success_oblewa_krok_wyniku_z_brakiem_dowodu[drugi_failure]"

# Sprawdzany tylko ostatni wynik.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'for wynik in $WYNIKI_SHARDOW; do'
zamien = 'for wynik in ${WYNIKI_SHARDOW##* }; do'
test = "tests/test_workflow_mutacje.py::test_kazdy_wynik_shardow_inny_niz_success_oblewa_krok_wyniku_z_brakiem_dowodu[pierwszy_failure]"

# --- pobranie dowodow i scalenie ---------------------------------------------------------------

# Maska pobrania nie lapie artefaktow shardow.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "pattern: dowody-*"
zamien = "pattern: wyniki-*"
test = "tests/test_workflow_mutacje.py::test_artefakty_dowodow_sa_pobierane_do_jednego_katalogu_pasujacego_do_nazw_wgranych_przez_shardy"

# Maska pobrania lapie takze artefakt raportu mutacji.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "pattern: dowody-*"
zamien = 'pattern: "*"'
test = "tests/test_workflow_mutacje.py::test_pobranie_dowodow_nie_lapie_artefaktu_raportu_mutacji"

# Bez merge-multiple kazdy shard trafia do podkatalogu i skrypt nie widzi plikow shard-N.json.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "merge-multiple: true"
zamien = "merge-multiple: false"
test = "tests/test_workflow_mutacje.py::test_artefakty_dowodow_sa_pobierane_do_jednego_katalogu_pasujacego_do_nazw_wgranych_przez_shardy"

# Pobranie do innego katalogu niz wgrany.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''pattern: dowody-*
          path: dowody'''
zamien = '''pattern: dowody-*
          path: wyniki'''
test = "tests/test_workflow_mutacje.py::test_artefakty_dowodow_sa_pobierane_do_jednego_katalogu_pasujacego_do_nazw_wgranych_przez_shardy"

# Scalenie wolane z innym katalogiem niz pobrany.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "scal --katalog-dowodow dowody"
zamien = "scal --katalog-dowodow inny"
test = "tests/test_workflow_mutacje.py::test_krok_scalenia_woła_narzedzie_z_katalogiem_dowodow"

# Scalenie wola zla podkomende.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "python3 tools/statystyki_mutmuta.py scal"
zamien = "python3 tools/statystyki_mutmuta.py shard"
test = "tests/test_workflow_mutacje.py::test_krok_scalenia_woła_narzedzie_z_katalogiem_dowodow"

# Krok scalenia pod inna nazwa.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "- name: scalenie statystyk shardów"
zamien = "- name: scalenie statystyk"
test = "tests/test_workflow_mutacje.py::test_scalenie_statystyk_stoi_po_przywroceniu_cache_i_pobraniu_dowodow_a_przed_mutantami_zmienionych_funkcji"

# Kolejnosc: krok scalenia przed przywroceniem cache (cache nadpisalby scalone statystyki).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "- uses: actions/cache/restore@v4"
zamien = '''- name: scalenie statystyk shardów
        run: echo przesuniete przed cache
      - uses: actions/cache/restore@v4'''
test = "tests/test_workflow_mutacje.py::test_scalenie_statystyk_stoi_po_przywroceniu_cache_i_pobraniu_dowodow_a_przed_mutantami_zmienionych_funkcji"

# Kolejnosc: pobranie dowodow po scaleniu.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "- uses: actions/download-artifact@v4"
zamien = '''- name: scalenie statystyk shardów
        run: echo przesuniete przed pobranie
      - uses: actions/download-artifact@v4'''
test = "tests/test_workflow_mutacje.py::test_scalenie_statystyk_stoi_po_przywroceniu_cache_i_pobraniu_dowodow_a_przed_mutantami_zmienionych_funkcji"

# Narzedzie mutantow zmian bez katalogu dowodow wola oryginalne clean tests.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = " --katalog-dowodow dowody > mutants/mutanty-zmian.txt"
zamien = " > mutants/mutanty-zmian.txt"
test = "tests/test_workflow_mutacje.py::test_narzedzie_mutantow_zmian_dostaje_katalog_dowodow_shardow"

# Narzedzie mutantow zmian z innym katalogiem niz scalony.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "--katalog-dowodow dowody > mutants/mutanty-zmian.txt"
zamien = "--katalog-dowodow inny > mutants/mutanty-zmian.txt"
test = "tests/test_workflow_mutacje.py::test_narzedzie_mutantow_zmian_dostaje_katalog_dowodow_shardow"

# ===========================================================================
# .github/workflows/mutation.yml: job shardow `mutation-statystyki`
# ===========================================================================

# Shardy na push zamiast na pull_request.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = """  mutation-statystyki:
    if: github.event_name == 'pull_request'"""
zamien = """  mutation-statystyki:
    if: github.event_name == 'push'"""
test = "tests/test_workflow_mutacje.py::test_zadanie_statystyk_shardow_odpala_sie_tylko_na_pull_request"

# Macierz bez shardu 0.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "shard: [0, 1, 2, 3]"
zamien = "shard: [1, 2, 3]"
test = "tests/test_workflow_mutacje.py::test_macierz_shardow_ma_co_najmniej_dwa_kolejne_indeksy_od_zera"

# Macierz z dziura w indeksach.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "shard: [0, 1, 2, 3]"
zamien = "shard: [0, 1, 3]"
test = "tests/test_workflow_mutacje.py::test_macierz_shardow_ma_co_najmniej_dwa_kolejne_indeksy_od_zera"

# Macierz z jednym shardem.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "shard: [0, 1, 2, 3]"
zamien = "shard: [0]"
test = "tests/test_workflow_mutacje.py::test_macierz_shardow_ma_co_najmniej_dwa_kolejne_indeksy_od_zera"

# Indeks shardu staly zamiast z macierzy.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "SHARD: ${{ matrix.shard }}"
zamien = "SHARD: 0"
test = "tests/test_workflow_mutacje.py::test_krok_shardu_dostaje_indeks_i_liczbe_shardow_ze_zmiennych_srodowiska"

# Liczba shardow stala zamiast z `strategy.job-total`.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "LICZBA_SHARDOW: ${{ strategy.job-total }}"
zamien = "LICZBA_SHARDOW: 4"
test = "tests/test_workflow_mutacje.py::test_krok_shardu_dostaje_indeks_i_liczbe_shardow_ze_zmiennych_srodowiska"

# Narzedzie shardu bez indeksu z macierzy.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '--indeks "$SHARD"'
zamien = "--indeks 0"
test = "tests/test_workflow_mutacje.py::test_krok_shardu_woła_narzedzie_z_indeksem_liczba_shardow_i_katalogiem_dowodow"

# Narzedzie shardu z liczba shardow 1.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '--liczba "$LICZBA_SHARDOW"'
zamien = "--liczba 1"
test = "tests/test_workflow_mutacje.py::test_krok_shardu_woła_narzedzie_z_indeksem_liczba_shardow_i_katalogiem_dowodow"

# Narzedzie shardu zapisuje dowod w innym katalogu niz wgrywany.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '"$LICZBA_SHARDOW" --katalog-dowodow dowody'
zamien = '"$LICZBA_SHARDOW" --katalog-dowodow inny'
test = "tests/test_workflow_mutacje.py::test_krok_shardu_woła_narzedzie_z_indeksem_liczba_shardow_i_katalogiem_dowodow"

# Krok shardu pod inna nazwa.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "- name: statystyki mutmuta shardu"
zamien = "- name: statystyki shardu"
test = "tests/test_workflow_mutacje.py::test_krok_shardu_stoi_po_instalacji_zaleznosci_z_mutmutem"

# Krok shardu przed instalacja zaleznosci.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''- run: pip install -e ".[dev]"
      - name: statystyki mutmuta shardu'''
zamien = '''- name: statystyki mutmuta shardu
        run: echo przesuniete przed instalacje
      - run: pip install -e ".[dev]"
      - name: statystyki mutmuta shardu'''
test = "tests/test_workflow_mutacje.py::test_krok_shardu_stoi_po_instalacji_zaleznosci_z_mutmutem"

# Shard przywraca cache mutmuta (statystyki ze starego stanu).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''- run: pip install -e ".[dev]"
      - name: statystyki mutmuta shardu'''
zamien = '''- run: pip install -e ".[dev]"
      - uses: actions/cache/restore@v4
        with:
          path: mutants
          key: mutmut-v1-x
      - name: statystyki mutmuta shardu'''
test = "tests/test_workflow_mutacje.py::test_zadanie_statystyk_shardow_nie_przywraca_ani_nie_zapisuje_cache_mutmuta"

# Dowod wgrywany pod ta sama nazwa przez kazdy shard.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''name: dowody-${{ matrix.shard }}
          path: dowody'''
zamien = '''name: dowody
          path: dowody'''
test = "tests/test_workflow_mutacje.py::test_dowod_shardu_jest_wgrywany_jako_artefakt_o_nazwie_z_indeksem_shardu_po_kroku_shardu"

# Wgrywany inny katalog niz zapisuje narzedzie.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''name: dowody-${{ matrix.shard }}
          path: dowody'''
zamien = '''name: dowody-${{ matrix.shard }}
          path: wyniki'''
test = "tests/test_workflow_mutacje.py::test_dowod_shardu_jest_wgrywany_jako_artefakt_o_nazwie_z_indeksem_shardu_po_kroku_shardu"

# Drugie wgranie przed krokiem shardu.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "- name: statystyki mutmuta shardu"
zamien = '''- uses: actions/upload-artifact@v4
        with:
          name: dowody-${{ matrix.shard }}
          path: dowody
      - name: statystyki mutmuta shardu'''
test = "tests/test_workflow_mutacje.py::test_dowod_shardu_jest_wgrywany_jako_artefakt_o_nazwie_z_indeksem_shardu_po_kroku_shardu"

# ===========================================================================
# tools/mutanty_zmian.py: flaga `--katalog-dowodow` i opakowanie `mutmut-run`
# ===========================================================================

# Flaga z domyslnym katalogiem: bez flagi tez idzie opakowanie.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = '"--katalog-dowodow", type=Path, default=None,'
zamien = '"--katalog-dowodow", type=Path, default=Path("dowody"),'
test = "tests/test_mutanty_zmian.py::test_bez_katalogu_dowodow_mutmut_biegnie_zwyklym_run_z_oryginalnymi_clean_tests"

# Flaga przeczytana, ale niepodana do `_przebieg`.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "args.od_przebiegu, args.katalog_dowodow"
zamien = "args.od_przebiegu"
test = "tests/test_mutanty_zmian.py::test_z_katalogiem_dowodow_mutmut_biegnie_przez_opakowanie_z_dowodami_a_nie_zwyklym_run"

# Katalog dowodow, ktory nie istnieje, przechodzi bez bledu.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "if not jest_katalogiem:"
zamien = "if jest_katalogiem:"
test = "tests/test_mutanty_zmian.py::test_katalog_dowodow_ktory_nie_istnieje_to_kod_2_z_brakiem_dowodu_bez_wolania_gita_i_mutmuta"

# Kontrola katalogu bez warunku obecnosci flagi: pada na None.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "if katalog_dowodow is not None:\n        try:"
zamien = "if True:\n        try:"
test = "tests/test_mutanty_zmian.py::test_bez_katalogu_dowodow_mutmut_biegnie_zwyklym_run_z_oryginalnymi_clean_tests"

# Kazdy podany katalog traktowany jak brakujacy.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "if not jest_katalogiem:"
zamien = "if True:"
test = "tests/test_mutanty_zmian.py::test_z_katalogiem_dowodow_mutmut_biegnie_przez_opakowanie_z_dowodami_a_nie_zwyklym_run"

# Zwykly plik zamiast katalogu przechodzi (is_dir -> exists).
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "jest_katalogiem = katalog_dowodow.is_dir()"
zamien = "jest_katalogiem = katalog_dowodow.exists()"
test = "tests/test_mutanty_zmian.py::test_zwykly_plik_zamiast_katalogu_dowodow_to_kod_2_z_brakiem_dowodu"

# Katalog dowodow, ktorego is_dir rzuca OSError (brak praw): wyjatek ucieka (zly typ w `except`).
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "except OSError as blad_stat:"
zamien = "except () as blad_stat:"
test = "tests/test_mutanty_zmian.py::test_katalog_dowodow_ktorego_nie_da_sie_sprawdzic_to_kod_2_z_brakiem_dowodu_bez_wolania_gita_i_mutmuta"

# Wybor polecenia odwrocony.
[[mutant]]
plik = "tools/mutanty_zmian.py"
szukaj = "if katalog_dowodow is None:"
