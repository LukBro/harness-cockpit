# fullmatch -> match / search: do regexu docieraja tylko nazwy z filtra fnmatch `shard-*.json` (zaczynaja sie od
# `shard-` i koncza na `.json`). Nazwa z dopiskiem po `.json` (np. `shard-1.json.json`) daje przy `match` numer 1 i
# odrzucenie `nazwa pliku nie jest postaci shard-N.json` z porownania nazwy, a przy `fullmatch` to samo odrzucenie
# z galezi `else`: ten sam wyjatek i komunikat. Nazwa z przedrostkiem przed `shard-` nie przechodzi fnmatch.
[[rownowazny]]
plik = "tools/statystyki_mutmuta.py"
linia_tekst = "dopasowanie = WZORZEC_PLIKU.fullmatch(plik.name)"
uzasadnienie = "kazda nazwa, ktora match/search przyjmuje inaczej niz fullmatch, ma dopisek po .json albo przedrostek, a pierwsze odrzuca ten sam BladDowodu z porownania nazwy, drugie filtr fnmatch; wejscia o innym wyniku nie ma"

# Kropka w regexie `\.json` nieescapowana: nazwa przechodzaca fnmatch konczy sie literalnym `.json`, wiec kropka
# `.` dopasowuje ta sama kropke; nazwa z innym znakiem w miejscu kropki nie przechodzi filtra fnmatch.
[[rownowazny]]
plik = "tools/statystyki_mutmuta.py"
linia_tekst = 'WZORZEC_PLIKU = re.compile(r"shard-(\d+)\.json")'
uzasadnienie = "do regexu docieraja tylko nazwy konczace sie literalnym .json (filtr fnmatch), wiec nieescapowana kropka dopasowuje te sama kropke; nazwa z innym znakiem zamiast kropki nie dociera do regexu"

