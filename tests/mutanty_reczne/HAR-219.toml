[[rownowazny]]
plik = "src/runner/maskowanie.py"
linia_tekst = "r\"(\\b\\w*(?:TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)\\w*=)(\\\"[^\\\"]*\\\"|'[^']*'|\\S+)\","
uzasadnienie = "Kotwica `\\b` na poczatku `_PRZYPISANIE_SEKRETU` jest redundantna: poczatek najbardziej wysunietego w lewo dopasowania nie moze stac za znakiem slowa, bo `\\w*` zaczynajace wczesniej pochlonie ten znak i tez dopasuje; po znaku niebedacym slowem granica `\\b` zachodzi sama. Wynik `sub` jest ten sam z kotwica i bez niej, zadne wejscie nie odroznia wersji. Pozostale elementy tej linii maja osobne wiersze [[mutant]]."

