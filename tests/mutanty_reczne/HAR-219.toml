# Tabela recznych mutantow HAR-219 (straz roli: fail-closed przy awarii startu i obejscia
# no_git_write): stale, zbiory, wyrazenia regularne i napisy poza funkcjami w
# src/runner/straz_roli.py, src/runner/hooks.py i src/runner/maskowanie.py - mutmut ich nie mutuje.
# Kazdy wiersz zmienia jeden element; wskazany test (caly, ze wszystkimi parametrami) musi
# na nim oblac. Cale literaly zbiorow i wyrazen sa mutowane osobnym wierszem (pusty zbior,
# wyrazenie, ktore nigdy nie pasuje), zeby kazda linia literalu miala wiersz.

# Blok try/except importow (straz_roli.py, caly): importy bez ochrony; zepsuty import konczy sie tracebackiem zamiast JSON-em deny.
[[mutant]]
plik = "src/runner/straz_roli.py"
szukaj = "_BLAD_STARTU: BaseException | None = None\ntry:\n    from cockpit.services.invariants import Rola, profil_roli  # noqa: E402\n    from cockpit.services.walidacja import (  # noqa: E402\n        _OPCJE_Z_ARGUMENTEM,\n        _ZNAKI_POWLOKI,\n        _to_git,\n        waliduj_definicje,\n    )\n    from runner.maskowanie import maskuj_komende  # noqa: E402\nexcept Exception as exc:\n    _BLAD_STARTU = exc"
zamien = "_BLAD_STARTU: BaseException | None = None\nfrom cockpit.services.invariants import Rola, profil_roli  # noqa: E402\nfrom cockpit.services.walidacja import (  # noqa: E402\n    _OPCJE_Z_ARGUMENTEM,\n    _ZNAKI_POWLOKI,\n    _to_git,\n    waliduj_definicje,\n)\nfrom runner.maskowanie import maskuj_komende  # noqa: E402"
test = "tests/test_straz_roli.py::test_zepsuty_import_strazy_uruchomionej_bezposrednio_daje_json_deny_z_nazwa_wyjatku"

