# Tabela recznych mutantow HAR-156: front i PostgreSQL dla mutantow sprawdzanych testami
# e2e (tools/mutanty_reczne.py i .github/workflows/mutation.yml) oraz zmiana we froncie.
# Mutmut nie mutuje tools/ ani workflow, wiec ta tabela jest jedyna egzekucja tych regul.

# ===========================================================================
# web/src/App.tsx: kryterium 1 (CI buduje front i uruchamia e2e na PostgreSQL)
# ===========================================================================

# Przycisk startu runu nazywa sie "Uruchom": test e2e klika go po nazwie.
[[mutant]]
plik = "web/src/WidokRunu.tsx"
szukaj = '"Uruchamiam…" : "Uruchom"'
zamien = '"Uruchamiam…" : "Start"'
test = "tests/e2e/test_szkielet_w_przegladarce.py::test_klikniecie_uruchom_pokazuje_wynik_procesu"

# ===========================================================================
# tools/mutanty_reczne.py: raport JUnit (skip, zero testow i brak raportu to brak dowodu)
# ===========================================================================

# Jedno pominiecie wystarcza: granica to 1, nie 2.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if pominiete > 0:"
zamien = "if pominiete > 1:"
test = "tests/test_mutanty_reczne.py::test_pominiecie_w_raporcie_to_blad_narzedzia_z_brakiem_dowodu_i_node_id_testu"

# Zero uruchomionych testow to brak dowodu (sprawdzenie tests == 0).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if uruchomione == 0:"
zamien = "if uruchomione < 0:"
test = "tests/test_mutanty_reczne.py::test_raport_bez_ani_jednego_uruchomionego_testu_to_blad_narzedzia_z_brakiem_dowodu"

# Komunikat zera testow niesie "brak dowodu".
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "nic nie uruchomiono wedlug raportu JUnit - brak dowodu"
zamien = "nic nie uruchomiono wedlug raportu JUnit"
test = "tests/test_mutanty_reczne.py::test_raport_bez_ani_jednego_uruchomionego_testu_to_blad_narzedzia_z_brakiem_dowodu"

# Brak licznika tests w raporcie to zero testow, nie jeden.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 's.get("tests", "0")'
zamien = 's.get("tests", "1")'
test = "tests/test_mutanty_reczne.py::test_raport_bez_licznika_tests_to_zero_uruchomionych_testow_a_wiec_brak_dowodu"

# Brak licznika skipped w raporcie to zero pominiec, nie jedno.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 's.get("skipped", "0")'
zamien = 's.get("skipped", "1")'
test = "tests/test_mutanty_reczne.py::test_raport_bez_licznika_skipped_to_zero_pominiec_gdy_test_sie_uruchomil"

# Korzeniem raportu moze byc sam testsuite: liczba testow liczona tez z korzenia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'uruchomione = sum(int(s.get("tests", "0")) for s in korzen.iter("testsuite"))'
zamien = 'uruchomione = sum(int(s.get("tests", "0")) for s in korzen.findall("testsuite"))'
test = "tests/test_mutanty_reczne.py::test_sam_testsuite_bez_pominiec_jest_dowodem"

# Korzeniem raportu moze byc sam testsuite: pominiecia liczone tez z korzenia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'pominiete = sum(int(s.get("skipped", "0")) for s in korzen.iter("testsuite"))'
zamien = 'pominiete = sum(int(s.get("skipped", "0")) for s in korzen.findall("testsuite"))'
test = "tests/test_mutanty_reczne.py::test_pominiecie_w_sam_testsuite_bez_testsuites_to_blad_narzedzia"

# Komunikat pominiecia zawiera slowo "pominięty".
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '{test}: test pominięty'
zamien = '{test}: test pomijany'
test = "tests/test_mutanty_reczne.py::test_pominiecie_w_raporcie_to_blad_narzedzia_z_brakiem_dowodu_i_node_id_testu"

# Komunikat pominiecia wskazuje node id testu.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'raise BladNarzedzia(f"{test}: test pominięty'
zamien = 'raise BladNarzedzia(f"test pominięty'
test = "tests/test_mutanty_reczne.py::test_pominiecie_w_raporcie_to_blad_narzedzia_z_brakiem_dowodu_i_node_id_testu"

# except OSError: raport bedacy katalogiem to IsADirectoryError, nie FileNotFoundError.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''    except OSError as blad:
        raise BladNarzedzia(f"{test}: brak raportu JUnit'''
zamien = '''    except FileNotFoundError as blad:
        raise BladNarzedzia(f"{test}: brak raportu JUnit'''
test = "tests/test_mutanty_reczne.py::test_raport_bedacy_katalogiem_to_blad_narzedzia_z_brakiem_dowodu"

# Komunikat braku raportu niesie "brak dowodu".
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "brak raportu JUnit {sciezka}: brak dowodu"
zamien = "brak raportu JUnit {sciezka}: ok"
test = "tests/test_mutanty_reczne.py::test_raport_bedacy_katalogiem_to_blad_narzedzia_z_brakiem_dowodu"

# except ET.ParseError: nieparsowalny XML to blad narzedzia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "except ET.ParseError as blad:"
zamien = "except KeyError as blad:"
test = "tests/test_mutanty_reczne.py::test_raport_xml_ktorego_nie_da_sie_sparsowac_to_blad_narzedzia_z_brakiem_dowodu"

# Komunikat nieparsowalnego XML niesie "brak dowodu".
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "nie jest poprawnym XML: brak dowodu"
zamien = "nie jest poprawnym XML: ok"
test = "tests/test_mutanty_reczne.py::test_raport_xml_ktorego_nie_da_sie_sparsowac_to_blad_narzedzia_z_brakiem_dowodu"

# except ValueError: licznik nie bedacy liczba to blad narzedzia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''    except ValueError as blad:
        raise BladNarzedzia(f"{test}: raport JUnit ma'''
zamien = '''    except KeyError as blad:
        raise BladNarzedzia(f"{test}: raport JUnit ma'''
test = "tests/test_mutanty_reczne.py::test_raport_z_atrybutem_nie_bedacym_liczba_to_blad_narzedzia_z_brakiem_dowodu"

# Komunikat licznika nie bedacego liczba niesie "brak dowodu".
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "liczniki nie bedace liczbami: brak dowodu"
zamien = "liczniki nie bedace liczbami: ok"
test = "tests/test_mutanty_reczne.py::test_raport_z_atrybutem_nie_bedacym_liczba_to_blad_narzedzia_z_brakiem_dowodu"

# ===========================================================================
# tools/mutanty_reczne.py: uruchom_test (raport, srodowisko, kod 0/1)
# ===========================================================================

# Raport JUnit ma stala nazwe w kopii.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'RAPORT_JUNIT = ".mutanty-reczne-junit.xml"'
zamien = 'RAPORT_JUNIT = "raport-junit.xml"'
test = "tests/test_mutanty_reczne.py::test_raport_junit_ma_stala_nazwe_i_jest_zapisywany_w_kopii_przez_uruchom_test"

# Pytest dostaje --junitxml: bez niego nie ma dowodu uruchomienia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'f"--junitxml={raport}", test,'
zamien = 'test,'
test = "tests/test_mutanty_reczne.py::test_test_zielony_w_kopii_daje_kod_0"

# Stary raport jest usuwany przed przebiegiem.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "raport.unlink(missing_ok=True)"
zamien = "pass"
test = "tests/test_mutanty_reczne.py::test_raport_z_pierwszego_przebiegu_nie_jest_czytany_w_drugim_przebiegu_w_tej_samej_kopii"

# Brak starego raportu (pierwszy przebieg) nie jest bledem.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "raport.unlink(missing_ok=True)"
zamien = "raport.unlink(missing_ok=False)"
test = "tests/test_mutanty_reczne.py::test_test_zielony_w_kopii_daje_kod_0"

# Stary raport, ktorego nie da sie usunac, to blad narzedzia (OSError tlumaczony).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''    except OSError as blad:
        raise BladNarzedzia(f"nie da sie usunac starego raportu'''
zamien = '''    except KeyError as blad:
        raise BladNarzedzia(f"nie da sie usunac starego raportu'''
test = "tests/test_mutanty_reczne.py::test_stary_raport_ktorego_nie_da_sie_usunac_konczy_uruchomienie_testu_bledem_narzedzia"

# COCKPIT_WYMAGAJ_BAZY jest usuwane ze srodowiska pytesta (skip to nie zabity mutant).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "srodowisko.pop(ZMIENNA_WYMAGANIA_BAZY, None)"
zamien = "pass"
test = "tests/test_mutanty_reczne.py::test_zmienna_wymagaj_bazy_nie_trafia_do_procesu_pytesta"

# Nazwa usuwanej zmiennej to COCKPIT_WYMAGAJ_BAZY.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'ZMIENNA_WYMAGANIA_BAZY = "COCKPIT_WYMAGAJ_BAZY"'
zamien = 'ZMIENNA_WYMAGANIA_BAZY = "COCKPIT_WYMAGAJ_BAZ"'
test = "tests/test_mutanty_reczne.py::test_zmienna_wymagaj_bazy_nie_trafia_do_procesu_pytesta"

# Raport sprawdzamy dla kodu 1 (czerwony test), nie tylko dla 0.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if kod in (0, 1):"
zamien = "if kod in (0,):"
test = "tests/test_mutanty_reczne.py::test_test_czerwony_tez_jest_sprawdzany_raportem_junit"

# Raport sprawdzamy dla kodu 0 (zielony test), nie tylko dla 1.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if kod in (0, 1):"
zamien = "if kod in (1,):"
test = "tests/test_mutanty_reczne.py::test_test_zielony_jest_sprawdzany_raportem_junit_z_kopii"

# Raportu nie ma dla innych kodow (zly node id): ocena kodu nalezy do wolajacego.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "if kod in (0, 1):"
zamien = "if True:"
test = "tests/test_mutanty_reczne.py::test_zly_node_id_nie_jest_sprawdzany_raportem_bo_kod_pytesta_4_ocenia_wolajacy"

# Sprawdzany jest raport z kopii, nie inny plik.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "sprawdz_raport_junit(raport, test)"
zamien = "sprawdz_raport_junit(raport.parent, test)"
test = "tests/test_mutanty_reczne.py::test_test_zielony_jest_sprawdzany_raportem_junit_z_kopii"

# ===========================================================================
# tools/mutanty_reczne.py: _uruchom_proces (grupa procesow, limit, wyjscie)
# ===========================================================================

# Proces startuje w katalogu kopii.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''cwd=cwd,
            env=srodowisko,'''
zamien = '''cwd=None,
            env=srodowisko,'''
test = "tests/test_mutanty_reczne.py::test_npm_ci_i_npm_run_build_biegna_w_katalogu_web_kopii"

# Stderr procesu laczy sie ze stdout: koncowka wyjscia npm ma oba kanaly.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "stderr=subprocess.STDOUT,"
zamien = "stderr=subprocess.DEVNULL,"
test = "tests/test_mutanty_reczne.py::test_blad_budowania_to_blad_narzedzia_z_kodem_poleceniem_i_koncowka_wyjscia"

# OSError przy starcie procesu (brak npm) to blad narzedzia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '''    except OSError as blad:
        raise BladNarzedzia(f"nie da sie uruchomic {co}'''
zamien = '''    except KeyError as blad:
        raise BladNarzedzia(f"nie da sie uruchomic {co}'''
test = "tests/test_mutanty_reczne.py::test_brak_npm_w_path_to_blad_narzedzia_a_nie_oserror"

# Po limicie ginie cala grupa procesow (potomek npm), nie tylko lider.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = "os.killpg(proces.pid, signal.SIGKILL)"
zamien = "proces.kill()"
test = "tests/test_mutanty_reczne.py::test_przekroczony_limit_budowania_to_blad_narzedzia_a_proces_npm_ginie"

# Wyjscie w zlym UTF-8 nie wywala narzedzia.
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = 'errors="replace"'
zamien = 'errors="strict"'
test = "tests/test_mutanty_reczne.py::test_wyjscie_npm_w_zlym_utf8_nie_psuje_udanego_budowania"

