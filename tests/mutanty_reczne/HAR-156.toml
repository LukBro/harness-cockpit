# Warunek startu PostgreSQL (`tabele == '1'`, HAR-221) pokrywa tabela HAR-221.toml;
# dawny wiersz z `front == '1'` nie ma juz swojego tekstu w mutation.yml.

# Wykrycie frontu stoi PRZED krokiem Node (kolejnosc krokow).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''- name: front dla mutantów ręcznych
        id: front
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          tabele="$(git diff --name-only --no-renames --diff-filter=d "origin/$BASE_REF...HEAD" -- 'tests/mutanty_reczne/*.toml')"
          if [ -z "$tabele" ]; then
            echo "front=0" >> "$GITHUB_OUTPUT"
            echo "tabele=0" >> "$GITHUB_OUTPUT"
          else
            # Sciezki tabel nie zawieraja bialych znakow (wzorzec tests/mutanty_reczne/*.toml).
            python3 tools/mutanty_reczne.py --czy-front $tabele >> "$GITHUB_OUTPUT"
            # Dopiero po udanym wykryciu: pod `bash -e` blad skryptu konczy krok, zanim tabele=1 trafi do wyjscia.
            echo "tabele=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.front.outputs.front == '1'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json'''
zamien = '''- uses: actions/setup-node@v7
        if: steps.front.outputs.front == '1'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: front dla mutantów ręcznych
        id: front
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          tabele="$(git diff --name-only --no-renames --diff-filter=d "origin/$BASE_REF...HEAD" -- 'tests/mutanty_reczne/*.toml')"
          if [ -z "$tabele" ]; then
            echo "front=0" >> "$GITHUB_OUTPUT"
            echo "tabele=0" >> "$GITHUB_OUTPUT"
          else
            # Sciezki tabel nie zawieraja bialych znakow (wzorzec tests/mutanty_reczne/*.toml).
            python3 tools/mutanty_reczne.py --czy-front $tabele >> "$GITHUB_OUTPUT"
            # Dopiero po udanym wykryciu: pod `bash -e` blad skryptu konczy krok, zanim tabele=1 trafi do wyjscia.
            echo "tabele=1" >> "$GITHUB_OUTPUT"
          fi'''
test = "tests/test_workflow_mutacje.py::test_krok_wykrycia_frontu_stoi_przed_krokami_ktore_czytaja_jego_wynik"

