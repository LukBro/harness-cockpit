szukaj = "docker run -d --name postgres-mutanty"
zamien = "docker run --name postgres-mutanty"
test = "tests/test_workflow_mutacje.py::test_kontener_postgres_startuje_w_tle_bo_krok_czeka_na_jego_zdrowie"

# Kontener ma healthcheck: bez niego docker inspect nie zwroci statusu zdrowia.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '--health-cmd "pg_isready -U cockpit -d cockpit_test" '
zamien = '--no-healthcheck '
test = "tests/test_workflow_mutacje.py::test_kontener_postgres_ma_healthcheck_gdy_krok_czeka_na_status_zdrowia_z_docker_inspect"

# Petla ma wiele prob (nie jedna).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "seq 1 60"
zamien = "seq 1 1"
test = "tests/test_workflow_mutacje.py::test_krok_czeka_az_baza_bedzie_zdrowa_a_nie_sprawdza_jej_tylko_raz"

# Warunek wyjscia z petli to status healthy, nie dowolny status.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '[ "$status" = "healthy" ]'
zamien = '[ -n "$status" ]'
test = "tests/test_workflow_mutacje.py::test_krok_czeka_az_baza_bedzie_zdrowa_a_nie_sprawdza_jej_tylko_raz"

# Status healthy jest rozpoznawany (nie unhealthy).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '[ "$status" = "healthy" ]'
zamien = '[ "$status" = "unhealthy" ]'
test = "tests/test_workflow_mutacje.py::test_zdrowa_baza_konczy_krok_kodem_0_i_zapisuje_adres_bazy_testowej_do_wyjscia_kroku"

# Po osiagnieciu zdrowia petla sie konczy (break).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''zdrowa=1
              break'''
zamien = '''zdrowa=1'''
test = "tests/test_workflow_mutacje.py::test_krok_czeka_az_baza_bedzie_zdrowa_a_nie_sprawdza_jej_tylko_raz"

# Baza zaczyna jako niezdrowa: brak zdrowia po probach to blad.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "zdrowa=0"
zamien = "zdrowa=1"
test = "tests/test_workflow_mutacje.py::test_baza_ktora_nigdy_nie_staje_sie_zdrowa_oblewa_krok_z_komunikatem_bledu_i_bez_adresu"

# Blad tylko gdy baza NIE jest zdrowa.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '[ "$zdrowa" != "1" ]'
zamien = '[ "$zdrowa" = "1" ]'
test = "tests/test_workflow_mutacje.py::test_zdrowa_baza_konczy_krok_kodem_0_i_zapisuje_adres_bazy_testowej_do_wyjscia_kroku"

# Brak zdrowia to ::error::, nie ostrzezenie.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'echo "::error::PostgreSQL'
zamien = 'echo "::warning::PostgreSQL'
test = "tests/test_workflow_mutacje.py::test_baza_ktora_nigdy_nie_staje_sie_zdrowa_oblewa_krok_z_komunikatem_bledu_i_bez_adresu"

# Brak zdrowia konczy krok kodem 1 (exit 1).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''nic nie zmierzono"
            exit 1'''
zamien = '''nic nie zmierzono"
            true'''
test = "tests/test_workflow_mutacje.py::test_baza_ktora_nigdy_nie_staje_sie_zdrowa_oblewa_krok_z_komunikatem_bledu_i_bez_adresu"

# Adres bazy trafia do wyjscia kroku (GITHUB_OUTPUT), skad czyta go krok recznych mutantow.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''          echo "adres=postgresql+asyncpg://cockpit:cockpit@localhost:5432/cockpit_test" >> "$GITHUB_OUTPUT"'''
zamien = '''          echo "adres=postgresql+asyncpg://cockpit:cockpit@localhost:5432/cockpit_test" >> /dev/null'''
test = "tests/test_workflow_mutacje.py::test_zdrowa_baza_konczy_krok_kodem_0_i_zapisuje_adres_bazy_testowej_do_wyjscia_kroku"

# Adres bazy nie trafia do srodowiska calego joba (GITHUB_ENV): zobaczylby go mutmut.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''          echo "adres=postgresql+asyncpg://cockpit:cockpit@localhost:5432/cockpit_test" >> "$GITHUB_OUTPUT"'''
zamien = '''          echo "adres=postgresql+asyncpg://cockpit:cockpit@localhost:5432/cockpit_test" >> "$GITHUB_ENV"'''
test = "tests/test_workflow_mutacje.py::test_zdrowa_baza_konczy_krok_kodem_0_i_zapisuje_adres_bazy_testowej_do_wyjscia_kroku"

# Nazwa wyjscia kroku to adres (czyta je wyrazenie w kroku recznych mutantow).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''echo "adres=postgresql'''
zamien = '''echo "adresy=postgresql'''
test = "tests/test_workflow_mutacje.py::test_zdrowa_baza_konczy_krok_kodem_0_i_zapisuje_adres_bazy_testowej_do_wyjscia_kroku"

# Krok PostgreSQL ma id postgres: z niego czyta krok recznych mutantow.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''id: postgres'''
zamien = '''id: postgresx'''
test = "tests/test_workflow_mutacje.py::test_krok_postgres_ma_id_postgres_z_ktorego_krok_recznych_mutantow_czyta_adres_bazy"

# Krok recznych mutantow czyta wyjscie adres kroku postgres, nie inne.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''steps.postgres.outputs.adres }}'''
zamien = '''steps.postgres.outputs.adresy }}'''
test = "tests/test_workflow_mutacje.py::test_krok_mutanty_reczne_dostaje_adres_bazy_z_wyjscia_kroku_postgres_obok_galezi_docelowej"

# Zmienna adresu w kroku recznych mutantow to COCKPIT_TEST_DATABASE_URL.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''          COCKPIT_TEST_DATABASE_URL: ${{ steps.postgres.outputs.adres }}'''
zamien = '''          COCKPIT_DATABASE_URL: ${{ steps.postgres.outputs.adres }}'''
test = "tests/test_workflow_mutacje.py::test_krok_mutanty_reczne_dostaje_adres_bazy_z_wyjscia_kroku_postgres_obok_galezi_docelowej"

# Krok mutmuta nie dostaje adresu bazy (testy z baza pod mutmutem na wspolnej bazie).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''      - name: mutanty zmienionych funkcji
        env:
          BASE_REF: ${{ github.base_ref }}'''
zamien = '''      - name: mutanty zmienionych funkcji
        env:
          BASE_REF: ${{ github.base_ref }}
          COCKPIT_TEST_DATABASE_URL: ${{ steps.postgres.outputs.adres }}'''
test = "tests/test_workflow_mutacje.py::test_adres_bazy_testowej_widzi_tylko_krok_mutanty_reczne_a_mutmut_go_nie_dostaje"

# Zaden inny krok joba nie pisze do GITHUB_ENV (zmienna trafilaby do mutmuta).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '''echo "front=0" >> "$GITHUB_OUTPUT"'''
zamien = '''echo "front=0" >> "$GITHUB_OUTPUT"; echo "X=1" >> "$GITHUB_ENV"'''
test = "tests/test_workflow_mutacje.py::test_zaden_krok_zadania_mutation_nie_pisze_do_srodowiska_calego_joba"

# Port w adresie bazy zgodny z kontenerem.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "localhost:5432/cockpit_test"
zamien = "localhost:5433/cockpit_test"
test = "tests/test_workflow_mutacje.py::test_zdrowa_baza_konczy_krok_kodem_0_i_zapisuje_adres_bazy_testowej_do_wyjscia_kroku"

# Sterownik w adresie bazy to asyncpg (SQLAlchemy async).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "postgresql+asyncpg://cockpit:cockpit@localhost"
zamien = "postgresql://cockpit:cockpit@localhost"
test = "tests/test_workflow_mutacje.py::test_zdrowa_baza_konczy_krok_kodem_0_i_zapisuje_adres_bazy_testowej_do_wyjscia_kroku"

# Kontener ma nazwe, o ktora pytamy przy sprawdzaniu zdrowia (nazwa z docker run).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "--name postgres-mutanty"
zamien = "--name postgres-inny"
test = "tests/test_workflow_mutacje.py::test_krok_pyta_o_zdrowie_tego_samego_kontenera_ktory_uruchomil"

# Zdrowie sprawdzamy u kontenera uruchomionego przez ten krok (nazwa w docker inspect).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "Status}}' postgres-mutanty"
zamien = "Status}}' postgres-inny"
test = "tests/test_workflow_mutacje.py::test_krok_pyta_o_zdrowie_tego_samego_kontenera_ktory_uruchomil"

# Miedzy probami jest przerwa dodatniej dlugosci (sleep 2, nie 0).
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = "sleep 2"
zamien = "sleep 0"
test = "tests/test_workflow_mutacje.py::test_krok_robi_przerwe_dodatniej_dlugosci_miedzy_sprawdzeniami_zdrowia_bazy"

# Nazwa opcji to --czy-front (argparse przyjmuje przedrostki, wiec skracamy nazwe).
[[mutant]]
plik = "tools/mutanty_reczne.py"
szukaj = '"--czy-front",'
zamien = '"--czy-fron",'
test = "tests/test_mutanty_reczne.py::test_czy_front_wypisuje_dokladnie_jedna_linie_front_1_albo_front_0_i_konczy_sie_kodem_0"

# Healthcheck kontenera bazy ma te same wartosci co usluga postgres joba e2e w ci.yml.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '--health-interval 5s'
zamien = '--health-interval 6s'
test = "tests/test_workflow_mutacje.py::test_kontener_bazy_mutantow_recznych_ma_te_same_ustawienia_zdrowia_co_baza_testow_e2e_w_ci"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '--health-timeout 5s'
zamien = '--health-timeout 6s'
test = "tests/test_workflow_mutacje.py::test_kontener_bazy_mutantow_recznych_ma_te_same_ustawienia_zdrowia_co_baza_testow_e2e_w_ci"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '--health-retries 10'
zamien = '--health-retries 11'
test = "tests/test_workflow_mutacje.py::test_kontener_bazy_mutantow_recznych_ma_te_same_ustawienia_zdrowia_co_baza_testow_e2e_w_ci"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '--health-cmd "pg_isready -U cockpit -d cockpit_test"'
zamien = '--health-cmd "pg_isready -U postgres -d cockpit_test"'
test = "tests/test_workflow_mutacje.py::test_kontener_bazy_mutantow_recznych_ma_te_same_ustawienia_zdrowia_co_baza_testow_e2e_w_ci"

# Wersja akcji setup-node i wersja node jak w jobie e2e.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'actions/setup-node@v7'
zamien = 'actions/setup-node@v6'
test = "tests/test_workflow_mutacje.py::test_instalacja_node_w_mutantach_recznych_ma_ta_sama_akcje_i_wersje_node_co_job_e2e_w_ci"

[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = 'node-version: "22"'
zamien = 'node-version: "20"'
test = "tests/test_workflow_mutacje.py::test_instalacja_node_w_mutantach_recznych_ma_ta_sama_akcje_i_wersje_node_co_job_e2e_w_ci"

# Kod wyjscia docker inspect decyduje: `;` zamiast `&&` uznaje blad z napisem healthy za zdrowa baze.
[[mutant]]
plik = ".github/workflows/mutation.yml"
szukaj = '&& [ "$status" = "healthy" ]'
zamien = '; [ "$status" = "healthy" ]'
test = "tests/test_workflow_mutacje.py::test_docker_inspect_zakonczony_bledem_nie_daje_zdrowej_bazy_nawet_gdy_wypisal_healthy"
