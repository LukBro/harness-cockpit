# Tabela recznych mutantow HAR-258: tools/mutanty_uzupelniajace.py i tools/mutanty_zmian.py (miejsce, ktorego
# mutmut nie mutuje: tools/). Wiersz: element | mutacja | test, ktory po mutacji oblewa.
#
# Wiersze pokrywaja: numeracje linii jak w AST w `mutanty_zmian.py` (`linie_zrodla`, `_nowe_pliki`), flage
# TEMPLATE (`re.T`) w `re.compile`, flagi globalne wzorca rozdzielone komentarzem `(?#...)` i bialym znakiem,
# strazniki postepu w petlach rozbioru wzorca, funkcje `re` poza `compile` (`re.sub`, `re.match`...), samotny `\r`
# w `zrodlo_z_dysku`, mutanty z sond krytyka (`find("}")`, `A-Z` w `PREFIKS_GRUPY`,
# `isinstance(funkcja.value, ast.Name)`) i dokladny tekst komunikatow bledow narzedzia.
#
# Rownowazne (zadne wejscie nie odroznia wersji; rownowaznosc uzasadnia wejscie, ktorego nie ma):
# - `_wymagaj_postepu(...)` w `_koniec_ucieczki` (petla osemkowa) i w `_koniec_flag_globalnych`: usuniecie samego
#   wywolania nie ma wiersza, bo zabija je tylko mutant zerujacy postep tej samej petli (wiersze `koniec += 0`
#   i `pozycja = pozycja`), a w poprawnym kodzie indeks tych petli zawsze idzie do przodu.
# - `if flagi & FLAGA_TEMPLATE:` -> `if flagi & FLAGA_TEMPLATE and not flagi & re.VERBOSE:`: sprawdzenie VERBOSE
#   stoi wyzej i rzuca, wiec do tego `if` nie dociera zaden zestaw flag z bitem VERBOSE.
# - `[ \t\n\r\v\f]` -> `\s` w `POMIJANE_MIEDZY_FLAGAMI`: znak, ktory `\s` pomija, a SRE nie (np. NBSP,
#   `\x1c`, `\x85`), przed flaga globalna rozbija wzorzec w `re.compile` ("global flags not at the start"), a
#   za ostatnia flaga nie przesuwa konca naglowka; wzorzec z takim znakiem miedzy flagami nie dociera do rozbioru.
# - `POMIJANE_MIEDZY_FLAGAMI` z `)*` zamienionym na `)?`: petla w `_koniec_flag_globalnych` powtarza dopasowanie,
#   wiec jedno pomijane wyrazenie na obrot daje ten sam koniec naglowka (dwa komentarze pod rzad: dwa obroty).
# - `find("}", poczatek)` -> `find("}", poczatek + k)` dla k od 1 do 3: na `poczatek` stoi `\`, na `poczatek + 1`
#   `N`, na `poczatek + 2` `{` (warunek `_koniec_ucieczki`), wiec `}` stoi najwczesniej na `poczatek + 3` (`\N{}`,
#   ktore przechodzi tylko w komentarzu `(?x)`). Dla k = 4, 5, 6 sa wiersze `[[mutant]]` (testy
#   `\N{}` i `\N{OX}`); mutant k = 4 i k = 5 psuje `\N{}` w komentarzu, k = 6 psuje `\N{OX}`.
# - `if zamkniecie < 0:` -> `<= 0`: zamkniecie 0 wymagaloby `}` na indeksie 0, a tam stoi `\`, od ktorego
#   zaczyna sie ucieczka (szukanie startuje od `poczatek`).
# - `A-Z` w `[a-zA-Z]` po `-` (drugi i trzeci wariant `PREFIKS_GRUPY`) oraz zakresy liter, ktore nie sa flagami
#   (`a-z` -> `a-y`, `A-Z` -> `A-K`...): flagi po `-` to male litery `i`, `m`, `s`, `x` (`(?-L:`, `(?-a:`,
#   `(?-u:` odrzuca `re.compile`), a litera spoza flag wzorzec odrzuca juz kompilacja oryginalu.
#


