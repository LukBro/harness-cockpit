[project]
name = "harness-cockpit"
version = "0.1.0"
description = "Wizualny kokpit do skladania i obserwowania workflow agentowych"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.20",
  "pydantic>=2.13",
  "pydantic-settings>=2.6",
  "asyncpg>=0.31",
  "sse-starlette>=3.5",
  "httpx>=0.28",
  "ruamel.yaml>=0.19",
  "python-frontmatter>=1.3",
  "argon2-cffi>=25.1",
]

[project.optional-dependencies]
# ruff: minor zmienia reguly/defaulty; czerwone CI ma znaczyc "twoja zmiana", nie "nowy ruff".
# pytest: 9.2 usunal Item._nodeid, ktorego uzywa harness mutmut 3.8.0; zdjac gorna granice, gdy mutmut to obsluzy.
dev = ["ruff>=0.17,<0.18", "pytest>=8,<9.2", "pytest-asyncio>=1.4", "aiosqlite>=0.20", "mutmut>=3.8", "pytest-playwright>=0.7"]

[project.scripts]
cockpit = "cockpit.__main__:main"
cockpit-runner = "runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit", "src/runner"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Jawny zestaw: od ruffa 0.15+ domyslny zestaw jest szerszy, a ticket ustala E4/E7/E9/F.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# sys.path do src/ i COCKPIT_DATABASE_URL musza byc ustawione przed importem
# cockpit/runner (settings czyta env przy imporcie), wiec importy sa po kodzie.
"tools/demo_szkielet.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
# Domyslnie bez e2e: zwykly przebieg ma byc zielony bez PostgreSQL i przegladarki.
# Wybranie e2e nadpisuje to (ostatnie -m wygrywa).
addopts = "-m 'not e2e'"
markers = [
  "e2e: wymaga PostgreSQL i przegladarki (Playwright)",
  "baza: test wymaga PostgreSQL; pominiety przy COCKPIT_WYMAGAJ_BAZY=1 oblewa przebieg",
]

# Testy mutacyjne: moduly rdzenia (strona wiki toolchain, sekcja Mutacje).
[tool.mutmut]
source_paths = [
  "src/cockpit/services/",
  "src/cockpit/kernel/",
  "src/runner/",
  "src/cockpit/api/",
]
# mutmut kopiuje do mutants/ tylko source_paths. Reszta pakietu musi trafic
# tam osobno, inaczej testy nie zaimportuja aplikacji i kazdy mutant "przezywa".
# tools/ potrzebuje test granicy warstw. Jawna lista zamiast calego src/:
# kopia src/ nadpisywalaby zmutowane pliki i kasowala przyrostowy cache mutmut.
# alembic/ i alembic.ini: demo szkieletu (tools/demo_szkielet.py) buduje schemat
# migracjami; bez nich test pada na niezmutowanym kodzie i mutmut przerywa przebieg.
# .github/workflows/: test kroku mutacji uruchamia skrypt z workflow mutation.yml.
# deploy/: test kernela czyta rejestracje hookow z deploy/hooks.example.json (HAR-22).
# mutmut kopiuje plik z also_copy bez tworzenia katalogow nadrzednych (FileNotFoundError),
# wiec wpis jest katalogiem; katalog kopiuje copytree, ktore je tworzy.
also_copy = [
  "src/cockpit/__init__.py",
  "src/cockpit/__main__.py",
  "src/cockpit/settings.py",
  "src/cockpit/db/",
  "src/cockpit/collector/",
  "src/cockpit/web/",
  "tools/",
  "cicd/",
  "alembic/",
  "alembic.ini",
  ".github/workflows/",
  ".claude/hooks/",
  "deploy/",
]
