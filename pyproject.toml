[project]
name = "harness-cockpit"
version = "0.1.0"
description = "Wizualny kokpit do skladania i obserwowania workflow agentowych"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.20",
  "pydantic>=2.13",
  "pydantic-settings>=2.6",
  "asyncpg>=0.31",
  "sse-starlette>=3.5",
  "httpx>=0.28",
  "ruamel.yaml>=0.19",
  "python-frontmatter>=1.3",
  "argon2-cffi>=25.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.4", "aiosqlite>=0.20", "mutmut>=3.8", "pytest-playwright>=0.7"]

[project.scripts]
cockpit = "cockpit.__main__:main"
cockpit-runner = "runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit", "src/runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
# Domyslnie bez e2e: zwykly przebieg ma byc zielony bez PostgreSQL i przegladarki.
# Wybranie e2e nadpisuje to (ostatnie -m wygrywa).
addopts = "-m 'not e2e'"
markers = [
  "e2e: wymaga PostgreSQL i przegladarki (Playwright)",
]

# Testy mutacyjne: moduly rdzenia (strona wiki toolchain, sekcja Mutacje).
[tool.mutmut]
source_paths = [
  "src/cockpit/services/",
  "src/cockpit/kernel/",
  "src/runner/",
  "src/cockpit/api/",
]
# mutmut kopiuje do mutants/ tylko source_paths. Reszta pakietu musi trafic
# tam osobno, inaczej testy nie zaimportuja aplikacji i kazdy mutant "przezywa".
# tools/ potrzebuje test granicy warstw. Jawna lista zamiast calego src/:
# kopia src/ nadpisywalaby zmutowane pliki i kasowala przyrostowy cache mutmut.
also_copy = [
  "src/cockpit/__init__.py",
  "src/cockpit/__main__.py",
  "src/cockpit/settings.py",
  "src/cockpit/db/",
  "src/cockpit/collector/",
  "src/cockpit/web/",
  "tools/",
]
