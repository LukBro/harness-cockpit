name: CI

# CI sprawdza przed wejsciem zmiany do main: testy pytest (w tym testy
# rejestru EGZEKWOWANE), granice warstw (tools/check_layers.py), zakres
# wpisow lekcji (tools/check_lessons.py), lint ruff,
# zgodnosc schematu OpenAPI, build frontu oraz testy z PostgreSQL i e2e.
# CI nie wymusza niezmiennikow w czasie dzialania; ktore sa egzekwowane
# na sciezce wykonania, mowi EGZEKWOWANE w services/walidacja.py.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ubuntu-latest to alias, ktory GitHub przepina na nowsze Ubuntu.
  # Przypiete swiadomie: to CI czyta agent, a czerwony przebieg musi
  # znaczyc "twoja zmiana", nie "podmieniony obraz runnera" - inaczej
  # agent zuzyje budzet petli debugowania na naprawianie cudzej awarii.
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 pilnuje dolnej granicy z requires-python, 3.13 biezacej.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Testy - niezmienniki, kernel, szkielet
        run: pytest -q -n 4

      - name: Granica warstw - api nie dotyka bazy
        run: python tools/check_layers.py

      - name: Lekcje - każdy wpis .ai/lessons.md ma zakres
        run: python tools/check_lessons.py

      - name: Lint - ruff (E4, E7, E9, F)
        run: ruff check .

      - name: Kontrakt API — schemat w repo zgodny z kodem
        run: python tools/eksport_openapi.py --sprawdz

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalacja z lockfile
        run: npm ci
        working-directory: web

      - name: Typecheck i build (tsc -b && vite build)
        run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          # Jednorazowy kontener testowy, nie sekret produkcyjny.
          POSTGRES_USER: cockpit
          POSTGRES_PASSWORD: cockpit
          POSTGRES_DB: cockpit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cockpit -d cockpit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COCKPIT_TEST_DATABASE_URL: postgresql+asyncpg://cockpit:cockpit@localhost:5432/cockpit_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: pip install -e ".[dev]"

      - name: Budowa frontu do src/cockpit/static
        run: npm ci && npm run build
        working-directory: web

      - name: Przegladarka Chromium
        run: playwright install --with-deps chromium

      - name: Testy wymagajace PostgreSQL - migracje, numeracja zdarzen, przelot demo
        run: pytest -v -rs -m "baza and not e2e"
        env:
          COCKPIT_WYMAGAJ_BAZY: "1"

      - name: Test e2e - przelot w przegladarce na PostgreSQL
        run: pytest -m e2e
        env:
          COCKPIT_WYMAGAJ_BAZY: "1"

      - name: Przelot na wylot - runner -> cockpit -> SSE na PostgreSQL z alembic
        run: python tools/demo_szkielet.py
        env:
          COCKPIT_DATABASE_URL: postgresql+asyncpg://cockpit:cockpit@localhost:5432/cockpit_test
