name: mutation

# Uklad (HAR-149):
# - `mutation` (wymagany check na pull_request): mutuje TYLKO funkcje zmienione w PR
#   (tools/mutanty_zmian.py, baza = galaz docelowa PR). Przezywajacy mutant, blad
#   narzedzia i brak mutmuta to czerwony krok: brak dowodu to nie zielone.
#   Pelnego przebiegu ani zapadki tu nie ma, wiec check trwa minuty.
# - `mutation-main` (push na main, niewymagany): pelny przebieg mutmuta, raport i zapadka
#   zapadka. Spadek score nie oblewa joba; przebieg, ktory niczego nie zmierzyl
#   (testy nie wystartowaly, zero zabitych), oblewa go.
# - `mutation-main-shard` (push na main): pelny przebieg w rownoleglych shardach po plikach zrodel
#   (tools/shardy_mutantow.py). Jeden job przekroczyl 240 min przy 14799/15011 mutantow
#   (run 45061686542); shard mutuje swoje pliki ze statystykami z `mutation-statystyki`, a
#   `mutation-main` skleja wyniki shardow w raport i liczy zapadke. Czerwony shard pomija
#   `mutation-main`, wiec przebieg nie jest zielony i nie staje sie odniesieniem zapadki.
# - Odniesieniem zapadki (HAR-233) jest summary ostatniego zielonego przebiegu mutation-main
#   (artefakt `mutation-report`), nie plik w repozytorium. Brak tego artefaktu to czerwony
#   krok, nie cicha zapadka na starym wyniku; CI niczego nie commituje ani nie pushuje.
#   Plik cicd/mutation-baseline.json zostaje w repo jako historia i niczego nie decyduje.
#
# HAR-255: statystyki mutmuta (uruchomienie calego zestawu testow) licza rownolegle shardy
# (macierz, bez cache, kazdy od zera) i wgrywaja dowod shard-<n>.json. Job `mutation` czeka na
# nie, pierwszym krokiem oblewa sie przy kazdym wyniku shardow innym niz success (brak dowodu to
# nie zielone), pobiera dowody i scala je w mutants/mutmut-stats.json PO przywroceniu cache,
# a mutanty zmienionych funkcji biegna z dowodami zamiast "clean tests" mutmuta.
#
# Cache mutmuta: jedyny stan mutmuta lezy w katalogu mutants/ (kopie zrodel, pliki .meta
# z wynikami i hashami funkcji, mutmut-stats.json). Zapisywal go mutation-main; shardy go nie
# zapisuja, bo `mutmut run <wzorce>` sprawdza nazwane mutanty od nowa (mutmut 3.8.0
# __main__.py: `if not mutant_names and result is not None: continue`), wiec cache nic im nie
# daje. PR czyta (actions/cache/restore), zwykle bez trafienia. Klucz:
# mutmut-v1-<hash tests/** i pyproject.toml>-<hash src/**>.
# Dowod w kodzie mutmut 3.8.0 (mutmut/__main__.py):
# - zrodlo nowsze od kopii w mutants/ (swiezy checkout ma mtime "teraz", tar z cache
#   zachowuje stary mtime) jest generowane od nowa (linie 159-165); przy regeneracji wynik
#   zostaje tylko dla funkcji o niezmienionym hashu AST, dla zmienionej jest kasowany do
#   None (linie 198-214). Poza hashem zrodla mutmut unieważnia wyniki takze po odcisku
#   konfiguracji pytest (_apply_config_change_invalidation, linie 624-655); w kluczu
#   pokrywa to hash pyproject.toml,
# - zmiana samych testow nie kasuje zapisanych werdyktow: nowe testy odswiezaja tylko
#   statystyki (linie 694-698), a survived/killed zostaja ze starego stanu,
# - kopia testow w mutants/tests tylko przybywa: mutmut dokleja tests/ do also_copy
#   (mutmut/configuration.py:186) i kopiuje przez shutil.copytree(dirs_exist_ok=True)
#   (mutmut/utils/file_utils.py:77), wiec nie usuwa plikow. Test usuniety w zmianie
#   zostalby w przywroconym cache i dalej zabijalby mutanty - falszywa zielen.
# Zaden job nie przywraca wiec cache z innymi testami ani konfiguracja: oba maja jeden
# restore-key z hashem tests/** i pyproject.toml. Po zmianie testow albo konfiguracji
# mutmut buduje mutants/ od zera (job PR mutuje i tak tylko zmienione funkcje, ale
# zbiera statystyki calego zestawu - dluzej, bez falszywej zieleni), a pelny przebieg
# i zapadka mierza aktualny stan. Zmiana samego src/** przy tych samych testach jest
# obsluzona przyrostowo przez hashe AST.

on:
  pull_request:
  push:
    branches: [main]

# Nowy push do PR anuluje poprzedni przebieg tego PR (audyt 2026-11-19: ~1/3 minut mutation szla na nieaktualne
# SHA). Push na main dostaje wlasna grupe (run_id), wiec niczego nie anuluje ani nie kolejkuje.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Na PR dla `mutation`, na push dla `mutation-main-shard`: te same statystyki calego zestawu.
  mutation-statystyki:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"
      - name: statystyki mutmuta shardu
        env:
          SHARD: ${{ matrix.shard }}
          LICZBA_SHARDOW: ${{ strategy.job-total }}
        run: |
          python3 tools/statystyki_mutmuta.py shard --indeks "$SHARD" --liczba "$LICZBA_SHARDOW" --katalog-dowodow dowody

      - uses: actions/upload-artifact@v4
        with:
          name: dowody-${{ matrix.shard }}
          path: dowody

  # fix-mutanty-zmian-shardy: mutanty zmienionych funkcji w 8 shardach. Shard bierze co 8. mutant (po
  # posortowanych nazwach), wiec kazdy dostaje te sama czesc kazdej funkcji; przy podziale po plikach jeden
  # shard pelnego przebiegu trwal 105 min przy pozostalych 14-32. W HAR-181 ten krok w jednym jobie: 37 min;
  # proba na tym stanie (1194 mutanty, 4 shardy po 2 procesy): 1027-1118 s na shard, wynik identyczny z CI.
  mutation-zmiany:
    if: github.event_name == 'pull_request'
    needs:
      - mutation-statystyki
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Liczba shardow = LICZBA_SHARDOW_ZMIAN w kroku `mutanty zmienionych funkcji` (test pilnuje zgodnosci).
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          pattern: 'dowody-*'
          merge-multiple: true
          path: dowody

      - name: mutanty zmienionych funkcji shardu
        env:
          BASE_REF: ${{ github.base_ref }}
          SHARD_ZMIAN: ${{ matrix.shard }}
          LICZBA_SHARDOW_ZMIAN: ${{ strategy.job-total }}
        run: |
          command -v mutmut >/dev/null || { echo "::error::narzedzie mutacyjne (mutmut) nie jest zainstalowane na runnerze - shard nic nie zmierzyl."; exit 1; }
          git fetch origin "$BASE_REF"
          python3 tools/statystyki_mutmuta.py scal --katalog-dowodow=dowody
          python3 tools/mutanty_zmian.py --baza "origin/$BASE_REF" --katalog-dowodow dowody --indeks-shardu "$SHARD_ZMIAN" --liczba-shardow "$LICZBA_SHARDOW_ZMIAN" --wynik-shardu "zmiany/shard-$SHARD_ZMIAN.json"

      - uses: actions/upload-artifact@v4
        with:
          name: zmiany-${{ matrix.shard }}
          path: zmiany

  mutation:
    if: github.event_name == 'pull_request' && always()
    needs: [mutation-statystyki, mutation-zmiany]
    runs-on: ubuntu-24.04
    # bez limitu job wisial do domyslnych 360 min (HAR-106); sufit jak mutation-main
    timeout-minutes: 240
    steps:
      - name: wynik shardów statystyk mutmuta
        env:
          WYNIKI_SHARDOW: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ -z "${WYNIKI_SHARDOW//[[:space:]]/}" ]; then
            echo "::error::brak dowodu: brak wyniku shardow statystyk mutmuta"
            exit 1
          fi
          for wynik in $WYNIKI_SHARDOW; do
            if [ "$wynik" != "success" ]; then
              echo "::error::brak dowodu: shardy statystyk mutmuta nie zakonczyly sie sukcesem (wyniki: $WYNIKI_SHARDOW)"
              exit 1
            fi
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hosted runners have no mutmut; it comes with the project's dev extras,
      # which the tests run by mutmut need anyway. 3.13 has prebuilt libcst wheels.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      # Tylko odczyt: cache zapisywal mutation-main (przed shardami). Restore po checkoucie, wiec zrodla maja
      # nowszy mtime niz kopie w mutants/ (mutmut generuje je od nowa, hashe decyduja o wynikach).
      # Bez golego prefiksu `mutmut-v1-`: kopia testow w mutants/ tylko przybywa, wiec cache
      # z innymi testami zachowalby test usuniety w PR i falszywie zabijal mutanty. Przy
      # zmianie testow cache nie wraca i mutants/ powstaje od zera.
      - uses: actions/cache/restore@v4
        with:
          path: mutants
          key: mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-

      # HAR-255: dowody shardow (po przywroceniu cache) i ich scalenie. Scalone statystyki musza
      # nadpisac plik statystyk z cache, wiec scalenie stoi PO przywroceniu cache i po pobraniu
      # dowodow, a przed mutantami zmienionych funkcji. Brak pliku shardu, inny commit albo
      # inne zrodla w dowodzie to kod 2 narzedzia i czerwony krok (bez warunku, bez wyjatku od porazki).
      - uses: actions/download-artifact@v4
        with:
          pattern: dowody-*
          path: dowody
          merge-multiple: true

      - name: scalenie statystyk shardów
        run: |
          python3 tools/statystyki_mutmuta.py scal --katalog-dowodow dowody

      - uses: actions/download-artifact@v4
        with:
          pattern: zmiany-*
          merge-multiple: true
          path: zmiany

      - name: mutanty zmienionych funkcji
        env:
          BASE_REF: ${{ github.base_ref }}
          LICZBA_SHARDOW_ZMIAN: "8"
        run: |
          # Brak mutmuta to brak pomiaru, wiec czerwony krok, nie pominiecie.
          command -v mutmut >/dev/null || { echo "::error::narzedzie mutacyjne (mutmut) nie jest zainstalowane na runnerze - nic nie zmierzono, check nie moze przejsc"; exit 1; }
          git fetch origin "$BASE_REF"
          mkdir -p mutants
          # 2026-11-24 wlasciciel: mutanty to raport, nie bramka (0 prawdziwych bledow w 12.11-24.11).
          # Kod wyjscia narzedzia: 0 = czysto, 1 = przezywajace mutanty (ostrzezenie, zielony krok),
          # 3 = zmiany poza zasiegiem mutmuta (ostrzezenie), inny = blad narzedzia (czerwony krok:
          # zepsute narzedzie to brak raportu, nie czysto).
          # Przechwytujemy go do zmiennej, zeby trafil do `case` ponizej, a nie zostal polkniety.
          kod=0
          # Statusy mutantow z shardow `mutation-zmiany`; brak dowodu ktoregokolwiek shardu to kod 2.
          python3 tools/mutanty_zmian.py --baza "origin/$BASE_REF" --z-shardow zmiany --liczba-shardow "$LICZBA_SHARDOW_ZMIAN" > mutants/mutanty-zmian.txt 2> mutants/mutanty-zmian.err || kod=$?
          {
            echo "## Mutanty zmienionych funkcji"
            echo
            case "$kod" in
              0)
                echo "czysto - brak przezywajacych mutantow albo brak zmienionych funkcji"
                ;;
              1)
                echo "Przezywajace mutanty zmienionych funkcji (raport, nie blokuje merge):"
                echo
                echo '```'
                cat mutants/mutanty-zmian.txt
                echo '```'
                ;;
              3)
                echo "### bez mutantów — sprawdź ręcznie"
                echo
                echo "Zmiany poza zasięgiem mutmuta (raport, nie blokuje merge):"
                echo
                echo '```'
                cat mutants/mutanty-zmian.txt
                echo '```'
                ;;
              *)
                echo "blad narzedzia (kod $kod)"
                echo
                echo '```'
                cat mutants/mutanty-zmian.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          case "$kod" in
            0)
              ;;
            1)
              echo "::warning::przezywajace mutanty zmienionych funkcji - lista w podsumowaniu zadania i w artefakcie mutation-report"
              ;;
            3)
              echo "::warning::zmiany poza zasiegiem mutmuta - lista w podsumowaniu zadania"
              ;;
            *)
              echo "::error::mutanty_zmian.py zakonczyl sie bledem (kod $kod): $(tr '\n' ' ' < mutants/mutanty-zmian.err)"
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutants/mutanty-zmian.txt
            mutants/mutanty-zmian.err

  mutation-main-shard:
    if: github.event_name == 'push'
    needs: mutation-statystyki
    runs-on: ubuntu-24.04
    # Pelny przebieg na jednym jobie: 240 min na 98,6% mutantow; shard ma ok. 1/8 linii zrodel.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Liczba shardow = LICZBA_SHARDOW_MAIN w `mutation-main` (test pilnuje zgodnosci).
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          pattern: "dowody-*"
          merge-multiple: true
          path: dowody

      - name: mutanty shardu pelnego przebiegu
        env:
          SHARD_PELNY: ${{ matrix.shard }}
          LICZBA_SHARDOW_PELNYCH: ${{ strategy.job-total }}
        run: |
          command -v mutmut >/dev/null || { echo "::error::narzedzie mutacyjne (mutmut) nie jest zainstalowane na runnerze - nic nie zmierzono."; exit 1; }
          python3 tools/statystyki_mutmuta.py scal --katalog-dowodow dowody
          python3 tools/shardy_mutantow.py wzorce --indeks "$SHARD_PELNY" --liczba "$LICZBA_SHARDOW_PELNYCH" > wzorce.txt
          # Tablica, nie $(cat): gwiazdki we wzorcach nie moga rozwinac sie w nazwy plikow.
          wzorce=()
          while IFS= read -r wzorzec; do wzorce+=("$wzorzec"); done < wzorce.txt
          if ! python3 tools/statystyki_mutmuta.py mutmut-run --katalog-dowodow dowody "${wzorce[@]}"; then
            echo "::error::mutmut run shardu $SHARD_PELNY zakonczyl sie bledem - sprawdz log mutmut run."
            exit 1
          fi
          mutmut results --all true > wyniki-mutmuta.txt
          mkdir -p wyniki
          python3 tools/shardy_mutantow.py wyniki --indeks "$SHARD_PELNY" --liczba "$LICZBA_SHARDOW_PELNYCH" --raport wyniki-mutmuta.txt > "wyniki/shard-$SHARD_PELNY.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: wyniki-mutacji-${{ matrix.shard }}
          path: wyniki

  mutation-main:
    if: github.event_name == 'push'
    needs: [mutation-main-shard]
    runs-on: ubuntu-24.04
    # Sklejenie wynikow shardow i zapadka: minuty, bez mutmuta.
    timeout-minutes: 30
    # Tylko odczyt kodu i przebiegow: `gh run list/download` potrzebuje actions: read.
    permissions:
      contents: read
      actions: read
    # Dwa przebiegi naraz moglyby wziac za odniesienie wynik, ktory jeszcze sie liczy;
    # nie przerywamy trwajacego, bo jego wynik jest odniesieniem dla nastepnego przebiegu.
    concurrency:
      group: mutation-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          pattern: wyniki-mutacji-*
          merge-multiple: true
          path: wyniki

      # HAR-233: odniesienie zapadki to artefakt ostatniego zielonego przebiegu. Biezacy run
      # wylaczamy po identyfikatorze (pelna linia, `grep -x`): nie jest jeszcze zielony, ale
      # lista udanych przebiegow bywa odpytana, gdy inny run konczy sie rownolegle. Kazdy brak
      # (lista, przebieg, artefakt, plik) to czerwony krok: brak dowodu to nie zielone.
      - name: poprzedni zielony wynik mutation-main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh run list --repo "$REPO" --workflow mutation.yml --branch main --event push --status success --limit 20 --json databaseId --jq '.[].databaseId' > poprzednie-runy.txt; then
            echo "::error::nie udalo sie pobrac listy przebiegow mutation-main (gh run list) - zapadka bez dowodu"
            exit 1
          fi
          # Kod 1 z grep znaczy "brak linii po filtrze" (bez poprzedniego przebiegu), nie blad;
          # kod 2 to blad grepa i musi oblac krok.
          kod=0
          kandydaci="$(grep -vx "$RUN_ID" poprzednie-runy.txt)" || kod=$?
          if [ "$kod" != "0" ] && [ "$kod" != "1" ]; then
            echo "::error::grep zakonczyl sie kodem $kod przy wyborze poprzedniego przebiegu mutation-main - zapadka bez dowodu"
            exit 1
          fi
          poprzedni="$(printf '%s\n' "$kandydaci" | head -n 1)"
          if [ -z "$poprzedni" ]; then
            echo "::error::brak poprzedniego zielonego przebiegu mutation-main na main - zapadka nie ma z czym porownac"
            exit 1
          fi
          if ! gh run download "$poprzedni" --repo "$REPO" --name mutation-report --dir poprzedni; then
            echo "::error::nie udalo sie pobrac artefaktu mutation-report z przebiegu $poprzedni (wygasl albo go brak) - zapadka bez dowodu"
            exit 1
          fi
          if [ ! -f poprzedni/mutation-summary.json ]; then
            echo "::error::artefakt mutation-report przebiegu $poprzedni nie zawiera mutation-summary.json - zapadka bez dowodu"
            exit 1
          fi
          echo "poprzedni zielony przebieg: $poprzedni"

      - name: pelny przebieg mutacyjny i zapadka
        env:
          # Liczba elementow macierzy `mutation-main-shard` (test pilnuje zgodnosci).
          LICZBA_SHARDOW_MAIN: "8"
        run: |
          # Wyniki wszystkich shardow, kazdy mutant raz; brak shardu albo powtorzenie to brak dowodu.
          mkdir -p mutants
          if ! python3 tools/shardy_mutantow.py scal --liczba "$LICZBA_SHARDOW_MAIN" --katalog wyniki > mutants/mutmut-results.txt; then
            echo "::error::wyniki shardow pelnego przebiegu sa niepelne albo sprzeczne - nic nie zmierzono."
            exit 1
          fi
          python3 cicd/mutation_report.py --report mutants/mutmut-results.txt --format mutmut > mutation-summary.json
          # Zero killed out of many mutants means the tests never ran (e.g. import error
          # inside mutants/), not a weak suite - such a run must not become the next reference.
          if python3 -c "import json,sys; d=json.load(open('mutation-summary.json')); sys.exit(0 if d['total'] and not d['killed'] else 1)"; then
            echo "::error::mutmut nie zabil zadnego mutanta - testy najpewniej nie wystartowaly w mutants/ (sprawdz log mutmut run)."
            exit 1
          fi
          # Zapadka zwraca 0 dla kazdego porownania (takze spadku, status=down); kod niezerowy to
          # wylacznie blad wejscia (zly JSON, zly poprzedni wynik). Ukrycie go dalo by zielony job
          # i cicho martwa zapadke.
          if ! python3 cicd/mutation_baseline.py --summary mutation-summary.json --previous-summary poprzedni/mutation-summary.json --scope full; then
            echo "::error::zapadka zakonczyla sie bledem wejscia (zly poprzedni wynik albo summary) - zapadka nie dziala"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutants/mutmut-results.txt
            mutation-summary.json
          retention-days: 90
