name: mutation

# Mutation testing on every PR. Mutation score is a trend, not a gate: a low or
# falling score never fails the build. A run that measured nothing (tests did not
# start, zero killed) does fail it - broken tooling is not a weak result.
# A missing mutmut on the runner only skips the step. The ratchet baseline lives in
# cicd/mutation-baseline.json and is committed by a human from the artifact.
# `mutmut run` mutates all core modules (mutmut 3 has no diff mode), hence
# --scope full: the same scope as the sprint-close run sharing this baseline.
# Surviving mutants of functions changed in the PR are listed in the job summary.

on:
  pull_request:

jobs:
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hosted runners have no mutmut; it comes with the project's dev extras,
      # which the tests run by mutmut need anyway. 3.13 has prebuilt libcst wheels.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: przebieg mutacyjny i zapadka
        run: |
          command -v mutmut || { echo "narzedzie mutacyjne nie zainstalowane na runnerze - krok mutacji pominiety (instalacja to setup wlasciciela projektu, patrz strona wiki toolchain)"; exit 0; }
          git fetch origin ${{ github.base_ref }}
          # mutmut exits non-zero when tests fail to start ("failed to collect stats");
          # a stale results cache must not hide that, so the exit code is the gate.
          if ! mutmut run; then
            echo "::error::mutmut run zakonczyl sie bledem - testy nie wystartowaly w mutants/ (blad zbierania statystyk), sprawdz log mutmut run. Baseline NIE zapisany."
            exit 1
          fi
          mutmut results --all true > mutants/mutmut-results.txt
          python3 cicd/mutation_report.py --report mutants/mutmut-results.txt --format mutmut > mutation-summary.json
          # Zero killed out of many mutants means the tests never ran (e.g. import error
          # inside mutants/), not a weak suite - such a run must not become the baseline.
          if python3 -c "import json,sys; d=json.load(open('mutation-summary.json')); sys.exit(0 if d['total'] and not d['killed'] else 1)"; then
            echo "::error::mutmut nie zabil zadnego mutanta - testy najpewniej nie wystartowaly w mutants/ (sprawdz log mutmut run). Baseline NIE zapisany."
            exit 1
          fi
          # Survivors among mutants of functions changed in this PR go to the job summary
          # and the artifact. Exit 1 = survivors listed (a trend, the step stays green);
          # exit 0 = clean; anything else = tool failure, which is missing evidence, not
          # success. Hence `|| kod=$?` instead of swallowing the exit code: it must reach the case below.
          kod=0
          python3 tools/mutanty_zmian.py --baza origin/${{ github.base_ref }} > mutants/mutanty-zmian.txt 2> mutants/mutanty-zmian.err || kod=$?
          {
            echo "## Mutanty zmienionych funkcji"
            echo
            case "$kod" in
              0)
                echo "czysto - brak przezywajacych mutantow albo brak zmienionych funkcji"
                ;;
              1)
                echo "Przezywajace mutanty zmienionych funkcji (trend, nie bramka - nie oblewaja builda):"
                echo
                echo '```'
                cat mutants/mutanty-zmian.txt
                echo '```'
                ;;
              *)
                echo "blad narzedzia (kod $kod)"
                echo
                echo '```'
                cat mutants/mutanty-zmian.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$kod" -gt 1 ]; then
            echo "::error::mutanty_zmian.py zakonczyl sie bledem (kod $kod): $(tr '\n' ' ' < mutants/mutanty-zmian.err) Baseline NIE zapisany."
            exit 1
          fi
          python3 cicd/mutation_baseline.py --summary mutation-summary.json --baseline cicd/mutation-baseline.json --scope full --commit ${{ github.sha }} || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutants/mutmut-results.txt
            mutants/mutanty-zmian.txt
            mutation-summary.json
            cicd/mutation-baseline.json
