name: mutation

# Uklad (HAR-149):
# - `mutation` (wymagany check na pull_request): mutuje TYLKO funkcje zmienione w PR
#   (tools/mutanty_zmian.py, baza = galaz docelowa PR). Przezywajacy mutant, blad
#   narzedzia i brak mutmuta to czerwony krok: brak dowodu to nie zielone.
#   Pelnego przebiegu ani zapadki tu nie ma, wiec check trwa minuty.
# - `mutation-main` (push na main, niewymagany): pelny przebieg mutmuta, raport i zapadka
#   zapadka. Spadek score nie oblewa joba; przebieg, ktory niczego nie zmierzyl
#   (testy nie wystartowaly, zero zabitych), oblewa go.
# - Odniesieniem zapadki (HAR-233) jest summary ostatniego zielonego przebiegu mutation-main
#   (artefakt `mutation-report`), nie plik w repozytorium. Brak tego artefaktu to czerwony
#   krok, nie cicha zapadka na starym wyniku; CI niczego nie commituje ani nie pushuje.
#   Plik cicd/mutation-baseline.json zostaje w repo jako historia i niczego nie decyduje.
#
# Cache mutmuta: jedyny stan mutmuta lezy w katalogu mutants/ (kopie zrodel, pliki .meta
# z wynikami i hashami funkcji, mutmut-stats.json). Zapisuje go tylko mutation-main;
# PR czyta (actions/cache/restore). Klucz w obu jobach:
# mutmut-v1-<hash tests/** i pyproject.toml>-<hash src/**>.
# Dowod w kodzie mutmut 3.8.0 (mutmut/__main__.py):
# - zrodlo nowsze od kopii w mutants/ (swiezy checkout ma mtime "teraz", tar z cache
#   zachowuje stary mtime) jest generowane od nowa (linie 159-165); przy regeneracji wynik
#   zostaje tylko dla funkcji o niezmienionym hashu AST, dla zmienionej jest kasowany do
#   None (linie 198-214). Poza hashem zrodla mutmut unieważnia wyniki takze po odcisku
#   konfiguracji pytest (_apply_config_change_invalidation, linie 624-655); w kluczu
#   pokrywa to hash pyproject.toml,
# - zmiana samych testow nie kasuje zapisanych werdyktow: nowe testy odswiezaja tylko
#   statystyki (linie 694-698), a survived/killed zostaja ze starego stanu,
# - kopia testow w mutants/tests tylko przybywa: mutmut dokleja tests/ do also_copy
#   (mutmut/configuration.py:186) i kopiuje przez shutil.copytree(dirs_exist_ok=True)
#   (mutmut/utils/file_utils.py:77), wiec nie usuwa plikow. Test usuniety w zmianie
#   zostalby w przywroconym cache i dalej zabijalby mutanty - falszywa zielen.
# Zaden job nie przywraca wiec cache z innymi testami ani konfiguracja: oba maja jeden
# restore-key z hashem tests/** i pyproject.toml. Po zmianie testow albo konfiguracji
# mutmut buduje mutants/ od zera (job PR mutuje i tak tylko zmienione funkcje, ale
# zbiera statystyki calego zestawu - dluzej, bez falszywej zieleni), a pelny przebieg
# i zapadka mierza aktualny stan. Zmiana samego src/** przy tych samych testach jest
# obsluzona przyrostowo przez hashe AST.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hosted runners have no mutmut; it comes with the project's dev extras,
      # which the tests run by mutmut need anyway. 3.13 has prebuilt libcst wheels.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      # HAR-225: KAZDA tabela tests/mutanty_reczne/*.toml jest sprawdzana na kazdym PR, nie tylko
      # tabele zmienione w PR (krok `mutanty reczne` wykonuje mutacje tylko dla zmienionych).
      # Inaczej zmiana kodu albo nazwy testu w jednym tickecie psuje tabele innych po cichu, a
      # czerwono robi sie dopiero w PR, ktory tej tabeli dotknie. Sprawdzenie nie naklada mutacji
      # i niczego nie uruchamia poza kolekcja testow, wiec trwa sekundy. Celowo bez `if`, bez
      # `git diff` i bez wyjsc kroku `front`. Kod 0 to jedyny zielony wynik: kazdy inny kod
      # (bledy wierszy, brak tabel, zero wierszy, blad kolekcji) oblewa krok.
      - name: sprawdzenie tabel mutantów ręcznych
        run: |
          mkdir -p mutants
          kod=0
          python3 tools/mutanty_reczne.py --sprawdz-wszystkie > mutants/tabele-reczne.txt 2> mutants/tabele-reczne.err || kod=$?
          {
            echo "## Tabele mutantów ręcznych"
            echo
            case "$kod" in
              0)
                cat mutants/tabele-reczne.txt
                ;;
              *)
                echo "Zepsute wiersze albo błąd narzędzia (kod $kod, krok jest czerwony):"
                echo
                echo '```'
                cat mutants/tabele-reczne.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$kod" != "0" ]; then
            echo "::error::sprawdzenie tabel mutantów ręcznych zakończyło się kodem $kod: $(tr '\n' ' ' < mutants/tabele-reczne.err)"
            exit 1
          fi

      # Tylko odczyt: cache zapisuje mutation-main. Restore po checkoucie, wiec zrodla maja
      # nowszy mtime niz kopie w mutants/ (mutmut generuje je od nowa, hashe decyduja o wynikach).
      # Bez golego prefiksu `mutmut-v1-`: kopia testow w mutants/ tylko przybywa, wiec cache
      # z innymi testami zachowalby test usuniety w PR i falszywie zabijal mutanty. Przy
      # zmianie testow cache nie wraca i mutants/ powstaje od zera.
      - uses: actions/cache/restore@v4
        with:
          path: mutants
          key: mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-

      # HAR-156: reczny mutant w web/ albo sprawdzany testem e2e potrzebuje zbudowanego frontu,
      # Chromium i prawdziwego Postgresa; wynik ma zalezec od kodu, nie od srodowiska. Krok
      # wykrycia pyta o to tabele zmienione w PR (to samo zapytanie co w kroku `mutanty reczne`),
      # a Node i przegladarka wykonuja sie tylko dla front=1. PR bez takich wierszy ich nie
      # instaluje. Baza zalezy od osobnego wyjscia tabele=1 (HAR-221): dostaje ja kazdy PR
      # ze zmieniona tabela, nie tylko z wierszami frontu. Blad wykrycia (zla tabela) oblewa krok.
      - name: front dla mutantów ręcznych
        id: front
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          tabele="$(git diff --name-only --no-renames --diff-filter=d "origin/$BASE_REF...HEAD" -- 'tests/mutanty_reczne/*.toml')"
          if [ -z "$tabele" ]; then
            echo "front=0" >> "$GITHUB_OUTPUT"
            echo "tabele=0" >> "$GITHUB_OUTPUT"
          else
            # Sciezki tabel nie zawieraja bialych znakow (wzorzec tests/mutanty_reczne/*.toml).
            python3 tools/mutanty_reczne.py --czy-front $tabele >> "$GITHUB_OUTPUT"
            # Dopiero po udanym wykryciu: pod `bash -e` blad skryptu konczy krok, zanim tabele=1 trafi do wyjscia.
            echo "tabele=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.front.outputs.front == '1'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: przeglądarka dla mutantów ręcznych
        if: steps.front.outputs.front == '1'
        run: |
          playwright install --with-deps chromium

      # Baza dla testow e2e i testow bazy (HAR-221): wiersz tabeli wskazujacy test bazy, np.
      # migracje, bez bazy jest pomijany i konczy sie kodem 2, wiec nie wolno jej wiazac z front=1.
      # Kontener z healthcheckiem, czekamy az bedzie zdrowy. Brak zdrowia
      # to czerwony krok, a adres bazy trafia do wyjscia kroku dopiero po sukcesie. Adres idzie
      # jako wyjscie kroku, nie do srodowiska calego joba: dostaje go tylko krok `mutanty reczne`.
      # Srodowisko joba trafiloby tez do mutmuta i testy `baza` biegly pod nim rownolegle na
      # wspolnej bazie, a wynik mutmuta zalezalby od tego, czy PR ma wiersze frontu.
      - name: PostgreSQL dla mutantów ręcznych
        id: postgres
        if: steps.front.outputs.tabele == '1'
        run: |
          docker run -d --name postgres-mutanty -e POSTGRES_USER=cockpit -e POSTGRES_PASSWORD=cockpit -e POSTGRES_DB=cockpit_test -p 5432:5432 --health-cmd "pg_isready -U cockpit -d cockpit_test" --health-interval 5s --health-timeout 5s --health-retries 10 postgres:16
          zdrowa=0
          for proba in $(seq 1 60); do
            if status="$(docker inspect -f '{{.State.Health.Status}}' postgres-mutanty)" && [ "$status" = "healthy" ]; then
              zdrowa=1
              break
            fi
            sleep 2
          done
          if [ "$zdrowa" != "1" ]; then
            echo "::error::PostgreSQL nie stal sie zdrowy w 120 s - testy e2e nie maja bazy, nic nie zmierzono"
            exit 1
          fi
          echo "adres=postgresql+asyncpg://cockpit:cockpit@localhost:5432/cockpit_test" >> "$GITHUB_OUTPUT"

      - name: mutanty zmienionych funkcji
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Brak mutmuta to brak pomiaru, wiec czerwony krok, nie pominiecie.
          command -v mutmut >/dev/null || { echo "::error::narzedzie mutacyjne (mutmut) nie jest zainstalowane na runnerze - nic nie zmierzono, check nie moze przejsc"; exit 1; }
          git fetch origin "$BASE_REF"
          mkdir -p mutants
          # Kod wyjscia narzedzia: 0 = czysto, 1 = przezywajace mutanty (czerwony krok),
          # 3 = zmiany poza zasiegiem mutmuta (HAR-144: zielony krok, lista do recznego
          # sprawdzenia w podsumowaniu), inny = blad narzedzia (czerwony krok).
          # Przechwytujemy go do zmiennej, zeby trafil do `case` ponizej, a nie zostal polkniety.
          kod=0
          python3 tools/mutanty_zmian.py --baza "origin/$BASE_REF" > mutants/mutanty-zmian.txt 2> mutants/mutanty-zmian.err || kod=$?
          # Krok `mutanty reczne` czyta ten kod: bez pliku nie wiadomo, czy mutmut pokryl zmiane.
          echo "$kod" > mutants/mutanty-zmian.kod
          {
            echo "## Mutanty zmienionych funkcji"
            echo
            case "$kod" in
              0)
                echo "czysto - brak przezywajacych mutantow albo brak zmienionych funkcji"
                ;;
              1)
                echo "Przezywajace mutanty zmienionych funkcji (bramka - krok jest czerwony):"
                echo
                echo '```'
                cat mutants/mutanty-zmian.txt
                echo '```'
                ;;
              3)
                echo "### bez mutantów — sprawdź ręcznie"
                echo
                echo "Zmiany poza zasięgiem mutmuta - wymagają ręcznego mutanta i testu (krok jest zielony):"
                echo
                echo '```'
                cat mutants/mutanty-zmian.txt
                echo '```'
                ;;
              *)
                echo "blad narzedzia (kod $kod)"
                echo
                echo '```'
                cat mutants/mutanty-zmian.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          case "$kod" in
            0)
              ;;
            1)
              echo "::error::przezywajace mutanty zmienionych funkcji - lista w podsumowaniu zadania i w artefakcie mutation-report"
              exit 1
              ;;
            3)
              echo "::warning::zmiany poza zasiegiem mutmuta - lista w podsumowaniu zadania; dopisz reczny mutant i test"
              ;;
            *)
              echo "::error::mutanty_zmian.py zakonczyl sie bledem (kod $kod): $(tr '\n' ' ' < mutants/mutanty-zmian.err)"
              exit 1
              ;;
          esac

      # HAR-150: zmiany, ktorych mutmut nie mutuje (web/, tools/, cicd/ albo kod 3 narzedzia
      # mutantow zmian), wymagaja tabeli tests/mutanty_reczne/<ticket>.toml zmienionej w PR.
      # Brak tabeli to brak dowodu, wiec czerwony krok. Tabela zmieniona w PR jest wykonywana
      # niezaleznie od zasiegu: jej czerwony wynik nie moze zostac zignorowany.
      # Adres bazy testowej (HAR-156) tylko tutaj; gdy krok bazy byl pominiety, wartosc jest pusta
      # i testy traktuja ja jak brak bazy.
      - name: mutanty ręczne
        env:
          BASE_REF: ${{ github.base_ref }}
          COCKPIT_TEST_DATABASE_URL: ${{ steps.postgres.outputs.adres }}
        run: |
          if [ ! -f mutants/mutanty-zmian.kod ]; then
            echo "::error::brak dowodu: nie ma mutants/mutanty-zmian.kod - nie wiadomo, czy mutmut pokryl zmiany"
            exit 1
          fi
          kod_zmian="$(cat mutants/mutanty-zmian.kod)"
          zmiany="$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD")"
          # Tylko istniejace pliki: tabela usunieta w PR nie jest dowodem.
          tabele="$(git diff --name-only --no-renames --diff-filter=d "origin/$BASE_REF...HEAD" -- 'tests/mutanty_reczne/*.toml')"
          poza_zasiegiem=0
          if [ "$kod_zmian" = "3" ]; then
            poza_zasiegiem=1
          fi
          if printf '%s\n' "$zmiany" | grep -qE '^(web|tools|cicd)/'; then
            poza_zasiegiem=1
          fi
          if [ -z "$tabele" ]; then
            if [ "$poza_zasiegiem" = "1" ]; then
              {
                echo "## Mutanty ręczne"
                echo
                echo "brak dowodu: zmiana poza zasięgiem mutmuta bez tabeli tests/mutanty_reczne/<ticket>.toml"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::brak dowodu: zmiana poza zasiegiem mutmuta (web/, tools/, cicd/ albo kod 3) wymaga tabeli tests/mutanty_reczne/<ticket>.toml - .claude/rules/test-odroznia-regule.md"
              exit 1
            fi
            {
              echo "## Mutanty ręczne"
              echo
              echo "nie dotyczy - zmiany w zasięgu mutmuta"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Sciezki tabel nie zawieraja bialych znakow (wzorzec tests/mutanty_reczne/*.toml).
          kod=0
          python3 tools/mutanty_reczne.py $tabele > mutants/mutanty-reczne.txt 2> mutants/mutanty-reczne.err || kod=$?
          {
            echo "## Mutanty ręczne"
            echo
            case "$kod" in
              0)
                echo "wszystkie ręczne mutanty zabite"
                ;;
              1)
                echo "Przeżywające ręczne mutanty (krok jest czerwony):"
                echo
                echo '```'
                cat mutants/mutanty-reczne.txt
                echo '```'
                ;;
              *)
                echo "błąd narzędzia (kod $kod):"
                echo
                echo '```'
                cat mutants/mutanty-reczne.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$kod" != "0" ]; then
            echo "::error::mutanty_reczne.py zakonczyl sie kodem $kod: $(tr '\n' ' ' < mutants/mutanty-reczne.err)"
            exit 1
          fi

      # HAR-228: kazda linia z kodu 3 (`bez mutantów — sprawdź ręcznie`) ma wiersz [[mutant]]
      # albo [[rownowazny]] w tabeli zmienionej w PR. Sama obecnosc tabeli (krok `mutanty ręczne`)
      # nie dowodzi, ze pokrywa wlasnie te linie. Brak pliku z kodem to brak dowodu; kod zmian
      # inny niz 3 to nie dotyczy (lista istnieje tylko dla kodu 3). Kod narzedzia: 0 zielony,
      # 1 brak dowodu, kazdy inny to blad narzedzia - czerwony krok.
      - name: pokrycie linii bez mutantów
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f mutants/mutanty-zmian.kod ]; then
            {
              echo "## Pokrycie linii bez mutantów"
              echo
              echo "brak dowodu: nie ma mutants/mutanty-zmian.kod"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::brak dowodu: nie ma mutants/mutanty-zmian.kod - nie wiadomo, czy mutmut pokryl zmiany"
            exit 1
          fi
          kod_zmian="$(cat mutants/mutanty-zmian.kod)"
          if [ "$kod_zmian" != "3" ]; then
            {
              echo "## Pokrycie linii bez mutantów"
              echo
              echo "nie dotyczy - mutanty_zmian.py zakończył się kodem $kod_zmian"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Pomijamy tabele usuniete w PR (--diff-filter=d): usunieta nie jest dowodem.
          tabele="$(git diff --name-only --no-renames --diff-filter=d "origin/$BASE_REF...HEAD" -- 'tests/mutanty_reczne/*.toml')"
          # Sciezki tabel nie zawieraja bialych znakow (wzorzec tests/mutanty_reczne/*.toml).
          kod=0
          python3 tools/mutanty_reczne.py --pokrycie-kod3 mutants/mutanty-zmian.txt $tabele > mutants/pokrycie-kod3.txt 2> mutants/pokrycie-kod3.err || kod=$?
          {
            echo "## Pokrycie linii bez mutantów"
            echo
            case "$kod" in
              0)
                echo "wszystkie linie bez mutantów mają wiersz albo uzasadnienie"
                ;;
              1)
                echo "brak dowodu — linie bez wiersza [[mutant]] i bez [[rownowazny]]:"
                echo
                echo '```'
                cat mutants/pokrycie-kod3.txt
                echo '```'
                ;;
              *)
                echo "błąd narzędzia (kod $kod):"
                echo
                echo '```'
                cat mutants/pokrycie-kod3.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          case "$kod" in
            0)
              ;;
            1)
              echo "::error::brak dowodu: linie bez wiersza tabeli ręcznych mutantów: $(paste -sd' ' mutants/pokrycie-kod3.txt)"
              exit 1
              ;;
            *)
              echo "::error::błąd narzędzia: mutanty_reczne.py --pokrycie-kod3 zakończył się kodem $kod: $(paste -sd' ' mutants/pokrycie-kod3.err)"
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutants/mutanty-zmian.txt
            mutants/mutanty-zmian.err
            mutants/mutanty-reczne.txt
            mutants/mutanty-reczne.err
            mutants/tabele-reczne.txt
            mutants/tabele-reczne.err
            mutants/pokrycie-kod3.txt
            mutants/pokrycie-kod3.err

  mutation-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Udane przebiegi z cache trwaly 104-119 min; przebieg bez cache (zmiana testow zmienia
    # klucz) przekroczyl 120 min i zostal anulowany, a anulowany nie zapisuje cache - kazdy
    # nastepny zaczynalby od zera i tez by sie nie zmiescil.
    timeout-minutes: 240
    # Tylko odczyt kodu i przebiegow: `gh run list/download` potrzebuje actions: read.
    permissions:
      contents: read
      actions: read
    # Dwa pelne przebiegi naraz tylko walcza o CPU i cache; nie przerywamy trwajacego,
    # bo jego wynik jest odniesieniem dla nastepnego przebiegu.
    concurrency:
      group: mutation-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      # Odczyt i zapis: jedyny job, ktory zapisuje cache mutmuta. Przywraca tylko cache z tymi
      # samymi testami i konfiguracja (jeden restore-key z hashem tests/** i pyproject.toml):
      # zmiana testow nie kasuje werdyktow mutmuta, wiec stary cache zafalszowalby pelny przebieg.
      - uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-

      # HAR-233: odniesienie zapadki to artefakt ostatniego zielonego przebiegu. Biezacy run
      # wylaczamy po identyfikatorze (pelna linia, `grep -x`): nie jest jeszcze zielony, ale
      # lista udanych przebiegow bywa odpytana, gdy inny run konczy sie rownolegle. Kazdy brak
      # (lista, przebieg, artefakt, plik) to czerwony krok: brak dowodu to nie zielone.
      - name: poprzedni zielony wynik mutation-main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh run list --repo "$REPO" --workflow mutation.yml --branch main --event push --status success --limit 20 --json databaseId --jq '.[].databaseId' > poprzednie-runy.txt; then
            echo "::error::nie udalo sie pobrac listy przebiegow mutation-main (gh run list) - zapadka bez dowodu"
            exit 1
          fi
          # Kod 1 z grep znaczy "brak linii po filtrze" (bez poprzedniego przebiegu), nie blad;
          # kod 2 to blad grepa i musi oblac krok.
          kod=0
          kandydaci="$(grep -vx "$RUN_ID" poprzednie-runy.txt)" || kod=$?
          if [ "$kod" != "0" ] && [ "$kod" != "1" ]; then
            echo "::error::grep zakonczyl sie kodem $kod przy wyborze poprzedniego przebiegu mutation-main - zapadka bez dowodu"
            exit 1
          fi
          poprzedni="$(printf '%s\n' "$kandydaci" | head -n 1)"
          if [ -z "$poprzedni" ]; then
            echo "::error::brak poprzedniego zielonego przebiegu mutation-main na main - zapadka nie ma z czym porownac"
            exit 1
          fi
          if ! gh run download "$poprzedni" --repo "$REPO" --name mutation-report --dir poprzedni; then
            echo "::error::nie udalo sie pobrac artefaktu mutation-report z przebiegu $poprzedni (wygasl albo go brak) - zapadka bez dowodu"
            exit 1
          fi
          if [ ! -f poprzedni/mutation-summary.json ]; then
            echo "::error::artefakt mutation-report przebiegu $poprzedni nie zawiera mutation-summary.json - zapadka bez dowodu"
            exit 1
          fi
          echo "poprzedni zielony przebieg: $poprzedni"

      - name: pelny przebieg mutacyjny i zapadka
        run: |
          # Brak mutmuta to brak pomiaru, wiec czerwony krok, nie pominiecie.
          command -v mutmut >/dev/null || { echo "::error::narzedzie mutacyjne (mutmut) nie jest zainstalowane na runnerze - nic nie zmierzono. Zapadka nie porownala."; exit 1; }
          # mutmut exits non-zero when tests fail to start ("failed to collect stats");
          # a stale results cache must not hide that, so the exit code is the gate.
          if ! mutmut run; then
            echo "::error::mutmut run zakonczyl sie bledem - testy nie wystartowaly w mutants/ (blad zbierania statystyk), sprawdz log mutmut run."
            exit 1
          fi
          mutmut results --all true > mutants/mutmut-results.txt
          python3 cicd/mutation_report.py --report mutants/mutmut-results.txt --format mutmut > mutation-summary.json
          # Zero killed out of many mutants means the tests never ran (e.g. import error
          # inside mutants/), not a weak suite - such a run must not become the next reference.
          if python3 -c "import json,sys; d=json.load(open('mutation-summary.json')); sys.exit(0 if d['total'] and not d['killed'] else 1)"; then
            echo "::error::mutmut nie zabil zadnego mutanta - testy najpewniej nie wystartowaly w mutants/ (sprawdz log mutmut run)."
            exit 1
          fi
          # Zapadka zwraca 0 dla kazdego porownania (takze spadku, status=down); kod niezerowy to
          # wylacznie blad wejscia (zly JSON, zly poprzedni wynik). Ukrycie go dalo by zielony job
          # i cicho martwa zapadke.
          if ! python3 cicd/mutation_baseline.py --summary mutation-summary.json --previous-summary poprzedni/mutation-summary.json --scope full; then
            echo "::error::zapadka zakonczyla sie bledem wejscia (zly poprzedni wynik albo summary) - zapadka nie dziala"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutants/mutmut-results.txt
            mutation-summary.json
          retention-days: 90
