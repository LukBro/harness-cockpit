name: mutation

# Uklad (HAR-149):
# - `mutation` (wymagany check na pull_request): mutuje TYLKO funkcje zmienione w PR
#   (tools/mutanty_zmian.py, baza = galaz docelowa PR). Przezywajacy mutant, blad
#   narzedzia i brak mutmuta to czerwony krok: brak dowodu to nie zielone.
#   Pelnego przebiegu ani zapadki tu nie ma, wiec check trwa minuty.
# - `mutation-main` (push na main, niewymagany): pelny przebieg mutmuta, raport i zapadka
#   baseline. Spadek score nie oblewa joba; przebieg, ktory niczego nie zmierzyl
#   (testy nie wystartowaly, zero zabitych), oblewa go.
# - Baseline cicd/mutation-baseline.json commituje czlowiek recznie z artefaktu
#   `mutation-report` joba mutation-main; CI niczego nie commituje ani nie pushuje.
#
# Cache mutmuta: jedyny stan mutmuta lezy w katalogu mutants/ (kopie zrodel, pliki .meta
# z wynikami i hashami funkcji, mutmut-stats.json). Zapisuje go tylko mutation-main;
# PR czyta (actions/cache/restore). Klucz w obu jobach:
# mutmut-v1-<hash tests/** i pyproject.toml>-<hash src/**>.
# Dowod w kodzie mutmut 3.8.0 (mutmut/__main__.py):
# - zrodlo nowsze od kopii w mutants/ (swiezy checkout ma mtime "teraz", tar z cache
#   zachowuje stary mtime) jest generowane od nowa (linie 159-165); przy regeneracji wynik
#   zostaje tylko dla funkcji o niezmienionym hashu AST, dla zmienionej jest kasowany do
#   None (linie 198-214). Poza hashem zrodla mutmut unieważnia wyniki takze po odcisku
#   konfiguracji pytest (_apply_config_change_invalidation, linie 624-655); w kluczu
#   pokrywa to hash pyproject.toml,
# - zmiana samych testow nie kasuje zapisanych werdyktow: nowe testy odswiezaja tylko
#   statystyki (linie 694-698), a survived/killed zostaja ze starego stanu,
# - kopia testow w mutants/tests tylko przybywa: mutmut dokleja tests/ do also_copy
#   (mutmut/configuration.py:186) i kopiuje przez shutil.copytree(dirs_exist_ok=True)
#   (mutmut/utils/file_utils.py:77), wiec nie usuwa plikow. Test usuniety w zmianie
#   zostalby w przywroconym cache i dalej zabijalby mutanty - falszywa zielen.
# Zaden job nie przywraca wiec cache z innymi testami ani konfiguracja: oba maja jeden
# restore-key z hashem tests/** i pyproject.toml. Po zmianie testow albo konfiguracji
# mutmut buduje mutants/ od zera (job PR mutuje i tak tylko zmienione funkcje, ale
# zbiera statystyki calego zestawu - dluzej, bez falszywej zieleni), a pelny przebieg
# i zapadka mierza aktualny stan. Zmiana samego src/** przy tych samych testach jest
# obsluzona przyrostowo przez hashe AST.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hosted runners have no mutmut; it comes with the project's dev extras,
      # which the tests run by mutmut need anyway. 3.13 has prebuilt libcst wheels.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      # Tylko odczyt: cache zapisuje mutation-main. Restore po checkoucie, wiec zrodla maja
      # nowszy mtime niz kopie w mutants/ (mutmut generuje je od nowa, hashe decyduja o wynikach).
      # Bez golego prefiksu `mutmut-v1-`: kopia testow w mutants/ tylko przybywa, wiec cache
      # z innymi testami zachowalby test usuniety w PR i falszywie zabijal mutanty. Przy
      # zmianie testow cache nie wraca i mutants/ powstaje od zera.
      - uses: actions/cache/restore@v4
        with:
          path: mutants
          key: mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-

      - name: mutanty zmienionych funkcji
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Brak mutmuta to brak pomiaru, wiec czerwony krok, nie pominiecie.
          command -v mutmut >/dev/null || { echo "::error::narzedzie mutacyjne (mutmut) nie jest zainstalowane na runnerze - nic nie zmierzono, check nie moze przejsc"; exit 1; }
          git fetch origin "$BASE_REF"
          mkdir -p mutants
          # Kod wyjscia narzedzia: 0 = czysto, 1 = przezywajace mutanty (czerwony krok),
          # 3 = zmiany poza zasiegiem mutmuta (HAR-144: zielony krok, lista do recznego
          # sprawdzenia w podsumowaniu), inny = blad narzedzia (czerwony krok).
          # Przechwytujemy go do zmiennej, zeby trafil do `case` ponizej, a nie zostal polkniety.
          kod=0
          python3 tools/mutanty_zmian.py --baza "origin/$BASE_REF" > mutants/mutanty-zmian.txt 2> mutants/mutanty-zmian.err || kod=$?
          # Krok `mutanty reczne` czyta ten kod: bez pliku nie wiadomo, czy mutmut pokryl zmiane.
          echo "$kod" > mutants/mutanty-zmian.kod
          {
            echo "## Mutanty zmienionych funkcji"
            echo
            case "$kod" in
              0)
                echo "czysto - brak przezywajacych mutantow albo brak zmienionych funkcji"
                ;;
              1)
                echo "Przezywajace mutanty zmienionych funkcji (bramka - krok jest czerwony):"
                echo
                echo '```'
                cat mutants/mutanty-zmian.txt
                echo '```'
                ;;
              3)
                echo "### bez mutantów — sprawdź ręcznie"
                echo
                echo "Zmiany poza zasięgiem mutmuta - wymagają ręcznego mutanta i testu (krok jest zielony):"
                echo
                echo '```'
                cat mutants/mutanty-zmian.txt
                echo '```'
                ;;
              *)
                echo "blad narzedzia (kod $kod)"
                echo
                echo '```'
                cat mutants/mutanty-zmian.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          case "$kod" in
            0)
              ;;
            1)
              echo "::error::przezywajace mutanty zmienionych funkcji - lista w podsumowaniu zadania i w artefakcie mutation-report"
              exit 1
              ;;
            3)
              echo "::warning::zmiany poza zasiegiem mutmuta - lista w podsumowaniu zadania; dopisz reczny mutant i test"
              ;;
            *)
              echo "::error::mutanty_zmian.py zakonczyl sie bledem (kod $kod): $(tr '\n' ' ' < mutants/mutanty-zmian.err)"
              exit 1
              ;;
          esac

      # HAR-150: zmiany, ktorych mutmut nie mutuje (web/, tools/, cicd/ albo kod 3 narzedzia
      # mutantow zmian), wymagaja tabeli tests/mutanty_reczne/<ticket>.toml zmienionej w PR.
      # Brak tabeli to brak dowodu, wiec czerwony krok. Tabela zmieniona w PR jest wykonywana
      # niezaleznie od zasiegu: jej czerwony wynik nie moze zostac zignorowany.
      - name: mutanty ręczne
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f mutants/mutanty-zmian.kod ]; then
            echo "::error::brak dowodu: nie ma mutants/mutanty-zmian.kod - nie wiadomo, czy mutmut pokryl zmiany"
            exit 1
          fi
          kod_zmian="$(cat mutants/mutanty-zmian.kod)"
          zmiany="$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD")"
          # Tylko istniejace pliki: tabela usunieta w PR nie jest dowodem.
          tabele="$(git diff --name-only --no-renames --diff-filter=d "origin/$BASE_REF...HEAD" -- 'tests/mutanty_reczne/*.toml')"
          poza_zasiegiem=0
          if [ "$kod_zmian" = "3" ]; then
            poza_zasiegiem=1
          fi
          if printf '%s\n' "$zmiany" | grep -qE '^(web|tools|cicd)/'; then
            poza_zasiegiem=1
          fi
          if [ -z "$tabele" ]; then
            if [ "$poza_zasiegiem" = "1" ]; then
              {
                echo "## Mutanty ręczne"
                echo
                echo "brak dowodu: zmiana poza zasięgiem mutmuta bez tabeli tests/mutanty_reczne/<ticket>.toml"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::brak dowodu: zmiana poza zasiegiem mutmuta (web/, tools/, cicd/ albo kod 3) wymaga tabeli tests/mutanty_reczne/<ticket>.toml - .claude/rules/test-odroznia-regule.md"
              exit 1
            fi
            {
              echo "## Mutanty ręczne"
              echo
              echo "nie dotyczy - zmiany w zasięgu mutmuta"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Sciezki tabel nie zawieraja bialych znakow (wzorzec tests/mutanty_reczne/*.toml).
          kod=0
          python3 tools/mutanty_reczne.py $tabele > mutants/mutanty-reczne.txt 2> mutants/mutanty-reczne.err || kod=$?
          {
            echo "## Mutanty ręczne"
            echo
            case "$kod" in
              0)
                echo "wszystkie ręczne mutanty zabite"
                ;;
              1)
                echo "Przeżywające ręczne mutanty (krok jest czerwony):"
                echo
                echo '```'
                cat mutants/mutanty-reczne.txt
                echo '```'
                ;;
              *)
                echo "błąd narzędzia (kod $kod):"
                echo
                echo '```'
                cat mutants/mutanty-reczne.err
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$kod" != "0" ]; then
            echo "::error::mutanty_reczne.py zakonczyl sie kodem $kod: $(tr '\n' ' ' < mutants/mutanty-reczne.err)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutants/mutanty-zmian.txt
            mutants/mutanty-zmian.err
            mutants/mutanty-reczne.txt
            mutants/mutanty-reczne.err

  mutation-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Dwa pelne przebiegi naraz tylko walcza o CPU i cache; nie przerywamy trwajacego,
    # bo jego wynik trafia do baseline.
    concurrency:
      group: mutation-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      # Odczyt i zapis: jedyny job, ktory zapisuje cache mutmuta. Przywraca tylko cache z tymi
      # samymi testami i konfiguracja (jeden restore-key z hashem tests/** i pyproject.toml):
      # zmiana testow nie kasuje werdyktow mutmuta, wiec stary cache zafalszowalby pelny przebieg.
      - uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            mutmut-v1-${{ hashFiles('tests/**', 'pyproject.toml') }}-

      - name: pelny przebieg mutacyjny i zapadka
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Brak mutmuta to brak pomiaru, wiec czerwony krok, nie pominiecie.
          command -v mutmut >/dev/null || { echo "::error::narzedzie mutacyjne (mutmut) nie jest zainstalowane na runnerze - nic nie zmierzono. Baseline NIE zapisany."; exit 1; }
          # mutmut exits non-zero when tests fail to start ("failed to collect stats");
          # a stale results cache must not hide that, so the exit code is the gate.
          if ! mutmut run; then
            echo "::error::mutmut run zakonczyl sie bledem - testy nie wystartowaly w mutants/ (blad zbierania statystyk), sprawdz log mutmut run. Baseline NIE zapisany."
            exit 1
          fi
          mutmut results --all true > mutants/mutmut-results.txt
          python3 cicd/mutation_report.py --report mutants/mutmut-results.txt --format mutmut > mutation-summary.json
          # Zero killed out of many mutants means the tests never ran (e.g. import error
          # inside mutants/), not a weak suite - such a run must not become the baseline.
          if python3 -c "import json,sys; d=json.load(open('mutation-summary.json')); sys.exit(0 if d['total'] and not d['killed'] else 1)"; then
            echo "::error::mutmut nie zabil zadnego mutanta - testy najpewniej nie wystartowaly w mutants/ (sprawdz log mutmut run). Baseline NIE zapisany."
            exit 1
          fi
          # Zapadka zwraca 0 dla kazdego porownania (takze spadku); kod niezerowy to wylacznie
          # blad wejscia (zly JSON, blad zapisu, brak --commit). Ukrycie go dalo by zielony job
          # i cicho martwa zapadke po zepsutym baseline.
          if ! python3 cicd/mutation_baseline.py --summary mutation-summary.json --baseline cicd/mutation-baseline.json --scope full --commit "$COMMIT_SHA"; then
            echo "::error::zapadka baseline zakonczyla sie bledem wejscia (zly baseline albo summary, blad zapisu) - zapadka nie dziala, napraw cicd/mutation-baseline.json"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutants/mutmut-results.txt
            mutation-summary.json
            cicd/mutation-baseline.json
